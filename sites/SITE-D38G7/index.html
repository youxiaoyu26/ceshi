<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 人生完成清单 - 110项</title>
    <style>
        :root {
            --bg: #f5f0eb;
            --card-bg: #ffffff;
            --text: #2c2416;
            --text-secondary: #6b5e4a;
            --accent: #c8956c;
            --accent-dark: #a0724a;
            --progress-bg: #e8ddd0;
            --progress-fill: #c8956c;
            --border: #e0d5c5;
            --tag-travel: #e8b4a2;
            --tag-learn: #a2c4c9;
            --tag-health: #b5c9a2;
            --tag-relation: #d4a8c8;
            --tag-career: #a2b5c9;
            --tag-adventure: #e8c97a;
            --tag-skill: #c9b5a2;
            --tag-creative: #c4a2c9;
            --tag-wealth: #a2c9b5;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.18);
            --radius-sm: 8px;
            --radius: 14px;
            --radius-lg: 20px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(200, 149, 108, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 90%, rgba(180, 160, 140, 0.05) 0%, transparent 60%);
        }

        /* ============ HEADER ============ */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.92);
        }
        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3d2e1c;
        }
        .header-title .icon {
            font-size: 1.8rem;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-4px);
            }
        }
        .stats-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
            min-width: 50px;
        }
        .stat-number {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-dark);
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }
        .progress-wrap {
            flex: 1;
            min-width: 120px;
            max-width: 200px;
        }
        .progress-bar-outer {
            background: var(--progress-bg);
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #d4a87c, #c8956c, #b88050);
            border-radius: 20px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .progress-bar-inner::after {
            content: '';
            position: absolute;
            right: 2px;
            top: 2px;
            bottom: 2px;
            width: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            filter: blur(2px);
        }
        .progress-text {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 3px;
            font-weight: 500;
        }

        /* ============ MAIN CONTAINER ============ */
        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px 40px;
        }

        /* ============ FILTER BAR ============ */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 4px 0;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
        }
        .filter-bar::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
            transition: var(--transition);
            color: var(--text-secondary);
            letter-spacing: 0.01em;
            flex-shrink: 0;
        }
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent-dark);
            background: #fdf8f4;
        }
        .filter-btn.active {
            background: #3d2e1c;
            color: #fff;
            border-color: #3d2e1c;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }
        .filter-btn .count {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: 2px;
        }

        /* ============ LIST ============ */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: 1.5px solid transparent;
            position: relative;
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.35s ease forwards;
            opacity: 0;
            transform: translateY(8px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .list-item:hover {
            border-color: #d5c8b8;
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .list-item:active {
            transform: scale(0.985);
            transition: 0.1s;
        }
        .list-item.completed {
            background: #faf7f2;
            border-color: #e8ddd0;
        }
        .list-item.completed .item-text {
            text-decoration: line-through;
            color: #b5a590;
            text-decoration-thickness: 1.5px;
            text-decoration-color: #d4c8b8;
        }
        .list-item.completed .item-number {
            background: #e0d5c3;
            color: #fff;
        }
        /* checkbox custom */
        .checkbox-custom {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #d5c8b8;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            background: #fff;
            position: relative;
        }
        .list-item.completed .checkbox-custom {
            background: var(--accent);
            border-color: var(--accent);
            animation: popCheck 0.4s ease;
        }
        @keyframes popCheck {
            0% {
                transform: scale(0.6);
            }
            60% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }
        .checkbox-custom svg {
            width: 14px;
            height: 14px;
            opacity: 0;
            transform: scale(0);
            transition: var(--transition);
            color: #fff;
        }
        .list-item.completed .checkbox-custom svg {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.05s;
        }
        .item-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f5f0eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
            letter-spacing: -0.02em;
            transition: var(--transition);
        }
        .item-content {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .item-text {
            font-size: 0.92rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: var(--transition);
            word-break: break-word;
        }
        .item-emoji {
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .item-tag {
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tag-travel {
            background: #fef0ea;
            color: #c0764a;
        }
        .tag-learn {
            background: #eaf4f6;
            color: #4a7c84;
        }
        .tag-health {
            background: #eef6e8;
            color: #5a7a42;
        }
        .tag-relation {
            background: #f8eef5;
            color: #8a5a7c;
        }
        .tag-career {
            background: #eaf0f6;
            color: #4a6484;
        }
        .tag-adventure {
            background: #fdf6e2;
            color: #8a6d2b;
        }
        .tag-skill {
            background: #f6f0e8;
            color: #7a6248;
        }
        .tag-creative {
            background: #f5eef8;
            color: #6a4a7c;
        }
        .tag-wealth {
            background: #eaf6f0;
            color: #3d6b52;
        }
        .item-detail-arrow {
            color: #c5b8a5;
            font-size: 0.8rem;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .list-item:hover .item-detail-arrow {
            color: var(--accent);
            transform: translateX(3px);
        }

        /* ============ EMPTY STATE ============ */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .empty-state .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        /* ============ MODAL OVERLAY ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 20, 12, 0.55);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-overlay.closing {
            animation: fadeOut 0.2s ease forwards;
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
        .modal-dialog {
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px) scale(0.94);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        .modal-dialog.closing-dialog {
            animation: slideDown 0.2s ease forwards;
        }
        @keyframes slideDown {
            from {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            to {
                transform: translateY(20px) scale(0.94);
                opacity: 0;
            }
        }
        .modal-header {
            padding: 20px 24px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0ebe0;
            position: sticky;
            top: 0;
            background: #fff;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            z-index: 1;
        }
        .modal-title {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #f5f0eb;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: #8a7a65;
            flex-shrink: 0;
        }
        .modal-close-btn:hover {
            background: #e8ddd0;
            color: #3d2e1c;
        }
        .modal-body {
            padding: 20px 24px;
        }
        .modal-body .detail-emoji {
            font-size: 3rem;
            text-align: center;
            display: block;
            margin-bottom: 12px;
        }
        .modal-body .detail-title {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .modal-body .detail-category {
            text-align: center;
            margin-bottom: 14px;
        }
        .modal-body .detail-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.7;
            margin-bottom: 16px;
        }
        .modal-body .detail-status {
            text-align: center;
            font-weight: 600;
            padding: 10px 16px;
            border-radius: 20px;
            display: inline-block;
            width: 100%;
            letter-spacing: 0.02em;
        }
        .status-done {
            background: #eaf6e8;
            color: #4a7a3d;
        }
        .status-pending {
            background: #fdf6e8;
            color: #8a6d2b;
        }
        .modal-footer {
            padding: 0 24px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            letter-spacing: 0.02em;
            transition: var(--transition);
            flex: 1;
            min-width: 100px;
            text-align: center;
        }
        .btn-primary {
            background: #3d2e1c;
            color: #fff;
        }
        .btn-primary:hover {
            background: #5a4530;
            box-shadow: var(--shadow-md);
        }
        .btn-outline {
            background: #fff;
            color: #3d2e1c;
            border: 2px solid #d5c8b8;
        }
        .btn-outline:hover {
            border-color: #3d2e1c;
            background: #fdf8f4;
        }
        .btn-danger {
            background: #fff;
            color: #c0392b;
            border: 2px solid #e8c8c4;
        }
        .btn-danger:hover {
            background: #fef5f4;
            border-color: #c0392b;
        }
        .btn-celebrate {
            background: linear-gradient(135deg, #f9d56e, #f0a550);
            color: #3d2000;
            font-size: 1rem;
            padding: 14px 28px;
            border-radius: 30px;
            animation: glowPulse 2s infinite;
            border: none;
            font-weight: 700;
        }
        @keyframes glowPulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(240, 165, 80, 0.5);
            }
            50% {
                box-shadow: 0 0 0 18px rgba(240, 165, 80, 0);
            }
        }

        /* ============ TOAST ============ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #3d2e1c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.88rem;
            z-index: 10000;
            box-shadow: var(--shadow-lg);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.02em;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ============ CONFETTI ============ */
        .confetti-piece {
            position: fixed;
            z-index: 10001;
            pointer-events: none;
            animation: confettiFall linear forwards;
            font-size: 1.5rem;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-60px) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 600px) {
            .header-inner {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .header-title {
                font-size: 1.25rem;
            }
            .stats-row {
                width: 100%;
                justify-content: space-between;
            }
            .progress-wrap {
                max-width: 100%;
            }
            .list-item {
                padding: 10px 12px;
                gap: 8px;
            }
            .item-text {
                font-size: 0.82rem;
            }
            .item-number {
                width: 26px;
                height: 26px;
                font-size: 0.7rem;
            }
            .checkbox-custom {
                width: 22px;
                height: 22px;
            }
            .checkbox-custom svg {
                width: 11px;
                height: 11px;
            }
            .filter-btn {
                padding: 6px 12px;
                font-size: 0.72rem;
            }
            .modal-dialog {
                max-width: 95vw;
                border-radius: var(--radius);
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .item-tag {
                font-size: 0.6rem;
                padding: 2px 7px;
            }
        }
        @media (max-width: 380px) {
            .item-content {
                gap: 4px;
            }
            .item-text {
                font-size: 0.76rem;
            }
            .item-detail-arrow {
                display: none;
            }
            .stats-row {
                gap: 8px;
            }
            .stat-number {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <div class="header-inner">
            <div class="header-title">
                <span class="icon">🌍</span> 人生完成清单
            </div>
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">已完成</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalCount">110</div>
                    <div class="stat-label">总计</div>
                </div>
                <div class="progress-wrap">
                    <div class="progress-bar-outer">
                        <div class="progress-bar-inner" id="progressBar" style="width: 0%;"></div>
                    </div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
            </div>
        </div>
    </header>

    <!-- ==================== MAIN ==================== -->
    <div class="main-container">
        <!-- Filter Bar -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-category="all">全部<span class="count">(110)</span></button>
            <button class="filter-btn" data-category="travel">🌍 旅行探索<span class="count">(15)</span></button>
            <button class="filter-btn" data-category="learn">📚 学习成长<span class="count">(13)</span></button>
            <button class="filter-btn" data-category="health">💪 健康运动<span class="count">(12)</span></button>
            <button class="filter-btn" data-category="relation">💞 人际关系<span class="count">(12)</span></button>
            <button class="filter-btn" data-category="career">💼 职业成就<span class="count">(12)</span></button>
            <button class="filter-btn" data-category="adventure">🔥 冒险体验<span class="count">(14)</span></button>
            <button class="filter-btn" data-category="skill">🛠 生活技能<span class="count">(12)</span></button>
            <button class="filter-btn" data-category="creative">🎨 创意表达<span class="count">(10)</span></button>
            <button class="filter-btn" data-category="wealth">💰 精神与财务<span class="count">(10)</span></button>
        </div>

        <!-- List -->
        <div class="list-container" id="listContainer"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <span class="icon">🔍</span>
            <p>该分类下暂无项目</p>
        </div>
    </div>

    <!-- ==================== MODAL: 详情弹窗 ==================== -->
    <div class="modal-overlay" id="detailModal" style="display:none;">
        <div class="modal-dialog" id="detailDialog">
            <div class="modal-header">
                <span class="modal-title" id="detailModalTitle">📋 项目详情</span>
                <button class="modal-close-btn" id="detailModalClose">✕</button>
            </div>
            <div class="modal-body" id="detailModalBody"></div>
            <div class="modal-footer" id="detailModalFooter"></div>
        </div>
    </div>

    <!-- ==================== MODAL: 确认弹窗 ==================== -->
    <div class="modal-overlay" id="confirmModal" style="display:none;">
        <div class="modal-dialog" id="confirmDialog" style="max-width:380px;">
            <div class="modal-header">
                <span class="modal-title">⚠️ 确认操作</span>
                <button class="modal-close-btn" id="confirmModalClose">✕</button>
            </div>
            <div class="modal-body" id="confirmModalBody" style="text-align:center;font-size:0.95rem;"></div>
            <div class="modal-footer" id="confirmModalFooter"></div>
        </div>
    </div>

            // ============ STATE ============
            const STORAGE_KEY = 'life_checklist_110_completed';
            let completedSet = new Set();
            let currentFilter = 'all';
            let celebrationMilestones = new Set([10, 25, 50, 75, 100, 110]); // 庆祝节点

            // ============ DOM REFS ============
            const listContainer = document.getElementById('listContainer');
            const emptyState = document.getElementById('emptyState');
            const completedCountEl = document.getElementById('completedCount');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const filterBar = document.getElementById('filterBar');
            const toast = document.getElementById('toast');

            // Modal refs
            const detailModal = document.getElementById('detailModal');
            const detailDialog = document.getElementById('detailDialog');
            const detailModalTitle = document.getElementById('detailModalTitle');
            const detailModalBody = document.getElementById('detailModalBody');
            const detailModalFooter = document.getElementById('detailModalFooter');
            const detailModalClose = document.getElementById('detailModalClose');

            const confirmModal = document.getElementById('confirmModal');
            const confirmDialog = document.getElementById('confirmDialog');
            const confirmModalBody = document.getElementById('confirmModalBody');
            const confirmModalFooter = document.getElementById('confirmModalFooter');
            const confirmModalClose = document.getElementById('confirmModalClose');

            const celebrateModal = document.getElementById('celebrateModal');
            const celebrateDialog = document.getElementById('celebrateDialog');
            const celebrateModalBody = document.getElementById('celebrateModalBody');
            const celebrateModalCloseBtn = document.getElementById('celebrateModalCloseBtn');

            // ============ INIT ============
            function loadFromStorage() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (data) {
                        const arr = JSON.parse(data);
                        if (Array.isArray(arr)) {
                            completedSet = new Set(arr.filter(n => Number.isInteger(n) && n >= 1 && n <= 110));
                        }
                    }
                } catch (e) {
                    completedSet = new Set();
                }
            }

            function saveToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify([...completedSet]));
                } catch (e) {
                    // storage full or unavailable
                }
            }

            function updateStats() {
                const count = completedSet.size;
                const total = allItems.length;
                const percent = total > 0 ? Math.round((count / total) * 100) : 0;
                completedCountEl.textContent = count;
                progressBar.style.width = percent + '%';
                progressText.textContent = percent + '%';
            }

            // ============ TOAST ============
            let toastTimer;

            function showToast(message) {
                clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            // ============ CONFETTI ============
            function spawnConfetti() {
                const emojis = ['🎉', '✨', '🌟', '💫', '🎊', '🥳', '👏', '💖', '🔥', '⭐'];
                const colors = ['#f9d56e', '#f0a550', '#e8b4a2', '#c8956c', '#b5c9a2', '#a2c4c9', '#d4a8c8',
                '#ff6b6b'];
                for (let i = 0; i < 50; i++) {
                    const piece = document.createElement('span');
                    piece.className = 'confetti-piece';
                    piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.top = -(Math.random() * 40 + 10) + 'px';
                    piece.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                    piece.style.animationDelay = Math.random() * 0.8 + 's';
                    piece.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
                    document.body.appendChild(piece);
                    setTimeout(() => {
                        if (piece.parentNode) piece.parentNode.removeChild(piece);
                    }, 3500);
                }
            }

            // ============ MODAL: 通用方法 ============
            function openModal(overlay, dialog) {
                overlay.style.display = 'flex';
                overlay.classList.remove('closing');
                dialog.classList.remove('closing-dialog');
                // 强制回流后添加动画
                void dialog.offsetWidth;
                dialog.style.animation = 'none';
                dialog.offsetHeight;
                dialog.style.animation = '';
            }

            function closeModal(overlay, dialog, callback) {
                overlay.classList.add('closing');
                dialog.classList.add('closing-dialog');
                const onAnimEnd = () => {
                    overlay.style.display = 'none';
                    overlay.classList.remove('closing');
                    dialog.classList.remove('closing-dialog');
                    dialog.removeEventListener('animationend', onAnimEnd);
                    if (callback) callback();
                };
                dialog.addEventListener('animationend', onAnimEnd, { once: true });
                // 兜底
                setTimeout(() => {
                    if (overlay.style.display !== 'none') {
                        overlay.style.display = 'none';
                        overlay.classList.remove('closing');
                        dialog.classList.remove('closing-dialog');
                        if (callback) callback();
                    }
                }, 350);
            }

            function closeModalImmediate(overlay, dialog) {
                overlay.style.display = 'none';
                overlay.classList.remove('closing');
                dialog.classList.remove('closing-dialog');
            }

            // ============ MODAL: 详情弹窗 ============
            function showDetailModal(item) {
                const isCompleted = completedSet.has(item.id);
                detailModalTitle.innerHTML = '📋 项目详情';
                detailModalBody.innerHTML = `
                    <span class="detail-emoji">${item.emoji}</span>
                    <div class="detail-title">#${item.id} ${item.text}</div>
                    <div class="detail-category">
                        <span class="item-tag tag-${item.category}">${item.tag}</span>
                    </div>
                    <p class="detail-desc">${item.desc}</p>
                    <div class="detail-status ${isCompleted ? 'status-done' : 'status-pending'}">
                        ${isCompleted ? '✅ 已完成' : '⏳ 尚未完成'}
                    </div>
                `;
                detailModalFooter.innerHTML = `
                    <button class="btn btn-outline" id="detailModalCancel">关闭</button>
                    <button class="btn btn-primary" id="detailModalToggle">
                        ${isCompleted ? '↩ 标记为未完成' : '✅ 标记为已完成'}
                    </button>
                `;

                openModal(detailModal, detailDialog);

                // 事件绑定
                const btnToggle = document.getElementById('detailModalToggle');
                const btnCancel = document.getElementById('detailModalCancel');

                const cleanup = () => {
                    btnToggle?.removeEventListener('click', onToggle);
                    btnCancel?.removeEventListener('click', onCancel);
                    detailModalClose.removeEventListener('click', onClose);
                };

                const onToggle = () => {
                    toggleItem(item, !completedSet.has(item.id));
                    closeModal(detailModal, detailDialog, () => {
                        cleanup();
                        // 重新打开更新后的详情
                        setTimeout(() => showDetailModal(item), 150);
                    });
                };
                const onCancel = () => {
                    closeModal(detailModal, detailDialog, cleanup);
                };
                const onClose = () => {
                    closeModal(detailModal, detailDialog, cleanup);
                };

                btnToggle?.addEventListener('click', onToggle);
                btnCancel?.addEventListener('click', onCancel);
                detailModalClose.addEventListener('click', onClose);

                // 点击遮罩关闭
                detailModal.onclick = function(e) {
                    if (e.target === detailModal) {
                        closeModal(detailModal, detailDialog, cleanup);
                        detailModal.onclick = null;
                    }
                };
            }

            // ============ MODAL: 确认弹窗 ============
            function showConfirmModal(message, onConfirm, confirmLabel = '确认', confirmClass = 'btn-primary') {
                confirmModalBody.textContent = message;
                confirmModalFooter.innerHTML = `
                    <button class="btn btn-outline" id="confirmModalCancelBtn">取消</button>
                    <button class="btn ${confirmClass}" id="confirmModalConfirmBtn">${confirmLabel}</button>
                `;
                openModal(confirmModal, confirmDialog);

                const btnConfirm = document.getElementById('confirmModalConfirmBtn');
                const btnCancel = document.getElementById('confirmModalCancelBtn');

                const cleanup = () => {
                    btnConfirm?.removeEventListener('click', onConfirmClick);
                    btnCancel?.removeEventListener('click', onCancelClick);
                    confirmModalClose.removeEventListener('click', onCloseClick);
                };

                const onConfirmClick = () => {
                    closeModal(confirmModal, confirmDialog, () => {
                        cleanup();
                        if (onConfirm) onConfirm();
                    });
                };
                const onCancelClick = () => {
                    closeModal(confirmModal, confirmDialog, cleanup);
                };
                const onCloseClick = () => {
                    closeModal(confirmModal, confirmDialog, cleanup);
                };

                btnConfirm?.addEventListener('click', onConfirmClick);
                btnCancel?.addEventListener('click', onCancelClick);
                confirmModalClose.addEventListener('click', onCloseClick);

                confirmModal.onclick = function(e) {
                    if (e.target === confirmModal) {
                        closeModal(confirmModal, confirmDialog, cleanup);
                        confirmModal.onclick = null;
                    }
                };
            }

            // ============ MODAL: 庆祝弹窗 ============
            function showCelebrateModal(count) {
                let message = '';
                if (count === 110) {
                    message = '🏆 不可思议！你完成了全部110项人生清单！<br>你的人生堪称传奇！';
                } else if (count >= 100) {
                    message = `🌟 你已经完成了 <b>${count}</b> 项！<br>离大圆满只差一步之遥，继续冲刺！`;
                } else if (count >= 75) {
                    message = `🎯 太厉害了！已完成 <b>${count}</b> 项！<br>你的人生体验已经非常丰富！`;
                } else if (count >= 50) {
                    message = `🎉 过半了！已完成 <b>${count}</b> 项！<br>你正在认真活出精彩人生！`;
                } else if (count >= 25) {
                    message = `👏 已完成 <b>${count}</b> 项！<br>四分之一的路程已走过，继续保持！`;
                } else {
                    message = `💪 已完成 <b>${count}</b> 项！<br>好的开始是成功的一半，加油！`;
                }
                celebrateModalBody.innerHTML = `
                    <p style="font-size:3rem;margin-bottom:8px;">🎊</p>
                    <p style="font-size:1.05rem;line-height:1.8;">${message}</p>
                `;
                openModal(celebrateModal, celebrateDialog);
                spawnConfetti();

                const cleanup = () => {
                    celebrateModalCloseBtn.removeEventListener('click', onClose);
                };
                const onClose = () => {
                    closeModal(celebrateModal, celebrateDialog, cleanup);
                };
                celebrateModalCloseBtn.addEventListener('click', onClose);
                celebrateModal.onclick = function(e) {
                    if (e.target === celebrateModal) {
                        closeModal(celebrateModal, celebrateDialog, cleanup);
                        celebrateModal.onclick = null;
                    }
                };
            }

            // ============ TOGGLE ITEM ============
            function toggleItem(item, setToCompleted) {
                const prevCount = completedSet.size;
                if (setToCompleted) {
                    completedSet.add(item.id);
                } else {
                    completedSet.delete(item.id);
                }
                const newCount = completedSet.size;
                saveToStorage();
                updateStats();
                renderList(currentFilter);

                // 提示
                if (setToCompleted && newCount > prevCount) {
                    showToast(`✅ 已完成：#${item.id} ${item.text}`);
                    // 检查庆祝节点
                    if (celebrationMilestones.has(newCount)) {
                        setTimeout(() => showCelebrateModal(newCount), 400);
                    }
                } else if (!setToCompleted && newCount < prevCount) {
                    showToast(`↩ 已取消：#${item.id} ${item.text}`);
                }
            }

            // ============ RENDER LIST ============
            function renderList(filter) {
                let itemsToShow = allItems;
                if (filter !== 'all') {
                    itemsToShow = allItems.filter(item => item.category === filter);
                }

                if (itemsToShow.length === 0) {
                    listContainer.innerHTML = '';
                    emptyState.style.display = 'block';
                } else {
                    emptyState.style.display = 'none';
                    listContainer.innerHTML = itemsToShow.map((item, index) => {
                        const isCompleted = completedSet.has(item.id);
                        return `
                            <div class="list-item ${isCompleted ? 'completed' : ''}"
                                 style="animation-delay:${index * 0.012}s;"
                                 data-id="${item.id}">
                                <div class="checkbox-custom">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                                <div class="item-number">${item.id}</div>
                                <div class="item-content">
                                    <span class="item-emoji">${item.emoji}</span>
                                    <span class="item-text">${item.text}</span>
                                    <span class="item-tag tag-${item.category}">${item.tag}</span>
                                </div>
                                <span class="item-detail-arrow">›</span>
                            </div>
                        `;
                    }).join('');

                    // 绑定事件
                    const items = listContainer.querySelectorAll('.list-item');
                    items.forEach(el => {
                        el.addEventListener('click', function(e) {
                            const id = parseInt(this.getAttribute('data-id'));
                            const item = allItems.find(i => i.id === id);
                            if (item) {
                                // 判断点击的是否是复选框区域（左侧）
                                const checkbox = this.querySelector('.checkbox-custom');
                                const rect = checkbox.getBoundingClientRect();
                                const clickX = e.clientX;
                                if (clickX <= rect.right + 8) {
                                    // 点击左侧 → 切换完成状态
                                    toggleItem(item, !completedSet.has(item.id));
                                } else {
                                    // 点击右侧 → 打开详情弹窗
                                    showDetailModal(item);
                                }
                            }
                        });
                    });
                }
                updateStats();
            }

            // ============ FILTER ============
            function setFilter(category) {
                currentFilter = category;
                const buttons = filterBar.querySelectorAll('.filter-btn');
                buttons.forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-category') === category);
                });
                renderList(category);
                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            filterBar.addEventListener('click', function(e) {
                const btn = e.target.closest('.filter-btn');
                if (!btn) return;
                const category = btn.getAttribute('data-category');
                if (category) {
                    setFilter(category);
                }
            });

            // ============ KEYBOARD SHORTCUTS ============
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    // 关闭所有弹窗
                    if (detailModal.style.display === 'flex') {
                        closeModalImmediate(detailModal, detailDialog);
                    }
                    if (confirmModal.style.display === 'flex') {
                        closeModalImmediate(confirmModal, confirmDialog);
                    }
                    if (celebrateModal.style.display === 'flex') {
                        closeModalImmediate(celebrateModal, celebrateDialog);
                    }
                }
            });

            // ============ RESET BUTTON (添加在header或filter附近) ============
            // 在filter bar后添加一个小的重置按钮区域
            const resetArea = document.createElement('div');
            resetArea.style.cssText = 'text-align:right;margin-bottom:8px;';
            resetArea.innerHTML =
                '<button id="resetAllBtn" style="background:none;border:1px solid #e0d5c5;padding:6px 14px;border-radius:16px;cursor:pointer;font-size:0.75rem;color:#a09080;transition:all 0.2s;">🔄 重置全部</button>';
            filterBar.insertAdjacentElement('afterend', resetArea);

            document.getElementById('resetAllBtn').addEventListener('click', function() {
                if (completedSet.size === 0) {
                    showToast('📭 当前没有已完成的项目');
                    return;
                }
                showConfirmModal(
                    `确定要重置所有进度吗？<br>当前已完成 <b>${completedSet.size}</b> 项，此操作不可恢复。`,
                    () => {
                        completedSet.clear();
                        saveToStorage();
                        updateStats();
                        renderList(currentFilter);
                        showToast('🔄 已重置全部清单');
                    },
                    '确认重置',
                    'btn-danger'
                );
            });

            // 悬停效果
            document.getElementById('resetAllBtn').addEventListener('mouseenter', function() {
                this.style.borderColor = '#c0392b';
                this.style.color = '#c0392b';
            });
            document.getElementById('resetAllBtn').addEventListener('mouseleave', function() {
                this.style.borderColor = '#e0d5c5';
                this.style.color = '#a09080';
            });

            // ============ STARTUP ============
            loadFromStorage();
            updateStats();
            setFilter('all');

            // 初始庆祝检查（如果从存储加载后有里程碑）
            const initialCount = completedSet.size;
            if (celebrationMilestones.has(initialCount) && initialCount > 0) {
                setTimeout(() => showCelebrateModal(initialCount), 600);
            }

            console.log('🌟 人生完成清单已就绪！');
            console.log(`   总计 110 项 | 已完成 ${initialCount} 项 | 进度 ${Math.round((initialCount/110)*100)}%`);
            console.log('   💡 点击项目左侧圆圈切换完成状态');
            console.log('   💡 点击项目右侧查看详情弹窗');
            console.log('   💡 所有弹窗均为自定义HTML实现');
            console.log('   💡 数据自动保存在浏览器本地存储中');
        })();
    </script>
</body>
</html>
