<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>国家模拟器</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --primary:#00897B;--primary-dark:#00695C;--primary-light:#B2DFDB;
  --accent:#FF6D00;--accent-light:#FF9E40;
  --bg:#FAFAFA;--surface:#fff;--text1:#212121;--text2:#757575;--divider:#BDBDBD;
  --tb-h:56px;--bb-h:56px;
  --e1:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.24);
  --e2:0 3px 6px rgba(0,0,0,.16),0 3px 6px rgba(0,0,0,.23);
  --e4:0 10px 20px rgba(0,0,0,.19),0 6px 6px rgba(0,0,0,.23);
  --e8:0 15px 25px rgba(0,0,0,.22),0 5px 10px rgba(0,0,0,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Roboto',sans-serif;background:var(--bg);color:var(--text1);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation}
#app{width:100%;height:100%;position:relative;overflow:hidden}

/* 顶栏：在 .pg 内用 sticky 脱离滚动 */
.tb{width:100%;height:var(--tb-h);background:var(--primary);display:flex;align-items:center;padding:0 16px;box-shadow:var(--e2);z-index:100;flex-shrink:0}
.pg>.tb{position:sticky;top:0;left:0}
.tb-title{font-size:18px;font-weight:500;color:#fff;letter-spacing:.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-icon{color:#fff;font-size:24px;cursor:pointer;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;position:relative;overflow:hidden;flex-shrink:0}
.tb-icon:active{background:rgba(255,255,255,.12)}

/* 页面容器 */
.pg{position:absolute;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s;opacity:0;z-index:10;pointer-events:none}
.pg.active{transform:translateX(0);opacity:1;z-index:20;pointer-events:auto}
.pg.no-tb{top:0}
.pg.has-tb{top:0}
.pg::-webkit-scrollbar{display:none}
/* 游戏页面底部留出底部栏空间 */
#pg-game{padding-bottom:calc(var(--bb-h) + 6px)}

.rip{position:relative;overflow:hidden}
.rip-fx{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rip-a .55s ease-out;pointer-events:none}
@keyframes rip-a{to{transform:scale(4);opacity:0}}

.btn-r{background:var(--primary);color:#fff;border:none;padding:0 16px;height:36px;border-radius:2px;font-size:13px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;box-shadow:var(--e1);position:relative;overflow:hidden;font-family:inherit;white-space:nowrap;flex-shrink:0}
.btn-r:active{box-shadow:none}
.btn-r.acc{background:var(--accent)}.btn-r.danger{background:#D32F2F}
.btn-f{background:transparent;color:var(--primary);border:none;padding:0 12px;height:36px;border-radius:2px;font-size:13px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;font-family:inherit;white-space:nowrap;flex-shrink:0}
.btn-lg{height:44px;padding:0 28px;font-size:15px}

.cd{background:var(--surface);border-radius:2px;box-shadow:var(--e1);margin:8px 16px;overflow:hidden}
.cd-c{padding:16px}
.cd-t{font-size:16px;font-weight:500;margin-bottom:4px}
.cd-s{font-size:14px;color:var(--text2);margin-bottom:8px}

.ig{position:relative;margin:12px 0}
.ig input{width:100%;border:none;border-bottom:1px solid var(--divider);padding:10px 0;font-size:16px;font-family:inherit;color:var(--text1);background:transparent;outline:none;transition:border-color .3s}
.ig input:focus{border-bottom:2px solid var(--primary)}
.ig label{position:absolute;top:10px;left:0;font-size:16px;color:var(--text2);pointer-events:none;transition:all .25s cubic-bezier(.4,0,.2,1)}
.ig input:focus+label,.ig input:not(:placeholder-shown)+label{top:-14px;font-size:12px;color:var(--primary)}

.cp{display:flex;gap:10px;flex-wrap:wrap;padding:8px 0;align-items:center}
.co{width:38px;height:38px;border-radius:50%;cursor:pointer;position:relative;border:3px solid transparent;transition:transform .15s;flex-shrink:0}
.co:active{transform:scale(.88)}
.co.sel{border-color:var(--text1)}
.co.sel::after{content:'\2713';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.custom-co{position:relative;overflow:hidden}
.custom-co input[type="color"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0}
.custom-co .co-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(255,255,255,.75);pointer-events:none}

.size-sel{display:flex;border:1px solid var(--divider);border-radius:2px;overflow:hidden}
.sz-btn{flex:1;padding:9px 0;border:none;background:transparent;font-size:14px;font-family:inherit;color:var(--text2);cursor:pointer;transition:all .2s;border-right:1px solid var(--divider)}
.sz-btn:last-child{border-right:none}
.sz-btn.active{background:var(--primary);color:#fff}
.sz-btn:active{background:var(--primary-light)}

#snack{position:absolute;bottom:72px;left:16px;right:16px;background:#323232;color:#fff;padding:14px 20px;border-radius:2px;font-size:14px;box-shadow:var(--e4);transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:5000;max-width:400px;margin:0 auto;text-align:center;pointer-events:none}
#snack.show{transform:translateY(0);opacity:1}

.home-c{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:32px;background:linear-gradient(160deg,#004D40 0%,var(--primary) 60%,#26A69A 100%);text-align:center}
.home-logo{width:88px;height:88px;background:rgba(255,255,255,.12);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:28px}
.home-logo .material-icons{font-size:44px;color:#fff}
.home-t{font-size:26px;font-weight:300;color:#fff;letter-spacing:3px;margin-bottom:6px}
.home-sub{font-size:13px;color:rgba(255,255,255,.6);letter-spacing:1.5px;margin-bottom:52px;text-transform:uppercase}
.home-ver{position:absolute;bottom:24px;font-size:11px;color:rgba(255,255,255,.3)}

.map-wrap{padding:8px;display:flex;justify-content:center}
.map-g{display:grid;gap:2px;background:#CFD8DC;border:2px solid #B0BEC5;border-radius:2px;box-shadow:var(--e1)}
.mc{width:100%;aspect-ratio:1;cursor:pointer;position:relative;transition:filter .12s,background .3s;display:flex;align-items:center;justify-content:center}
.mc:active{filter:brightness(.85)}
.mc.t-p{background:#C8E6C9}.mc.t-m{background:#BDBDBD}.mc.t-f{background:#81C784}.mc.t-w{background:#81D4FA;cursor:not-allowed}
.mc .material-icons{font-size:14px;color:rgba(0,0,0,.25);pointer-events:none}
.mc .cell-label{font-size:9px;color:rgba(255,255,255,.8);pointer-events:none;font-weight:500}
.mc.sel-hint{animation:pulse-c 1.2s infinite}
@keyframes pulse-c{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes cell-cap{0%{transform:scale(.4);opacity:.4}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.mc.captured{animation:cell-cap .35s ease-out}

.place-hint{text-align:center;padding:10px 16px;font-size:13px;color:var(--primary-dark);background:var(--primary-light);font-weight:500}
.atk-hint{background:#FFCDD2;color:#C62828;text-align:center;padding:8px;font-size:13px;font-weight:500;display:none}
.atk-hint.show{display:block}

.res-bar{display:flex;background:var(--surface);padding:6px 12px;gap:14px;border-top:1px solid var(--divider);overflow-x:auto;flex-shrink:0}
.res-i{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--text2);white-space:nowrap}
.res-i .material-icons{font-size:15px}
.res-v{font-weight:500;color:var(--text1)}
.res-delta{font-size:10px;color:#43A047}
.res-delta.neg{color:#E53935}

.act-panel{padding:6px 8px;display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--bg);flex-shrink:0;transition:opacity .3s}
.act-panel.disabled{opacity:.35;pointer-events:none}
.act-btn{background:var(--surface);border:none;border-radius:2px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;box-shadow:var(--e1);position:relative;overflow:hidden;font-family:inherit;min-height:46px}
.act-btn:active{box-shadow:none;background:#F5F5F5}
.act-btn .material-icons{font-size:20px;color:var(--primary)}
.act-btn .a-l{font-size:11px;color:var(--text1);font-weight:500;line-height:1.2}
.act-btn .a-c{font-size:9px;color:var(--text2);line-height:1.1}
.act-btn:disabled{opacity:.4;pointer-events:none}
@media(min-width:420px){.act-panel{grid-template-columns:repeat(4,1fr);gap:6px}}

/* 底部栏：放在 #app 直接子级，脱离页面滚动 */
.bb{position:absolute;bottom:0;left:0;right:0;width:100%;height:var(--bb-h);background:var(--surface);display:none;align-items:center;gap:6px;box-shadow:0 -2px 8px rgba(0,0,0,.1);z-index:998;padding:0 10px}
.bb.show{display:flex}
.bb-spacer{flex:1}
.sp-bar{display:none;align-items:center;gap:2px}
.sp-bar.show{display:flex}
.sp-btn{border:none;background:transparent;color:var(--text2);font-size:11px;font-family:inherit;padding:4px 7px;border-radius:2px;cursor:pointer;height:26px;min-width:auto;line-height:1;transition:all .15s}
.sp-btn:active{background:#eee}
.sp-btn.sp-act{background:var(--primary-light);color:var(--primary-dark);font-weight:500}
.auto-on{background:var(--accent)!important;color:#fff!important}

.battle-c{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
.b-vs{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.b-n{width:72px;height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.b-n.bl{animation:bb-l .45s ease-in-out infinite alternate}
.b-n.br{animation:bb-r .45s ease-in-out infinite alternate}
@keyframes bb-l{from{transform:translateX(0)}to{transform:translateX(6px)}}
@keyframes bb-r{from{transform:translateX(0)}to{transform:translateX(-6px)}}
.b-vt{font-size:28px;font-weight:700;color:var(--accent);text-shadow:0 0 20px rgba(255,109,0,.4)}
.b-pw{font-size:14px;color:rgba(255,255,255,.6);text-align:center;margin-top:8px}
.b-pw span{font-size:22px;font-weight:700;color:#fff;display:block;margin-top:2px}
.b-result{font-size:22px;font-weight:700;color:#fff;margin-top:20px;opacity:0;transition:opacity .5s;text-align:center}
.b-result.show{opacity:1}
.b-log{max-width:280px;margin-top:12px;padding:10px 14px;background:rgba(255,255,255,.08);border-radius:2px;color:rgba(255,255,255,.6);font-size:12px;text-align:center;line-height:1.5}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .25s ease-in-out 3}

.res-c{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100%;padding:48px 32px 32px;text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.res-c::-webkit-scrollbar{display:none}
.res-ic{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:var(--e8);flex-shrink:0}
.res-ic .material-icons{font-size:40px;color:#fff}
.res-t{font-size:28px;font-weight:500;margin-bottom:8px}
.res-s{font-size:15px;color:var(--text2);margin-bottom:32px;line-height:1.5}
.res-stats{width:100%;max-width:420px;background:var(--surface);border-radius:2px;box-shadow:var(--e1);overflow:hidden;margin-bottom:36px;flex-shrink:0}
.res-stats-title{padding:14px 20px;font-size:14px;font-weight:500;color:var(--text2);border-bottom:1px solid var(--divider);text-align:left;letter-spacing:.5px}
.st-row{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #F5F5F5;font-size:15px}
.st-row:last-child{border-bottom:none}
.st-l{color:var(--text2);display:flex;align-items:center;gap:8px}
.st-l .material-icons{font-size:18px;color:var(--primary)}
.st-v{font-weight:500;font-size:16px}

.cmp{display:flex;padding:4px 12px;gap:6px;flex-shrink:0}
.cmp-c{flex:1;background:var(--surface);border-radius:2px;padding:8px 10px;box-shadow:var(--e1)}
.cmp-n{font-size:11px;font-weight:500;margin-bottom:3px;display:flex;align-items:center;gap:4px}
.cmp-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cmp-s{font-size:10px;color:var(--text2);line-height:1.6}
.cmp-s b{color:var(--text1);font-weight:500}

.turn-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:var(--primary);color:#fff;padding:14px 28px;border-radius:2px;box-shadow:var(--e8);font-size:18px;font-weight:500;z-index:2500;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;white-space:nowrap}
.turn-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.dlg-ov{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:3000;display:none;align-items:center;justify-content:center;padding:24px}
.dlg-ov.show{display:flex}
.dlg{background:var(--surface);border-radius:2px;box-shadow:var(--e8);max-width:320px;width:100%;animation:dlg-in .2s ease-out}
@keyframes dlg-in{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.dlg-t{padding:20px 20px 0;font-size:18px;font-weight:500}
.dlg-b{padding:14px 20px;font-size:14px;color:var(--text2);line-height:1.6}
.dlg-a{padding:8px;display:flex;justify-content:flex-end;gap:8px}

.ai-thinking{display:none;text-align:center;padding:8px;font-size:13px;color:var(--text2)}
.ai-thinking.show{display:block}
.ai-dots::after{content:'...';animation:dots 1s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

.auto-indicator{display:none;align-items:center;gap:4px;padding:4px 12px;background:var(--accent-light);font-size:12px;color:#E65100;font-weight:500;flex-shrink:0}
.auto-indicator.show{display:flex}
.auto-indicator .material-icons{font-size:14px;animation:auto-pulse 1s infinite}
@keyframes auto-pulse{0%,100%{opacity:1}50%{opacity:.4}}

@media(min-width:600px){.bb.show{padding:0 16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">

  <div id="pg-home" class="pg no-tb active">
    <div class="home-c">
      <div class="home-logo"><span class="material-icons">public</span></div>
      <div class="home-t">国家模拟器</div>
      <div class="home-sub">赛博斗蛐蛐</div>
      <button class="btn-r btn-lg rip" onclick="goPage('pg-config')">开始游戏</button>
      <div class="home-ver">v2.3.0</div>
    </div>
  </div>

  <div id="pg-config" class="pg has-tb">
    <div class="tb"><span class="tb-icon rip" onclick="goPage('pg-home')"><span class="material-icons">arrow_back</span></span><span class="tb-title">配置国家</span></div>
    <div style="padding-top:12px">
      <div class="cd"><div class="cd-c">
        <div class="cd-t">地图尺寸</div><div class="cd-s">选择战场大小，地图越大资源越多</div>
        <div class="size-sel" id="size-sel">
          <button class="sz-btn" data-size="5">5x5</button>
          <button class="sz-btn active" data-size="7">7x7</button>
          <button class="sz-btn" data-size="9">9x9</button>
          <button class="sz-btn" data-size="11">11x11</button>
        </div>
      </div></div>
      <div class="cd"><div class="cd-c">
        <div class="cd-t">你的国家</div><div class="cd-s">选择颜色并命名你的国家</div>
        <div class="cp" id="cp1"></div>
        <div class="ig"><input id="n1" placeholder=" " maxlength="8" value="赤焰帝国"><label>国家名称</label></div>
      </div></div>
      <div class="cd"><div class="cd-c">
        <div class="cd-t">对手国家</div><div class="cd-s">配置你的对手（由AI控制）</div>
        <div class="cp" id="cp2"></div>
        <div class="ig"><input id="n2" placeholder=" " maxlength="8" value="苍蓝联邦"><label>国家名称</label></div>
      </div></div>
      <div style="padding:16px;display:flex;justify-content:flex-end;gap:8px">
        <button class="btn-f rip" onclick="randomConfig()">随机配置</button>
        <button class="btn-r rip" onclick="startPlace()">下一步</button>
      </div>
    </div>
  </div>

  <div id="pg-place" class="pg has-tb">
    <div class="tb"><span class="tb-icon rip" onclick="goPage('pg-config')"><span class="material-icons">arrow_back</span></span><span class="tb-title">放置领土</span></div>
    <div class="place-hint" id="place-hint">点击地图选择3个相邻格子作为起始领土</div>
    <div class="map-wrap"><div class="map-g" id="place-map"></div></div>
    <div style="padding:12px 16px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-f rip" onclick="resetPlace()">重选</button>
      <button class="btn-r rip" id="btn-place-ok" onclick="confirmPlace()" disabled>确认放置</button>
    </div>
  </div>

  <div id="pg-game" class="pg has-tb">
    <div class="tb" id="game-tb"><span class="tb-icon rip" onclick="showQuitDialog()"><span class="material-icons">menu</span></span><span class="tb-title" id="game-tb-title">第 1 回合</span><span class="tb-icon rip" onclick="showInfoDialog()"><span class="material-icons">info_outline</span></span></div>
    <div class="auto-indicator" id="auto-ind"><span class="material-icons">smart_toy</span>自动模式运行中</div>
    <div class="cmp" id="game-cmp"></div>
    <div class="atk-hint" id="atk-hint">点击敌方相邻格子发起进攻</div>
    <div class="map-wrap"><div class="map-g" id="game-map"></div></div>
    <div class="ai-thinking" id="ai-thinking">对手行动中<span class="ai-dots"></span></div>
    <div class="res-bar" id="res-bar"></div>
    <div class="act-panel" id="act-panel"></div>
  </div>

  <div id="pg-battle" class="pg no-tb">
    <div class="battle-c" id="battle-arena"></div>
  </div>

  <div id="pg-result" class="pg no-tb">
    <div class="res-c" id="result-content"></div>
  </div>

  <!-- 底部栏：放在 #app 直接子级，不受页面滚动影响 -->
  <div class="bb" id="game-bb">
    <button class="btn-r acc rip" id="btn-end-turn" onclick="endTurn()">结束回合</button>
    <button class="btn-r danger rip" id="btn-attack" onclick="toggleAttackMode()" style="display:none">进攻</button>
    <button class="btn-f rip" onclick="showLogs()" style="height:32px;font-size:12px;padding:0 10px"><span class="material-icons" style="font-size:16px;vertical-align:middle">receipt_long</span>战报</button>
    <div class="bb-spacer"></div>
    <div class="sp-bar" id="speed-bar">
      <button class="sp-btn" data-speed="2000">慢</button>
      <button class="sp-btn sp-act" data-speed="900">正常</button>
      <button class="sp-btn" data-speed="350">快</button>
      <button class="sp-btn" data-speed="60">极速</button>
    </div>
    <button class="btn-f rip" id="btn-auto" onclick="toggleAuto()" style="height:32px;font-size:12px;padding:0 10px">
      <span class="material-icons" style="font-size:16px;vertical-align:middle" id="auto-icon">smart_toy</span>
      <span id="auto-label">自动</span>
    </button>
  </div>

  <div class="turn-banner" id="turn-banner"></div>
  <div id="snack"></div>
  <div class="dlg-ov" id="dlg"><div class="dlg"><div class="dlg-t" id="dlg-t"></div><div class="dlg-b" id="dlg-b"></div><div class="dlg-a" id="dlg-a"></div></div></div>
</div>

<script>
var COLORS=['#D32F2F','#1565C0','#2E7D32','#E65100','#6A1B9A','#00838F','#F9A825','#4E342E'];
var TB=[0,0.3,0.15,0];
var TN=['平原','山地','森林','水域'];
var INIT_POP=100,INIT_AGRI=5,INIT_IND=3,INIT_MIL=2,INIT_TECH=1,INIT_FOOD=60,INIT_GOLD=40,PC=3;

var G={turn:1,phase:'home',mapSize:7,map:[],player:null,enemy:null,selectedCells:[],attackMode:false,actionsUsed:0,maxActions:5,logs:[]};
var selColor1=0,selColor2=1,cc1='#FF6D00',cc2='#00BCD4';
var autoMode=false,autoSpeed=900,autoTimer=null;

var $=function(id){return document.getElementById(id)};
var rand=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var getClr=function(s,c){return s===-1?c:COLORS[s]};

document.addEventListener('pointerdown',function(e){
  var t=e.target.closest('.rip');if(!t)return;
  var r=document.createElement('span'),rc=t.getBoundingClientRect(),sz=Math.max(rc.width,rc.height)*2;
  r.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-rc.left-sz/2)+'px;top:'+(e.clientY-rc.top-sz/2)+'px';
  r.className='rip-fx';t.appendChild(r);setTimeout(function(){r.remove()},600);
});

var snackT;
function snack(m){var s=$('snack');s.textContent=m;s.classList.add('show');clearTimeout(snackT);snackT=setTimeout(function(){s.classList.remove('show')},2200)}

function showDlg(title,body,acts){
  $('dlg-t').textContent=title;$('dlg-b').innerHTML=body;
  var a=$('dlg-a');a.innerHTML='';
  for(var i=0;i<acts.length;i++){(function(ac){var b=document.createElement('button');b.className=(ac.p?'btn-r ':'btn-f ')+'rip';b.textContent=ac.t;b.onclick=function(){closeDlg();if(ac.f)ac.f()};a.appendChild(b)})(acts[i])}
  $('dlg').classList.add('show');
}
function closeDlg(){$('dlg').classList.remove('show')}

function showBanner(text,cb,dur){
  var b=$('turn-banner');b.textContent=text;b.classList.add('show');
  setTimeout(function(){b.classList.remove('show');if(cb)setTimeout(cb,200)},dur||1100);
}

var curPage='pg-home';
function goPage(id){
  var c=$(curPage),n=$(id);
  if(c)c.classList.remove('active');
  setTimeout(function(){n.classList.add('active')},30);
  curPage=id;G.phase=id.replace('pg-','');
  // 底部栏只在游戏页面显示
  $('game-bb').classList.toggle('show',id==='pg-game');
}

/* ========== 配置 ========== */
function initConfig(){
  renderCP('cp1',selColor1,cc1,function(v){selColor1=v.i;cc1=v.c});
  renderCP('cp2',selColor2,cc2,function(v){selColor2=v.i;cc2=v.c});
  document.querySelectorAll('.sz-btn').forEach(function(b){b.onclick=function(){document.querySelectorAll('.sz-btn').forEach(function(x){x.classList.remove('active')});b.classList.add('active');G.mapSize=+b.dataset.size}});
}
function renderCP(id,si,cc,cb){
  var c=$(id);c.innerHTML='';
  for(var i=0;i<COLORS.length;i++){(function(cl,idx){
    var d=document.createElement('div');d.className='co'+(si===idx?' sel':'');d.style.background=cl;
    d.onclick=function(){c.querySelectorAll('.co').forEach(function(x){x.classList.remove('sel')});d.classList.add('sel');cb({i:idx,c:null})};
    c.appendChild(d);
  })(COLORS[i],i)}
  var cd=document.createElement('div');cd.className='co custom-co'+(si===-1?' sel':'');cd.style.background=cc;
  cd.innerHTML='<input type="color" value="'+cc+'"><span class="material-icons co-icon">colorize</span>';
  cd.querySelector('input').addEventListener('input',function(e){cd.style.background=e.target.value;c.querySelectorAll('.co').forEach(function(x){x.classList.remove('sel')});cd.classList.add('sel');cb({i:-1,c:e.target.value})});
  c.appendChild(cd);
}
var RP=['铁','暗','血','冰','雷','炎','影','圣','龙','凤','玄','紫','金','银','黑','白','苍','赤','碧','青'];
var RS=['帝国','联邦','共和国','王国','联盟','王朝','公国','领地','汗国','邦联'];
function rName(){return RP[rand(0,RP.length-1)]+RS[rand(0,RS.length-1)]}
function randomConfig(){
  selColor1=rand(0,COLORS.length-1);do{selColor2=rand(0,COLORS.length-1)}while(selColor2===selColor1);
  renderCP('cp1',selColor1,cc1,function(v){selColor1=v.i;if(v.c)cc1=v.c});
  renderCP('cp2',selColor2,cc2,function(v){selColor2=v.i;if(v.c)cc2=v.c});
  $('n1').value=rName();$('n2').value=rName();
  var rs=[5,7,9,11][rand(0,3)];G.mapSize=rs;
  document.querySelectorAll('.sz-btn').forEach(function(b){b.classList.toggle('active',+b.dataset.size===rs)});
}

/* ========== 地图 ========== */
function genMap(sz){
  var m=[];for(var y=0;y<sz;y++){m[y]=[];for(var x=0;x<sz;x++)m[y][x]=0}
  pCluster(m,3,sz<=5?1:2,1,sz<=5?2:3,sz);
  pCluster(m,1,sz<=5?2:3,1,2,sz);
  pCluster(m,2,sz<=5?2:sz<=7?3:5,1,sz<=7?2:3,sz);
  ePlay(m,sz);return m;
}
function pCluster(m,t,cnt,mn,mx,sz){
  for(var c=0;c<cnt;c++){var tr=0,x,y;do{x=rand(1,sz-2);y=rand(1,sz-2);tr++}while(m[y][x]!==0&&tr<40);if(tr>=40)continue;m[y][x]=t;var ex=rand(mn,mx)-1;for(var s=0;s<ex;s++){var ds=[[0,1],[0,-1],[1,0],[-1,0]],d=ds[rand(0,3)];var nx=x+d[0],ny=y+d[1];if(nx>=0&&nx<sz&&ny>=0&&ny<sz&&m[ny][nx]===0)m[ny][nx]=t}}}
function ePlay(m,sz){[[0,0],[sz-1,0],[0,sz-1],[sz-1,sz-1]].forEach(function(p){var cx=p[0],cy=p[1],av=0;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){var nx=cx+dx,ny=cy+dy;if(nx>=0&&nx<sz&&ny>=0&&ny<sz&&m[ny][nx]!==3)av++}if(av<PC+1){for(var dy2=-1;dy2<=1;dy2++)for(var dx2=-1;dx2<=1;dx2++){var nx2=cx+dx2,ny2=cy+dy2;if(nx2>=0&&nx2<sz&&ny2>=0&&ny2<sz&&m[ny2][nx2]===3)m[ny2][nx2]=0}}})}

/* ========== 放置 ========== */
function startPlace(){
  var n1=$('n1').value.trim(),n2=$('n2').value.trim();
  if(!n1||!n2){snack('请填写国家名称');return}
  var c1=getClr(selColor1,cc1),c2=getClr(selColor2,cc2);
  if(c1===c2){snack('两个国家颜色不能相同');return}
  G.player={name:n1,color:c1,cells:[],pop:INIT_POP,agri:INIT_AGRI,ind:INIT_IND,mil:INIT_MIL,tech:INIT_TECH,food:INIT_FOOD,gold:INIT_GOLD};
  G.enemy={name:n2,color:c2,cells:[],pop:INIT_POP,agri:INIT_AGRI,ind:INIT_IND,mil:INIT_MIL,tech:INIT_TECH,food:INIT_FOOD,gold:INIT_GOLD};
  G.map=genMap(G.mapSize);G.selectedCells=[];
  goPage('pg-place');setTimeout(renderPlaceMap,350);
}
function renderPlaceMap(){
  var g=$('place-map'),sz=G.mapSize,cw=Math.min(48,Math.floor((window.innerWidth-36)/sz));
  g.style.gridTemplateColumns='repeat('+sz+','+cw+'px)';g.innerHTML='';
  for(var y=0;y<sz;y++)for(var x=0;x<sz;x++){
    var d=document.createElement('div'),t=G.map[y][x];
    d.className='mc t-'+['p','m','f','w'][t];d.dataset.x=x;d.dataset.y=y;
    if(t===3)d.innerHTML='<span class="material-icons">water</span>';
    else if(t===1)d.innerHTML='<span class="material-icons">terrain</span>';
    else if(t===2)d.innerHTML='<span class="material-icons">park</span>';
    (function(xx,yy){d.onclick=function(){onPlaceCell(xx,yy)}})(x,y);g.appendChild(d);
  }
  updPH();
}
function onPlaceCell(x,y){
  if(G.map[y][x]===3)return;
  var idx=-1;for(var i=0;i<G.selectedCells.length;i++)if(G.selectedCells[i].x===x&&G.selectedCells[i].y===y){idx=i;break}
  if(idx>=0){G.selectedCells.splice(idx,1);updPH();return}
  if(G.selectedCells.length>=PC){snack('最多选择'+PC+'格');return}
  if(G.selectedCells.length>0&&!adjA(x,y,G.selectedCells)){snack('请选择相邻的格子');return}
  G.selectedCells.push({x:x,y:y});updPH();
}
function adjA(x,y,cs){for(var i=0;i<cs.length;i++)if(Math.abs(cs[i].x-x)+Math.abs(cs[i].y-y)===1)return true;return false}
function updPH(){
  document.querySelectorAll('#place-map .mc').forEach(function(c){
    var x=+c.dataset.x,y=+c.dataset.y;c.classList.remove('sel-hint');
    var sel=false;for(var i=0;i<G.selectedCells.length;i++)if(G.selectedCells[i].x===x&&G.selectedCells[i].y===y){sel=true;break}
    if(sel){c.style.background=G.player.color;c.style.boxShadow='inset 0 0 0 2px rgba(0,0,0,.35)'}
    else{c.style.background='';c.style.boxShadow='';if(G.map[y][x]!==3&&G.selectedCells.length<PC&&G.selectedCells.length>0&&adjA(x,y,G.selectedCells))c.classList.add('sel-hint')}
  });
  $('place-hint').textContent='点击地图选择'+PC+'个相邻格子 ('+G.selectedCells.length+'/'+PC+')';
  $('btn-place-ok').disabled=G.selectedCells.length!==PC;
}
function resetPlace(){G.selectedCells=[];updPH()}
function confirmPlace(){
  G.player.cells=G.selectedCells.slice();
  var sz=G.mapSize,co=G.player.cells[0],far={x:sz-1-co.x,y:sz-1-co.y};
  G.enemy.cells=aiPick(far,sz);
  G.turn=1;G.actionsUsed=0;G.attackMode=false;autoMode=false;
  goPage('pg-game');setTimeout(function(){initGameUI();updAutoUI();showBanner('第 '+G.turn+' 回合',null)},400);
}
function aiPick(near,sz){
  var av=[];
  for(var y=0;y<sz;y++)for(var x=0;x<sz;x++){if(G.map[y][x]===3)continue;var fp=false;for(var i=0;i<G.player.cells.length;i++)if(G.player.cells[i].x===x&&G.player.cells[i].y===y){fp=true;break}if(!fp)av.push({x:x,y:y,d:Math.abs(x-near.x)+Math.abs(y-near.y)})}
  av.sort(function(a,b){return a.d-b.d});if(!av.length)return[{x:0,y:0}];
  var st=av[0],cs=[{x:st.x,y:st.y}],us={};us[st.x+','+st.y]=true;
  while(cs.length<PC){var best=null,bd=99999;cs.forEach(function(c){[[0,1],[0,-1],[1,0],[-1,0]].forEach(function(dd){var nx=c.x+dd[0],ny=c.y+dd[1],k=nx+','+ny;if(nx>=0&&nx<sz&&ny>=0&&ny<sz&&!us[k]&&G.map[ny][nx]!==3){var fp2=false;for(var j=0;j<G.player.cells.length;j++)if(G.player.cells[j].x===nx&&G.player.cells[j].y===ny){fp2=true;break}if(!fp2){var d=Math.abs(nx-near.x)+Math.abs(ny-near.y);if(d<bd){bd=d;best={x:nx,y:ny}}}}})});if(!best)break;cs.push(best);us[best.x+','+best.y]=true}
  return cs;
}

/* ========== 游戏界面 ========== */
function initGameUI(){renderGM();renderCmp();renderRes();renderAct();$('atk-hint').classList.remove('show');G.attackMode=false;G.actionsUsed=0}
function renderGM(){
  var g=$('game-map'),sz=G.mapSize,cw=Math.min(44,Math.floor((window.innerWidth-32)/sz));
  g.style.gridTemplateColumns='repeat('+sz+','+cw+'px)';g.innerHTML='';
  for(var y=0;y<sz;y++)for(var x=0;x<sz;x++){
    var d=document.createElement('div'),t=G.map[y][x];
    d.className='mc t-'+['p','m','f','w'][t];d.dataset.x=x;d.dataset.y=y;
    applyCV(d,x,y,t);(function(xx,yy){d.onclick=function(){onGM(xx,yy)}})(x,y);g.appendChild(d);
  }
}
function applyCV(d,x,y,t){
  var pc=false,ec=false;
  for(var i=0;i<G.player.cells.length;i++)if(G.player.cells[i].x===x&&G.player.cells[i].y===y){pc=true;break}
  for(var i=0;i<G.enemy.cells.length;i++)if(G.enemy.cells[i].x===x&&G.enemy.cells[i].y===y){ec=true;break}
  if(pc){d.style.background=G.player.color;d.style.boxShadow='inset 0 0 0 2px rgba(0,0,0,.3)';d.innerHTML='<span class="cell-label">'+TN[t][0]+'</span>'}
  else if(ec){d.style.background=G.enemy.color;d.style.boxShadow='inset 0 0 0 2px rgba(0,0,0,.3)';d.innerHTML='<span class="cell-label">'+TN[t][0]+'</span>'}
  else{d.style.background='';d.style.boxShadow='';if(t===3)d.innerHTML='<span class="material-icons" style="font-size:12px">water</span>';else if(t===1)d.innerHTML='<span class="material-icons" style="font-size:12px">terrain</span>';else if(t===2)d.innerHTML='<span class="material-icons" style="font-size:12px">park</span>';else d.innerHTML=''}
}
function updMC(x,y){
  var cells=document.querySelectorAll('#game-map .mc[data-x="'+x+'"][data-y="'+y+'"]');if(!cells.length)return;
  var d=cells[0],t=G.map[y][x];d.className='mc t-'+['p','m','f','w'][t];applyCV(d,x,y,t);
  d.classList.add('captured');setTimeout(function(){d.classList.remove('captured')},400);
}
function onGM(x,y){
  if(autoMode)return;
  if(G.attackMode){
    var ef=false;for(var i=0;i<G.enemy.cells.length;i++)if(G.enemy.cells[i].x===x&&G.enemy.cells[i].y===y){ef=true;break}
    if(!ef){snack('请选择敌方领土');return}
    var ad=false;for(var i=0;i<G.player.cells.length;i++)if(Math.abs(G.player.cells[i].x-x)+Math.abs(G.player.cells[i].y-y)===1){ad=true;break}
    if(!ad){snack('只能进攻相邻的敌方领土');return}
    G.attackMode=false;$('atk-hint').classList.remove('show');startBattle(x,y);return;
  }
  var t=G.map[y][x],info=TN[t];
  if(t!==3&&t!==0)info+=' (防御+'+Math.round(TB[t]*100)+'%)';
  var pf=false,ef2=false;for(var i=0;i<G.player.cells.length;i++)if(G.player.cells[i].x===x&&G.player.cells[i].y===y){pf=true;break}
  for(var i=0;i<G.enemy.cells.length;i++)if(G.enemy.cells[i].x===x&&G.enemy.cells[i].y===y){ef2=true;break}
  if(pf)info+=' | '+G.player.name;else if(ef2)info+=' | '+G.enemy.name;snack(info);
}
function renderCmp(){
  var p=G.player,e=G.enemy;
  $('game-cmp').innerHTML='<div class="cmp-c"><div class="cmp-n"><div class="cmp-d" style="background:'+p.color+'"></div>'+p.name+'</div><div class="cmp-s">军<b>'+p.mil+'</b> 科<b>'+p.tech+'</b> 地<b>'+p.cells.length+'</b> 人<b>'+p.pop+'</b></div></div><div class="cmp-c"><div class="cmp-n"><div class="cmp-d" style="background:'+e.color+'"></div>'+e.name+'</div><div class="cmp-s">军<b>'+e.mil+'</b> 科<b>'+e.tech+'</b> 地<b>'+e.cells.length+'</b> 人<b>'+e.pop+'</b></div></div>';
}
function renderRes(){
  var p=G.player,inc=getInc(p);
  $('res-bar').innerHTML='<div class="res-i"><span class="material-icons">restaurant</span><span class="res-v">'+p.food+'</span><span class="res-delta '+(inc.food<0?'neg':'')+'">'+(inc.food>=0?'+':'')+inc.food+'</span></div><div class="res-i"><span class="material-icons">payments</span><span class="res-v">'+p.gold+'</span><span class="res-delta '+(inc.gold<0?'neg':'')+'">'+(inc.gold>=0?'+':'')+inc.gold+'</span></div><div class="res-i"><span class="material-icons">groups</span><span class="res-v">'+p.pop+'</span></div><div class="res-i"><span class="material-icons">science</span><span class="res-v">'+p.tech+'</span></div>';
}
function getInc(n){return{food:n.agri*n.cells.length*2-Math.floor(n.pop/15),gold:n.ind*n.cells.length}}
function getPow(n){return n.mil*(1+n.tech*0.12)*(n.pop/100)}

function hasAdjTarget(me,them){
  for(var i=0;i<me.cells.length;i++)for(var j=0;j<them.cells.length;j++)if(Math.abs(me.cells[i].x-them.cells[j].x)+Math.abs(me.cells[i].y-them.cells[j].y)===1)return true;
  return false;
}
function isAdjacent(me,them){return hasAdjTarget(them,me)}

var ACTS=[
  {id:'agri',icon:'agriculture',label:'发展农业',cost:'10金',need:10,nt:'gold'},
  {id:'ind',icon:'factory',label:'发展工业',cost:'10金',need:10,nt:'gold'},
  {id:'mil',icon:'shield',label:'招募军队',cost:'8粮10金',nf:8,ng:10},
  {id:'tech',icon:'science',label:'研发科技',cost:'20金',need:20,nt:'gold'},
  {id:'expand',icon:'add_box',label:'扩张领土',cost:'12粮15金',nf:12,ng:15},
  {id:'grow',icon:'trending_up',label:'鼓励生育',cost:'15粮',need:15,nt:'food'},
  {id:'trade',icon:'storefront',label:'市场贸易',cost:'18金',need:18,nt:'gold'},
  {id:'conscript',icon:'groups',label:'征兵动员',cost:'20粮',need:20,nt:'food'},
];
function canDo(a,n){
  if(G.actionsUsed>=G.maxActions)return false;
  if(a.nt==='gold'&&n.gold<a.need)return false;
  if(a.nt==='food'&&n.food<a.need)return false;
  if(a.nf&&(n.food<a.nf||n.gold<a.ng))return false;
  if(a.id==='conscript'&&n.pop<=15)return false;
  return true;
}
function renderAct(){
  var p=G.player,ap=$('act-panel');ap.innerHTML='';
  for(var i=0;i<ACTS.length;i++){(function(a){var b=document.createElement('button');b.className='act-btn rip';b.disabled=!canDo(a,p);b.innerHTML='<span class="material-icons">'+a.icon+'</span><span class="a-l">'+a.label+'</span><span class="a-c">'+a.cost+'</span>';b.onclick=function(){doAct(a.id)};ap.appendChild(b)})(ACTS[i])}
  $('btn-end-turn').textContent='结束回合 ('+(G.maxActions-G.actionsUsed)+')';
  $('btn-attack').style.display=hasAdjTarget(G.player,G.enemy)&&!autoMode?'':'none';
}

/* ========== 玩家操作 ========== */
function doAct(id){
  if(autoMode)return;var p=G.player,ok=false;
  if(id==='agri'&&p.gold>=10){p.gold-=10;p.agri+=2;ok=true}
  else if(id==='ind'&&p.gold>=10){p.gold-=10;p.ind+=2;ok=true}
  else if(id==='mil'&&p.food>=8&&p.gold>=10){p.food-=8;p.gold-=10;p.mil+=3;ok=true}
  else if(id==='tech'&&p.gold>=20){p.gold-=20;p.tech+=1;ok=true}
  else if(id==='expand'){ok=tryExp(p,false)}
  else if(id==='grow'&&p.food>=15){p.food-=15;var g=rand(10,25);p.pop+=g;ok=true;snack('人口 +'+g)}
  else if(id==='trade'&&p.gold>=18){p.gold-=18;p.food+=30;p.gold+=10;ok=true;snack('粮食+30 金币+10')}
  else if(id==='conscript'&&p.food>=20&&p.pop>15){p.food-=20;p.mil+=5;p.pop-=15;ok=true;snack('军事+5 人口-15')}
  if(ok){G.actionsUsed++;if(id!=='grow'&&id!=='trade'&&id!=='conscript')snack(ACTS[function(){for(var i=0;i<ACTS.length;i++)if(ACTS[i].id===id)return i;return 0}()].label+' 完成');renderRes();renderCmp();renderAct()}
}
function tryExp(n,isAI){
  if(n.food<12||n.gold<15)return false;
  var oc=n.cells,ot=isAI?G.player.cells:G.enemy.cells,cs=[];
  oc.forEach(function(c){[[0,1],[0,-1],[1,0],[-1,0]].forEach(function(dd){var nx=c.x+dd[0],ny=c.y+dd[1];if(nx>=0&&nx<G.mapSize&&ny>=0&&ny<G.mapSize&&G.map[ny][nx]!==3){var fp=false,fo=false;for(var i=0;i<oc.length;i++)if(oc[i].x===nx&&oc[i].y===ny){fp=true;break}for(var i=0;i<ot.length;i++)if(ot[i].x===nx&&ot[i].y===ny){fo=true;break}var dup=false;for(var i=0;i<cs.length;i++)if(cs[i].x===nx&&cs[i].y===ny){dup=true;break}if(!fp&&!fo&&!dup)cs.push({x:nx,y:ny})}})});
  if(!cs.length)return false;var pk=cs[rand(0,cs.length-1)];n.food-=12;n.gold-=15;n.cells.push(pk);if(!isAI)updMC(pk.x,pk.y);return true;
}

function toggleAttackMode(){if(autoMode)return;G.attackMode=!G.attackMode;$('atk-hint').classList.toggle('show',G.attackMode)}

/* ========== 通用战斗 ========== */
function execAtk(atk,def){
  var tgts=[];
  atk.cells.forEach(function(ac){def.cells.forEach(function(dc){if(Math.abs(ac.x-dc.x)+Math.abs(ac.y-dc.y)===1){var dup=false;for(var i=0;i<tgts.length;i++)if(tgts[i].x===dc.x&&tgts[i].y===dc.y){dup=true;break}if(!dup)tgts.push({x:dc.x,y:dc.y})}})});
  if(!tgts.length)return null;
  tgts.sort(function(a,b){return TB[G.map[a.y][a.x]]-TB[G.map[b.y][b.x]]});
  var pick=tgts[0];
  var ap=getPow(atk)*(0.75+Math.random()*0.5),db=TB[G.map[pick.y][pick.x]],dp=getPow(def)*(1+db)*(0.75+Math.random()*0.5);
  var win=ap>dp;
  var ratio=Math.min(ap,dp)/Math.max(ap,dp,1),bd=Math.max(1,Math.floor(ratio*3));
  if(win){
    var idx=-1;for(var i=0;i<def.cells.length;i++)if(def.cells[i].x===pick.x&&def.cells[i].y===pick.y){idx=i;break}
    if(idx>=0)def.cells.splice(idx,1);
    atk.cells.push({x:pick.x,y:pick.y});
    atk.mil=Math.max(0,atk.mil-Math.max(1,Math.ceil(bd*0.5)));
    def.mil=Math.max(0,def.mil-bd);
  }else{
    atk.mil=Math.max(0,atk.mil-bd);
    def.mil=Math.max(0,def.mil-Math.max(1,Math.ceil(bd*0.3)));
  }
  return{win:win,x:pick.x,y:pick.y};
}

/* ========== 结束回合 ========== */
function endTurn(callback){
  if(G.attackMode){G.attackMode=false;$('atk-hint').classList.remove('show')}
  settleInc(G.player);natGrow(G.player);
  $('ai-thinking').classList.add('show');$('act-panel').classList.add('disabled');
  var bb=$('game-bb');bb.style.pointerEvents='none';bb.style.opacity='0.4';
  var delay=autoMode?Math.min(600,autoSpeed*0.6):1000;
  setTimeout(function(){
    aiTurn();
    renderGM();
    $('ai-thinking').classList.remove('show');$('act-panel').classList.remove('disabled');
    bb.style.pointerEvents='';bb.style.opacity='';
    if(isGO()){bb.style.pointerEvents='';bb.style.opacity='';autoMode=false;updAutoUI();chkWin();return}
    G.turn++;G.actionsUsed=0;$('game-tb-title').textContent='第 '+G.turn+' 回合';
    showBanner('第 '+G.turn+' 回合',function(){renderRes();renderCmp();renderAct();updAutoUI();if(!autoMode){var inc=getInc(G.player);if(inc.food<0)snack('警告：粮食入不敷出！')}if(callback)callback()},autoMode?200:1000);
  },delay);
}
function settleInc(n){var inc=getInc(n);n.food+=inc.food;n.gold+=inc.gold;if(n.food<0){n.pop=Math.max(10,n.pop+Math.floor(n.food/5));n.food=0}n.food=Math.max(0,n.food);n.gold=Math.max(0,n.gold)}
function natGrow(n){if(n.food>n.pop/10)n.pop+=rand(2,8)}

/* ========== 敌方AI ========== */
function aiTurn(){
  var e=G.enemy,p=G.player;
  var threat=0;
  if(p.cells.length>e.cells.length*0.7)threat++;
  if(isAdjacent(e,p))threat++;
  if(getPow(e)<getPow(p))threat++;
  if(p.cells.length>e.cells.length)threat++;
  if(p.mil>e.mil*1.3)threat++;

  var acts=rand(3,4);
  for(var i=0;i<acts;i++){
    var ch=aiDecide(e,p,threat),done=false;
    if(ch==='mil'&&e.food>=8&&e.gold>=10){e.food-=8;e.gold-=10;e.mil+=3;done=true}
    else if(ch==='tech'&&e.gold>=20){e.gold-=20;e.tech+=1;done=true}
    else if(ch==='agri'&&e.gold>=10){e.gold-=10;e.agri+=2;done=true}
    else if(ch==='ind'&&e.gold>=10){e.gold-=10;e.ind+=2;done=true}
    else if(ch==='expand'){done=tryExp(e,true)}
    else if(ch==='grow'&&e.food>=15){e.food-=15;e.pop+=rand(10,25);done=true}
    else if(ch==='trade'&&e.gold>=18){e.gold-=18;e.food+=30;e.gold+=10;done=true}
    else if(ch==='conscript'&&e.food>=20&&e.pop>15){e.food-=20;e.mil+=5;e.pop-=15;done=true}
    if(!done){
      if(e.food<8&&e.gold>=10){e.gold-=10;e.agri+=2}
      else if(e.food>=8&&e.gold>=10){e.food-=8;e.gold-=10;e.mil+=3}
      else if(e.gold>=10){e.gold-=10;e.agri+=2}
    }
  }
  var shouldAtk=false;
  if(G.turn>=2&&getPow(e)>getPow(p)*0.8&&hasAdjTarget(e,p)){
    if(threat>=2)shouldAtk=Math.random()<0.65;
    else if(G.turn>=4)shouldAtk=Math.random()<0.55;
    else shouldAtk=Math.random()<0.35;
  }
  if(shouldAtk){
    var r=execAtk(e,p);
    if(r&&r.win){snack(G.enemy.name+'攻占了你的领土！');G.logs.push('第'+G.turn+'回合: '+G.enemy.name+'攻占领土')}
    else if(r){snack('你成功抵御了'+G.enemy.name+'的进攻！');G.logs.push('第'+G.turn+'回合: 抵御'+G.enemy.name+'进攻')}
  }
  settleInc(e);natGrow(e);
}
function aiDecide(e,p,threat){
  var myPow=getPow(e),enPow=getPow(p);
  if(threat>=3){
    var r=Math.random();
    if(e.food<8&&e.gold>=10)return'agri';
    if(e.pop>30&&e.food>=20&&e.mil<enPow*0.7)return'conscript';
    if(r<0.40)return'mil';if(r<0.60)return'tech';if(r<0.80)return'agri';return'expand';
  }
  if(threat>=2){
    var r=Math.random();
    if(e.food<8&&e.gold>=10)return'agri';
    if(e.pop>30&&e.food>=20&&e.mil<enPow)return'conscript';
    if(r<0.35)return'mil';if(r<0.55)return'tech';if(r<0.75)return'agri';return'ind';
  }
  if(threat>=1){
    var r=Math.random();
    if(r<0.25)return'mil';if(r<0.40)return'agri';if(r<0.55)return'ind';
    if(r<0.70)return'tech';if(r<0.85)return'expand';return'grow';
  }
  if(G.turn<=2){
    var r=Math.random();
    if(r<0.30)return'agri';if(r<0.55)return'ind';if(r<0.75)return'grow';return'mil';
  }
  var r=Math.random();
  if(myPow<enPow*0.9){
    if(e.pop>30&&e.food>=20)return Math.random()<0.4?'conscript':'mil';
    if(r<0.35)return'mil';if(r<0.55)return'tech';return'agri';
  }
  if(e.food<15&&e.gold>=18)return'trade';
  if(r<0.15)return'agri';if(r<0.30)return'ind';if(r<0.45)return'mil';
  if(r<0.58)return'tech';if(r<0.72)return'expand';if(r<0.85)return'grow';return'trade';
}

/* ========== 战斗动画 ========== */
function startBattle(tx,ty){
  goPage('pg-battle');var ar=$('battle-arena'),p=G.player,e=G.enemy,tN=TN[G.map[ty][tx]],db=TB[G.map[ty][tx]];
  ar.innerHTML='<div style="color:rgba(255,255,255,.5);font-size:12px;margin-bottom:16px">争夺 '+tN+'</div><div class="b-vs"><div><div class="b-n bl" id="b-left" style="background:'+p.color+'">'+p.name[0]+'</div><div class="b-pw">攻击力<span id="b-atk">?</span></div></div><div class="b-vt">VS</div><div><div class="b-n br" id="b-right" style="background:'+e.color+'">'+e.name[0]+'</div><div class="b-pw">防御力<span id="b-def">?</span></div></div></div>'+(db>0?'<div style="color:rgba(255,255,255,.4);font-size:12px;margin-bottom:8px">'+tN+'地形防御+'+Math.round(db*100)+'%</div>':'')+'<div class="b-result" id="b-result"></div><div class="b-log" id="b-log"></div><div style="margin-top:24px"><button class="btn-r rip" id="b-continue" style="display:none">继续</button></div>';
  setTimeout(function(){
    var ap=getPow(p)*(0.75+Math.random()*0.5),dp=getPow(e)*(1+db)*(0.75+Math.random()*0.5);
    $('b-atk').textContent=Math.floor(ap);$('b-def').textContent=Math.floor(dp);
    setTimeout(function(){
      $('b-left').classList.add('shake');$('b-right').classList.add('shake');
      var ratio=Math.min(ap,dp)/Math.max(ap,dp,1),bd=Math.max(1,Math.floor(ratio*4));
      setTimeout(function(){
        if(ap>dp){
          $('b-result').textContent=p.name+' 胜出！';
          G._br={win:true,da:Math.max(1,Math.ceil(bd*0.5)),dd:bd};
          $('b-log').textContent='占领领土！敌方损失 '+bd+' 军事';
        }else{
          $('b-result').textContent=e.name+' 防守成功';
          G._br={win:false,da:bd,dd:Math.max(1,Math.ceil(bd*0.3))};
          $('b-log').textContent='进攻失败，我方损失 '+bd+' 军事';
        }
        G.logs.push('第'+G.turn+'回合: 进攻'+tN+(ap>dp?' - 胜利':' - 失败'));
        $('b-result').classList.add('show');$('b-continue').style.display='';
        $('b-continue').onclick=function(){afterBattle(tx,ty)};
      },500);
    },600);
  },800);
}
function afterBattle(tx,ty){
  var r=G._br;
  if(r.win){
    var idx=-1;for(var i=0;i<G.enemy.cells.length;i++)if(G.enemy.cells[i].x===tx&&G.enemy.cells[i].y===ty){idx=i;break}
    if(idx>=0)G.enemy.cells.splice(idx,1);
    G.player.cells.push({x:tx,y:ty});
  }
  G.player.mil=Math.max(0,G.player.mil-r.da);
  G.enemy.mil=Math.max(0,G.enemy.mil-r.dd);
  goPage('pg-game');
  setTimeout(function(){
    renderGM();renderCmp();renderRes();renderAct();
    G.attackMode=false;$('atk-hint').classList.remove('show');
    if(isGO())chkWin();
  },350);
}

/* ========== 自动模式 ========== */
function toggleAuto(){autoMode=!autoMode;updAutoUI();if(autoMode)autoTick();else clearTimeout(autoTimer)}
function updAutoUI(){
  var btn=$('btn-auto'),ic=$('auto-icon'),lb=$('auto-label'),ind=$('auto-ind'),sp=$('speed-bar'),ap=$('act-panel');
  if(autoMode){btn.classList.add('auto-on');ic.textContent='pause';lb.textContent='暂停';sp.classList.add('show');ind.classList.add('show');ap.classList.add('disabled');$('btn-end-turn').style.display='none';$('btn-attack').style.display='none'}
  else{btn.classList.remove('auto-on');ic.textContent='smart_toy';lb.textContent='自动';sp.classList.remove('show');ind.classList.remove('show');ap.classList.remove('disabled');$('btn-end-turn').style.display='';renderAct()}
}
function autoTick(){
  if(!autoMode)return;
  if(isGO()){autoMode=false;updAutoUI();chkWin();return}
  G.actionsUsed=0;
  while(G.actionsUsed<G.maxActions){if(!autoDoAct())break}
  var myPow=getPow(G.player),enPow=getPow(G.enemy);
  if(myPow>enPow*1.2&&hasAdjTarget(G.player,G.enemy)&&Math.random()<0.5){
    var r=execAtk(G.player,G.enemy);
    if(r&&r.win)snack('攻占了'+G.enemy.name+'的领土！');
    else if(r)snack('进攻失败');
  }
  renderRes();renderCmp();renderAct();renderGM();
  var delay=Math.max(80,autoSpeed*0.3);
  setTimeout(function(){if(!autoMode)return;endTurn(autoNext)},delay);
}
function autoNext(){if(!autoMode)return;if(isGO()){autoMode=false;updAutoUI();chkWin();return}autoTimer=setTimeout(autoTick,autoSpeed)}

function autoDoAct(){
  var p=G.player,e=G.enemy,myPow=getPow(p),enPow=getPow(e);
  var action=null;
  if(p.food<5&&p.gold>=10)action='agri';
  else if(p.food<10&&p.gold>=18)action='trade';
  else if(myPow<enPow*0.5&&p.food>=20&&p.pop>15)action='conscript';
  else if(myPow<enPow*0.5&&p.food>=8&&p.gold>=10)action='mil';
  else if(p.tech<Math.max(2,e.tech)&&p.gold>=20)action='tech';
  else if(p.food>=18&&p.gold>=18)action='expand';
  else if(myPow<enPow*0.8&&p.food>=20&&p.pop>25)action='conscript';
  else if(myPow<enPow*0.8&&p.food>=8&&p.gold>=10)action='mil';
  else if(isAdjacent(p,e)&&p.food>=8&&p.gold>=10)action='mil';
  else if(p.food>40&&p.gold>=18)action='trade';
  else if(p.agri<=p.ind&&p.gold>=10)action='agri';
  else if(p.gold>=10)action='ind';
  else if(myPow>enPow&&p.food>=8&&p.gold>=10)action='mil';
  else if(p.food>25)action='grow';
  else if(p.gold>=10)action='agri';
  else return false;

  var ok=false;
  if(action==='agri'&&p.gold>=10){p.gold-=10;p.agri+=2;ok=true}
  else if(action==='ind'&&p.gold>=10){p.gold-=10;p.ind+=2;ok=true}
  else if(action==='mil'&&p.food>=8&&p.gold>=10){p.food-=8;p.gold-=10;p.mil+=3;ok=true}
  else if(action==='tech'&&p.gold>=20){p.gold-=20;p.tech+=1;ok=true}
  else if(action==='expand'){ok=tryExp(p,false)}
  else if(action==='grow'&&p.food>=15){p.food-=15;p.pop+=rand(10,25);ok=true}
  else if(action==='trade'&&p.gold>=18){p.gold-=18;p.food+=30;p.gold+=10;ok=true}
  else if(action==='conscript'&&p.food>=20&&p.pop>15){p.food-=20;p.mil+=5;p.pop-=15;ok=true}
  if(ok){G.actionsUsed++;return true}
  if(p.gold>=10){p.gold-=10;p.agri+=2;G.actionsUsed++;return true}
  return false;
}

document.querySelectorAll('.sp-btn').forEach(function(b){b.onclick=function(){document.querySelectorAll('.sp-btn').forEach(function(x){x.classList.remove('sp-act')});b.classList.add('sp-act');autoSpeed=+b.dataset.speed}});

/* ========== 胜负 ========== */
function isGO(){return G.player.cells.length===0||G.enemy.cells.length===0||G.player.pop<=0||G.enemy.pop<=0}
function chkWin(){
  if(!isGO())return false;
  var w=G.enemy.cells.length===0||G.enemy.pop<=0;
  showRes(w);return true;
}
function showRes(win){
  setTimeout(function(){
    goPage('pg-result');autoMode=false;clearTimeout(autoTimer);updAutoUI();
    var p=G.player,e=G.enemy;
    $('result-content').innerHTML=
      '<div class="res-ic" style="background:'+(win?'#43A047':'#E53935')+'"><span class="material-icons">'+(win?'emoji_events':'sentiment_very_dissatisfied')+'</span></div>'+
      '<div class="res-t">'+(win?'胜利':'失败')+'</div>'+
      '<div class="res-s">'+(win?p.name+'征服了'+e.name+'！':e.name+'击败了'+p.name+'...')+'</div>'+
      '<div class="res-stats"><div class="res-stats-title">战斗总结</div>'+
      '<div class="st-row"><span class="st-l"><span class="material-icons">schedule</span>总回合</span><span class="st-v">'+G.turn+' 回合</span></div>'+
      '<div class="st-row"><span class="st-l"><span class="material-icons">groups</span>最终人口</span><span class="st-v">'+p.pop+'</span></div>'+
      '<div class="st-row"><span class="st-l"><span class="material-icons">shield</span>军事力量</span><span class="st-v">'+p.mil+'</span></div>'+
      '<div class="st-row"><span class="st-l"><span class="material-icons">science</span>科技等级</span><span class="st-v">'+p.tech+'</span></div>'+
      '<div class="st-row"><span class="st-l"><span class="material-icons">map</span>领土数量</span><span class="st-v">'+p.cells.length+' / '+(G.mapSize*G.mapSize)+'</span></div>'+
      '<div class="st-row"><span class="st-l"><span class="material-icons">agriculture</span>农业等级</span><span class="st-v">'+p.agri+'</span></div>'+
      '<div class="st-row"><span class="st-l"><span class="material-icons">factory</span>工业等级</span><span class="st-v">'+p.ind+'</span></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px"><button class="btn-r rip" onclick="resetGame()">再来一局</button><button class="btn-f rip" onclick="goHome()">返回首页</button></div>';
  },500);
}
function resetGame(){G.turn=1;G.phase='home';G.selectedCells=[];G.attackMode=false;G.actionsUsed=0;autoMode=false;clearTimeout(autoTimer);G.logs=[];goPage('pg-config');setTimeout(randomConfig,350)}
function goHome(){autoMode=false;clearTimeout(autoTimer);G.phase='home';goPage('pg-home')}

function showLogs(){showDlg('战报记录',G.logs.length?G.logs.slice(-10).join('<br>'):'暂无战报',[{t:'关闭',p:true}])}
function showQuitDialog(){if(autoMode){autoMode=false;clearTimeout(autoTimer);updAutoUI()}showDlg('退出游戏','确定要退出当前游戏吗？',[{t:'取消'},{t:'退出',p:true,f:goHome}])}
function showInfoDialog(){showDlg('游戏说明','<b>回合制发展对抗</b><br>每回合5次操作，然后结束回合。<br><br><b>胜利条件：</b>占领对方全部领土或消灭对方人口。<br><br><b>地形效果：</b>山地防御+30%，森林防御+15%<br><br><b>操作说明：</b><br>· 发展农业：+2农业（提高粮食产出）<br>· 发展工业：+2工业（提高金币产出）<br>· 招募军队：+3军事<br>· 研发科技：+1科技（增幅战斗力量）<br>· 扩张领土：占领相邻空地<br>· 鼓励生育：增加人口<br>· 市场贸易：18金→粮食+30、金币+10<br>· 征兵动员：20粮→军事+5、人口-15<br><br><b>自动模式：</b>AI替你操作，可选速度。',[{t:'知道了',p:true}])}

window.addEventListener('resize',function(){if(G.phase==='place')renderPlaceMap();if(G.phase==='game')renderGM()});
$('dlg').addEventListener('click',function(e){if(e.target===$('dlg'))closeDlg()});
initConfig();randomConfig();
</script>
