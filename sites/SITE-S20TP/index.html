<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>菊次郎的夏天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #fff;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            position: fixed;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        .bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, #1a0a2e 0%, #050510 70%);
        }

        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #feca57;
            border-radius: 50%;
            opacity: 0;
            animation: float 4s ease-in-out infinite;
            box-shadow: 0 0 8px currentColor;
        }
        @keyframes float {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }
            15% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }

        .hint {
            position: fixed;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 200;
            pointer-events: none;
            transition: opacity 0.6s;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            text-align: center;
        }

        #charCanvas {
            position: fixed;
            z-index: 50;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            pointer-events: none;
            touch-action: none;
        }

        .target-dot {
            position: fixed;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 14px #fff, 0 0 28px rgba(255, 255, 255, 0.5);
            z-index: 45;
            display: none;
            pointer-events: none;
            animation: dotPulse 0.8s ease-in-out infinite;
            transform: translate(-50%, -50%);
        }
        @keyframes dotPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.4);
            }
        }
    </style>
</head>

            for (var y = 0; y < H; y++) {
                for (var x = 0; x < W; x++) {
                    var srcX = mirror ? (W - 1 - x) : x;
                    var idx = y * W + srcX;
                    var c = m[idx],
                        j = (y * W + x) * 4,
                        v = R[c];
                    if (v) {
                        b[j] = v[0];
                        b[j + 1] = v[1];
                        b[j + 2] = v[2];
                        b[j + 3] = 255;
                    } else {
                        b[j] = 0;
                        b[j + 1] = 0;
                        b[j + 2] = 0;
                        b[j + 3] = 0;
                    }
                }
            }
            C.putImageData(imgData, 0, 0);
        }

        function render() {
            if (currentSet === 1) {
                cv.width = W1;
                cv.height = H1;
                drawFrame(D1, W1, H1, 0, false);
                cv.style.width = CW + "px";
                cv.style.height = CH1 + "px";
            } else if (currentSet === 2) {
                cv.width = W2;
                cv.height = H2;
                var frameIdx = walkFrameIndex % 2;
                drawFrame(D2, W2, H2, frameIdx, walkDir < 0);
                cv.style.width = CW + "px";
                cv.style.height = CH2 + "px";
            } else {
                cv.width = W3;
                cv.height = H3;
                drawFrame(D3, W3, H3, 0, false);
                cv.style.width = CW + "px";
                cv.style.height = CH3 + "px";
            }
            cv.style.left = charX + "px";
            cv.style.top = charY + "px";
        }

        function updateHintPosition() {
            var hint = document.getElementById('hint');
            if (hint.style.display === 'none') return;
            var hintTop = charY - 38;
            if (hintTop < 30) hintTop = 30;
            hint.style.top = hintTop + 'px';
        }

        function stopAllAnims() {
            if (animRafId) { cancelAnimationFrame(animRafId);
                animRafId = null; }
            if (fallRafId) { cancelAnimationFrame(fallRafId);
                fallRafId = null; }
            isWalking = false;
            isFalling = false;
            walkFrameIndex = 0;
            targetX = null;
            targetY = null;
            document.getElementById('targetDot').style.display = 'none';
        }

        function startWalkToTarget(tx, ty) {
            stopAllAnims();
            targetX = tx;
            targetY = ty;
            isWalking = true;
            currentSet = 2;
            walkFrameIndex = 0;
            walkLastFrameTime = performance.now();
            walkDir = (targetX > (charX + CW / 2)) ? 1 : -1;
            document.getElementById('targetDot').style.left = tx + 'px';
            document.getElementById('targetDot').style.top = ty + 'px';
            document.getElementById('targetDot').style.display = 'block';
            resizeChar();
            render();
            animRafId = requestAnimationFrame(walkLoop);
        }

        function walkLoop(timestamp) {
            if (!isWalking || targetX === null) {
                stopAllAnims();
                currentSet = 1;
                resizeChar();
                render();
                return;
            }
            if (!timestamp) timestamp = performance.now();

            if (timestamp - walkLastFrameTime >= WALK_FRAME_INTERVAL) {
                walkFrameIndex++;
                walkLastFrameTime = timestamp;
            }

            var speed = 3.5;
            var centerX = charX + CW / 2;
            var centerY = charY + (currentSet === 3 ? CH3 : CH2) / 2;
            var dx = targetX - centerX;
            var dy = targetY - centerY;
            var dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < speed + 2) {
                charX = targetX - CW / 2;
                charY = targetY - CH1 / 2;
                stopAllAnims();
                currentSet = 1;
                document.getElementById('targetDot').style.display = 'none';
                targetX = null;
                resizeChar();
                render();
                updateHintPosition();

                // 如果是自动走动模式，立即生成新目标继续走，不停顿
                if (autoWalkActive) {
                    var nextTarget = generateRandomTarget();
                    startWalkToTarget(nextTarget.x, nextTarget.y);
                }
                return;
            }

            walkDir = (dx >= 0) ? 1 : -1;
            var nx = dx / dist;
            var ny = dy / dist;
            charX += speed * nx;
            charY += speed * ny;

            charX = Math.max(-CW * 0.3, Math.min(window.innerWidth - CW * 0.7, charX));
            charY = Math.max(-CH2 * 0.3, Math.min(window.innerHeight - CH2 * 0.3, charY));

            render();
            animRafId = requestAnimationFrame(walkLoop);
        }

        function startFall() {
            if (isDragging) return;
            stopAllAnims();
            resetUserActionTimer();
            isFalling = true;
            currentSet = 1;
            resizeChar();
            var vy = 0;
            var ground = getGroundY();

            function fallStep() {
                if (!isFalling || isDragging) {
                    isFalling = false;
                    fallRafId = null;
                    return;
                }
                vy += 1.2;
                charY += vy;
                if (charY >= ground) {
                    charY = ground;
                    isFalling = false;
                    currentSet = 1;
                    fallRafId = null;
                    resizeChar();
                    render();
                    updateHintPosition();
                    return;
                }
                render();
                fallRafId = requestAnimationFrame(fallStep);
            }
            fallRafId = requestAnimationFrame(fallStep);
        }

        // 提示3秒后消失
        setTimeout(function() {
            var hint = document.getElementById('hint');
            hint.style.opacity = '0';
            setTimeout(function() { hint.style.display = 'none'; }, 600);
        }, 3000);

        // ==================== 触摸/点击事件 ====================
        var touchStartTime = 0,
            touchStartX = 0,
            touchStartY = 0;

        function getPos(e) {
            if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e
                    .changedTouches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function isOnChar(x, y) {
            var h = currentSet === 1 ? CH1 : (currentSet === 2 ? CH2 : CH3);
            return x >= charX && x <= charX + CW && y >= charY && y <= charY + h;
        }

        document.addEventListener('touchstart', function(e) {
            var pos = getPos(e);
            touchStartTime = Date.now();
            touchStartX = pos.x;
            touchStartY = pos.y;
            if (isOnChar(pos.x, pos.y)) {
                stopAllAnims();
                resetUserActionTimer();
                isDragging = true;
                dragOffsetX = pos.x - charX;
                dragOffsetY = pos.y - charY;
                currentSet = 3;
                resizeChar();
                render();
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('mousedown', function(e) {
            var pos = getPos(e);
            touchStartTime = Date.now();
            touchStartX = pos.x;
            touchStartY = pos.y;
            if (isOnChar(pos.x, pos.y)) {
                stopAllAnims();
                resetUserActionTimer();
                isDragging = true;
                dragOffsetX = pos.x - charX;
                dragOffsetY = pos.y - charY;
                currentSet = 3;
                resizeChar();
                render();
            }
        });

        document.addEventListener('touchmove', function(e) {
            if (isDragging) {
                var pos = getPos(e);
                charX = pos.x - dragOffsetX;
                charY = pos.y - dragOffsetY;
                charX = Math.max(-CW * 0.4, Math.min(window.innerWidth - CW * 0.6, charX));
                charY = Math.max(-CH3 * 0.3, Math.min(window.innerHeight - CH3 * 0.3, charY));
                render();
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                var pos = getPos(e);
                charX = pos.x - dragOffsetX;
                charY = pos.y - dragOffsetY;
                charX = Math.max(-CW * 0.4, Math.min(window.innerWidth - CW * 0.6, charX));
                charY = Math.max(-CH3 * 0.3, Math.min(window.innerHeight - CH3 * 0.3, charY));
                render();
            }
        });

        document.addEventListener('touchend', function(e) {
            if (isDragging) {
                isDragging = false;
                startFall();
            } else {
                var pos = getPos(e);
                var dt = Date.now() - touchStartTime;
                var dist = Math.hypot(pos.x - touchStartX, pos.y - touchStartY);
                if (dt < 300 && dist < 15) {
                    resetUserActionTimer();
                    startWalkToTarget(pos.x, pos.y);
                }
            }
        });

        document.addEventListener('mouseup', function(e) {
            if (isDragging) {
                isDragging = false;
                startFall();
            } else {
                var pos = getPos(e);
                var dt = Date.now() - touchStartTime;
                var dist = Math.hypot(pos.x - touchStartX, pos.y - touchStartY);
                if (dt < 300 && dist < 15) {
                    resetUserActionTimer();
                    startWalkToTarget(pos.x, pos.y);
                }
            }
        });

        // ==================== 启动自动走动检查 ====================
        autoWalkCheckIntervalId = setInterval(checkAutoWalk, AUTO_WALK_CHECK_INTERVAL);

        // ==================== 初始渲染 ====================
        render();
        updateHintPosition();
        initParticles();
        lastUserActionTime = Date.now();
    </script>
</body>
</html>
