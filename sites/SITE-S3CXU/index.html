<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25级大瓜</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
video {
  width: 100%;
  max-width: 600px;
  border-radius: 16px;
  object-fit: contain;
}
/* 引导提示（仅自动播放失败时显示） */
#playTip {
  position: fixed;
  color: #fff;
  font-size: 18px;
  text-align: center;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
}
</style>
</head>
<body>
<video autoplay loop playsinline controls volume="1">
  <source src="https://v26-default.365yg.com/b41e8c6c17abd7cb496c9cde98e1d27d/69fe2be6/video/tos/cn/tos-cn-ve-15/oIBaEI1MLtSTUhLZiiRvOEIhz5U1vGABJAP5Q/?a=6383&ch=26&cr=3&dr=0&lr=all&cd=0%7C0%7C0%7C3&cv=1&br=1114&bt=1114&cs=0&ds=3&ft=rVWEerwwZRdzskPo0PDS6kwc3RZtGl3qBg9eF3x5XqO12nzXT&mime_type=video_mp4&qs=0&rc=OGdkZTRkZjpoZDxmN2c5aEBpajw3d205cjRvNjMzNGkzM0AuX2A0M182NmExM2FeY2IyYSNwYGNgMmRrMWphLS1kLWFzcw%3D%3D&btag=c0000e00008000&cquery=100z_100o_100w_100B_100x&dy_q=1778254257&feature_id=fea919893f650a8c49286568590446ef&l=20260508233057BB8B4E1FCE2B52ABEE03" type="video/mp4">
</video>
<div id="playTip">点击页面任意位置播放</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const video = document.querySelector('video');
  const playTip = document.getElementById('playTip');
  
  // 关键：移除 muted，默认开声音；volume=1 设为最大音量
  video.muted = false;
  video.volume = 1;
  
  // 强制自动播放（兼容大部分浏览器）
  video.play().then(() => {
    playTip.style.display = 'none'; // 播放成功，隐藏提示
  }).catch(err => {
    // 少数浏览器限制时，显示提示，点击触发播放
    playTip.style.display = 'block';
    document.body.addEventListener('click', () => {
      video.play();
      playTip.style.display = 'none';
    }, { once: true });
  });
});
</script>
</body>
</html>
