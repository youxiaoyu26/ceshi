<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次元剧情生成器 - StoryForge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --bg: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-hover: #252542;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --border: #2d2d44;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景动画 */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            animation: bgMove 20s ease-in-out infinite;
        }

        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-5%, -5%); }
        }

        /* 粒子效果 */
        .particle {
            position: fixed;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        /* 头部 */
        header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* 卡片样式 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.1);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* 表单元素 */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 500;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* 标签选择 */
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .tag {
            padding: 6px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .tag:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .tag.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-color: transparent;
            color: white;
        }

        /* 按钮 */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            width: 100%;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--primary);
        }

        /* 剧情显示区域 */
        .story-display {
            min-height: 500px;
        }

        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .story-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .meta-tag {
            padding: 4px 12px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary);
        }

        .story-content {
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .story-section {
            margin-bottom: 24px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border-left: 3px solid var(--primary);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dialogue {
            background: rgba(99, 102, 241, 0.05);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 12px 0;
            position: relative;
            border-left: 3px solid var(--secondary);
        }

        .dialogue-speaker {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 4px;
            font-size: 0.95rem;
        }

        .dialogue-text {
            color: var(--text);
            line-height: 1.6;
        }

        .scene-desc {
            color: var(--text-dim);
            font-style: italic;
            margin: 12px 0;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .choice-box {
            display: grid;
            gap: 10px;
            margin-top: 16px;
        }

        .choice-item {
            padding: 14px 18px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .choice-item:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
            transform: translateX(5px);
        }

        .choice-item.selected {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .choice-prefix {
            width: 28px;
            height: 28px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* 角色卡 */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .character-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s;
        }

        .character-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .char-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .char-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .char-role {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .char-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 8px;
        }

        .char-tag {
            padding: 2px 8px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 10px;
            font-size: 0.75rem;
            color: var(--primary);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-state .icon-large {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 历史记录 */
        .history-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 12px;
        }

        .history-item {
            padding: 12px;
            background: var(--bg);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .history-item:hover {
            border-color: var(--primary);
            background: var(--bg-hover);
        }

        .history-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-meta {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        /* 导出按钮组 */
        .export-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .export-group .btn {
            flex: 1;
            font-size: 0.9rem;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .logo {
                font-size: 1.8rem;
            }
            .character-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 剧情类型特殊样式 */
        .genre-fantasy .section-title { color: #fbbf24; }
        .genre-scifi .section-title { color: #22d3ee; }
        .genre-romance .section-title { color: #f472b6; }
        .genre-horror .section-title { color: #ef4444; }
        .genre-mystery .section-title { color: #a78bfa; }
        .genre-daily .section-title { color: #34d399; }

        .mood-happy { border-left-color: #fbbf24 !important; }
        .mood-tense { border-left-color: #ef4444 !important; }
        .mood-sad { border-left-color: #60a5fa !important; }
        .mood-romantic { border-left-color: #f472b6 !important; }
        .mood-mysterious { border-left-color: #a78bfa !important; }

        /* 进度指示器 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg);
            border-radius: 2px;
            margin: 16px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <header>
        <h1 class="logo">✨ StoryForge 剧情生成器</h1>
        <p class="subtitle">打造属于你的二次元世界</p>
    </header>

    <div class="container">
        <!-- 左侧控制面板 -->
        <aside class="control-panel">
            <div class="card">
                <div class="card-title">
                    <div class="icon">⚙️</div>
                    剧情设定
                </div>
                
                <div class="form-group">
                    <label>题材类型</label>
                    <select id="genre">
                        <option value="fantasy">奇幻冒险</option>
                        <option value="scifi">科幻未来</option>
                        <option value="romance">校园恋爱</option>
                        <option value="horror">悬疑恐怖</option>
                        <option value="mystery">推理探案</option>
                        <option value="daily">日常治愈</option>
                        <option value="isekai">异世界转生</option>
                        <option value="mecha">机甲战斗</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>故事基调</label>
                    <select id="mood">
                        <option value="happy">轻松愉快</option>
                        <option value="tense">紧张刺激</option>
                        <option value="sad">感人催泪</option>
                        <option value="romantic">甜蜜浪漫</option>
                        <option value="mysterious">神秘悬疑</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>故事长度</label>
                    <select id="length">
                        <option value="short">短篇（3-5幕）</option>
                        <option value="medium" selected>中篇（6-10幕）</option>
                        <option value="long">长篇（11-15幕）</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>主角设定（可选）</label>
                    <input type="text" id="protagonist" placeholder="例如：失忆的魔法少女">
                </div>

                <div class="form-group">
                    <label>核心冲突（可选）</label>
                    <input type="text" id="conflict" placeholder="例如：拯救即将毁灭的世界">
                </div>

                <div class="form-group">
                    <label>关键元素</label>
                    <div class="tag-group" id="elements">
                        <span class="tag" data-value="magic">魔法</span>
                        <span class="tag" data-value="sword">剑术</span>
                        <span class="tag" data-value="school">学园</span>
                        <span class="tag" data-value="dragon">龙</span>
                        <span class="tag" data-value="robot">机器人</span>
                        <span class="tag" data-value="ghost">幽灵</span>
                        <span class="tag" data-value="time">时间旅行</span>
                        <span class="tag" data-value="memory">记忆</span>
                        <span class="tag" data-value="dream">梦境</span>
                        <span class="tag" data-value="cafe">咖啡馆</span>
                        <span class="tag" data-value="festival">祭典</span>
                        <span class="tag" data-value="rain">雨天</span>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="generateStory()">
                    <span>🎲</span> 生成剧情
                </button>
            </div>

            <div class="card" style="margin-top: 20px;">
                <div class="card-title">
                    <div class="icon">📚</div>
                    历史记录
                </div>
                <div class="history-list" id="historyList">
                    <div class="empty-state" style="padding: 20px;">
                        <div style="font-size: 2rem; margin-bottom: 8px;">📝</div>
                        <div style="font-size: 0.9rem;">暂无生成记录</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右侧显示区域 -->
        <main class="display-area">
            <div class="card story-display" id="storyCard">
                <div class="empty-state">
                    <div class="icon-large">🎭</div>
                    <h3>准备好开始创作了吗？</h3>
                    <p>在左侧配置你的故事设定，然后点击"生成剧情"</p>
                    <p style="margin-top: 12px; font-size: 0.9rem;">支持奇幻、科幻、恋爱、悬疑等多种题材</p>
                </div>
            </div>
        </main>
    </div>

    <script>

                ],

        // 工具函数
        function random(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        document.querySelectorAll('.tag').forEach(tag => {

        function generateCharacters(genre, count = 3) {
            const db = storyDB[genre];
            const chars = shuffle([...db.protagonists]).slice(0, count);
            return chars.map((char, i) => ({
                ...char,
                role: i === 0 ? '主角' : (i === 1 ? '搭档/对手' : '关键人物'),
                secret: random([

        // 生成剧情段落
        function generateScene(genre, mood, characters, progress, elements) {
            const db = storyDB[genre];
            const weather = random(commonElements.weather);
            const time = random(commonElements.time);
            const item = random(commonElements.items);
            const emotion = random(commonElements.emotions);
            
            let scene = {
                setting: random(db.settings),
                weather,
                time,
                descriptions: [],
                dialogues: [],
                choices: []
            };

            // 根据进度生成不同内容
            if (progress === 0) {
                scene.descriptions.push(`【序章：${random(["命运的相遇", "异变的开端", "平凡的日常", "觉醒的时刻"])}】`);
                scene.descriptions.push(`${time}的${scene.setting}，${weather}笼罩着一切。`);
                scene.descriptions.push(`${characters[0].name}，${characters[0].desc}，正站在命运的十字路口。`);
                if (elements.length > 0) {
                    scene.descriptions.push(`空气中弥漫着${elements[0]}的气息，仿佛预示着什么。`);
                }
            } else if (progress < 0.3) {
                scene.descriptions.push(`【第一章：${random(["波澜渐起", "迷雾重重", "初次交锋", "秘密浮现"])}】`);
                scene.descriptions.push(`${time}，${weather}。${characters[0].name}来到了${random(db.scenes)}。`);
                scene.descriptions.push(`手中紧握的${item}，似乎与这一切有着某种联系。`);
            } else if (progress < 0.6) {
                scene.descriptions.push(`【第二章：${random(["危机四伏", "真相逼近", "羁绊加深", "背水一战"])}】`);
                scene.descriptions.push(`随着调查的深入，${characters[0].name}发现了令人震惊的事实。`);
                scene.descriptions.push(`${characters[1].name}的真实身份似乎并不简单...`);
            } else if (progress < 0.9) {
                scene.descriptions.push(`【第三章：${random(["最终对决", "生死抉择", "真相大白", "命运之战"])}】`);
                scene.descriptions.push(`${weather}中的${scene.setting}，决战一触即发。`);
                scene.descriptions.push(`${characters[0].name}感受到了前所未有的${emotion}。`);
            } else {
                scene.descriptions.push(`【终章：${random(["新的黎明", "永恒的约定", "轮回的终结", "启程之日"])}】`);
                scene.descriptions.push(`${time}的第一缕阳光穿透云层。`);
                scene.descriptions.push(`一切结束后，${characters[0].name}望着远方，心中充满了${emotion}。`);
            }

            // 添加对话
            const dialogueCount = Math.random() > 0.3 ? 2 : 1;
            for (let i = 0; i < dialogueCount; i++) {
                const char = random(characters);
                const dbDialogue = random(db.dialogues);
                scene.dialogues.push({
                    speaker: i === 0 ? dbDialogue.speaker : char.name,
                    text: dbDialogue.text,
                    emotion: random(["平静", "激动", "悲伤", "坚定", "困惑"])
                });
            }

            // 添加选择（非终章）
            if (progress < 0.9) {
                scene.choices = shuffle([...db.choices]).slice(0, 2);
            }

            return scene;
        }

            card.innerHTML = `
                <div class="loading active">
                    <div class="spinner"></div>
                    <p>正在编织命运之线...</p>
                    <p style="font-size: 0.9rem; color: var(--text-dim); margin-top: 8px;">生成${acts}幕剧情</p>
                </div>
            `;

            setTimeout(() => {
                // 生成角色
                let characters = generateCharacters(genre, 3);
                if (protagonistInput) {
                    characters[0] = { 
                        name: protagonistInput.split(/[，,、]/)[0] || "主角", 
                        desc: protagonistInput, 
                        trait: "自定义",
                        role: "主角",
                        secret: "未知的过去"
                    };
                }

                // 生成剧情
                const story = {
                    id: generateId(),
                    title: generateTitle(genre, mood),
                    genre,
                    mood,
                    characters,
                    acts: [],
                    timestamp: new Date().toLocaleString('zh-CN')
                };

                for (let i = 0; i < acts; i++) {
                    const progress = i / (acts - 1);
                    const scene = generateScene(genre, mood, characters, progress, activeTags);
                    if (conflictInput && i === Math.floor(acts / 2)) {
                        scene.descriptions.push(`【核心冲突】${conflictInput}`);
                    }
                    story.acts.push(scene);
                }

                // 渲染
                renderStory(story);
                saveToHistory(story);
            }, 1500);
        }

        function generateTitle(genre, mood) {

                },

        function renderStory(story) {
            const card = document.getElementById('storyCard');
            
            let html = `
                <div class="story-header">
                    <div>
                        <h2 style="font-size: 1.5rem; margin-bottom: 8px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${story.title}</h2>
                        <div class="story-meta">
                            <span class="meta-tag">${getGenreName(story.genre)}</span>
                            <span class="meta-tag">${getMoodName(story.mood)}</span>
                            <span class="meta-tag">${story.acts.length}幕</span>
                        </div>
                    </div>
                    <div class="export-group" style="margin: 0;">
                        <button class="btn btn-secondary" onclick="exportStory('txt')">📄 导出TXT</button>
                        <button class="btn btn-secondary" onclick="exportStory('md')">📝 导出MD</button>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%" id="progressBar"></div>
                </div>
            `;

            // 角色介绍
            html += `
                <div class="story-section genre-${story.genre}">
                    <div class="section-title">👥 登场人物</div>
                    <div class="character-grid">
                        ${story.characters.map(char => `
                            <div class="character-card">
                                <div class="char-avatar">${char.name[0]}</div>
                                <div class="char-name">${char.name}</div>
                                <div class="char-role">${char.role}</div>
                                <div style="font-size: 0.85rem; color: var(--text-dim); margin-top: 4px;">${char.desc}</div>
                                <div class="char-tags">
                                    <span class="char-tag">${char.trait}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // 剧情幕
            story.acts.forEach((act, i) => {
                html += `
                    <div class="story-section mood-${story.mood} genre-${story.genre}" style="animation-delay: ${i * 0.1}s">
                        <div class="section-title">📖 第${i + 1}幕</div>
                        
                        ${act.descriptions.map(desc => {
                            if (desc.startsWith('【')) {
                                return `<div style="font-weight: 600; color: var(--primary); margin: 12px 0; font-size: 1.1rem;">${desc}</div>`;
                            }
                            return `<p style="margin-bottom: 12px; text-indent: 2em;">${desc}</p>`;
                        }).join('')}

                        ${act.dialogues.map(d => `
                            <div class="dialogue">
                                <div class="dialogue-speaker">${d.speaker} <span style="font-size: 0.8rem; color: var(--text-dim);">（${d.emotion}）</span></div>
                                <div class="dialogue-text">「${d.text}」</div>
                            </div>
                        `).join('')}

                        ${act.choices.length > 0 ? `
                            <div style="margin-top: 16px;">
                                <div style="font-weight: 600; color: var(--accent); margin-bottom: 8px;">💭 关键抉择：</div>
                                <div class="choice-box">
                                    ${act.choices.map((c, ci) => `
                                        <div class="choice-item" onclick="this.classList.toggle('selected')">
                                            <div class="choice-prefix">${String.fromCharCode(65 + ci)}</div>
                                            <div>${c}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            // 结尾
            html += `
                <div class="story-section genre-${story.genre}" style="text-align: center; border-left-color: var(--success);">
                    <div class="section-title" style="justify-content: center;">✨ 故事未完待续</div>
                    <p style="color: var(--text-dim);">每一个选择都会导向不同的未来...</p>
                    <p style="color: var(--text-dim); font-size: 0.9rem; margin-top: 8px;">生成时间：${story.timestamp}</p>
                </div>
            `;

            card.innerHTML = html;
            card.dataset.story = JSON.stringify(story);

            // 进度条动画
            setTimeout(() => {
                document.getElementById('progressBar').style.width = '100%';
            }, 100);
        }

        function getGenreName(genre) {
            const names = {
                fantasy: '奇幻冒险', scifi: '科幻未来', romance: '校园恋爱',
                horror: '悬疑恐怖', mystery: '推理探案', daily: '日常治愈',
                isekai: '异世界转生', mecha: '机甲战斗'
            };
            return names[genre] || genre;
        }

        function getMoodName(mood) {
            const names = {
                happy: '轻松愉快', tense: '紧张刺激', sad: '感人催泪',
                romantic: '甜蜜浪漫', mysterious: '神秘悬疑'
            };
            return names[mood] || mood;
        }

        // 历史记录
        function saveToHistory(story) {
            let history = JSON.parse(localStorage.getItem('storyHistory') || '[]');
            history.unshift({
                id: story.id,
                title: story.title,
                genre: story.genre,
                timestamp: story.timestamp
            });
            if (history.length > 10) history = history.slice(0, 10);
            localStorage.setItem('storyHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('storyHistory') || '[]');
            const container = document.getElementById('historyList');
            
            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 20px;">
                        <div style="font-size: 2rem; margin-bottom: 8px;">📝</div>
                        <div style="font-size: 0.9rem;">暂无生成记录</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = history.map(h => `
                <div class="history-item" onclick="loadHistory('${h.id}')">
                    <div class="history-title">${h.title}</div>
                    <div class="history-meta">${getGenreName(h.genre)} · ${h.timestamp}</div>
                </div>
            `).join('');
        }

        function loadHistory(id) {
            // 这里简化处理，实际应该存储完整故事
            alert('点击「生成剧情」创建新故事！\n（历史记录功能在完整版中支持重新加载）');
        }

        // 导出功能
        function exportStory(format) {
            const card = document.getElementById('storyCard');
            const storyData = card.dataset.story;
            if (!storyData) return;
            
            const story = JSON.parse(storyData);
            let content = '';

            if (format === 'txt') {
                content = `${story.title}\n`;
                content += `题材：${getGenreName(story.genre)} | 基调：${getMoodName(story.mood)}\n`;
                content += `生成时间：${story.timestamp}\n`;
                content += `=`.repeat(40) + '\n\n';
                
                content += `【登场人物】\n`;
                story.characters.forEach(c => {
                    content += `${c.name}（${c.role}）：${c.desc} [${c.trait}]\n`;
                });
                content += '\n';
                
                story.acts.forEach((act, i) => {
                    content += `【第${i + 1}幕】\n`;
                    act.descriptions.forEach(d => content += `${d}\n`);
                    act.dialogues.forEach(d => content += `${d.speaker}：「${d.text}」\n`);
                    if (act.choices.length > 0) {
                        content += `\n关键抉择：\n`;
                        act.choices.forEach((c, ci) => content += `${String.fromCharCode(65 + ci)}. ${c}\n`);
                    }
                    content += '\n';
                });
            } else {
                content = `# ${story.title}\n\n`;
                content += `> **题材**：${getGenreName(story.genre)} | **基调**：${getMoodName(story.mood)}\n`;
                content += `> **生成时间**：${story.timestamp}\n\n`;
                
                content += `## 登场人物\n\n`;
                story.characters.forEach(c => {
                    content += `- **${c.name}**（${c.role}）：${c.desc} *${c.trait}*\n`;
                });
                content += '\n';
                
                story.acts.forEach((act, i) => {
                    content += `## 第${i + 1}幕\n\n`;
                    act.descriptions.forEach(d => {
                        if (d.startsWith('【')) content += `### ${d}\n\n`;
                        else content += `${d}\n\n`;
                    });
                    act.dialogues.forEach(d => {
                        content += `> **${d.speaker}**：「${d.text}」\n\n`;
                    });
                    if (act.choices.length > 0) {
                        content += `**关键抉择：**\n\n`;
                        act.choices.forEach((c, ci) => content += `- ${String.fromCharCode(65 + ci)}. ${c}\n`);
                        content += '\n';
                    }
                });
            }

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${story.title}.${format}`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 初始化
        renderHistory();

        // 创建粒子效果
        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                document.body.appendChild(particle);
            }
        }
        createParticles();
    </script>
