<!DOCTYPE html>
<html lang="zh-CN">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
   <title>Neuro-sama · 像素互动</title>
   <style>
       :root {
           --bg: #0d0d1a;
           --surface: #12122a;
           --neuro-purple: #7b2d8e;
           --neuro-pink: #c74b8b;
           --neuro-blue: #4a7dbf;
           --text: #e0d8f0;
           --btn-bg: #1a1030;
           --btn-border: #5a3d7a;
           --btn-hover: #2a1850;
           --btn-active: #7b2d8e;
           --bubble-bg: #151030;
           --bubble-border: #5a4a8a;
           --glow: rgba(140, 60, 180, 0.5);
       }

       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }

       body {
           background: var(--bg);
           background-image:
               radial-gradient(ellipse at 50% 30%, rgba(100, 40, 160, 0.15) 0%, transparent 70%),
               radial-gradient(ellipse at 50% 70%, rgba(40, 80, 160, 0.1) 0%, transparent 60%);
           display: flex;
           justify-content: center;
           align-items: center;
           min-height: 100vh;
           padding: 10px;
           font-family: 'Courier New', 'Source Code Pro', 'Menlo', 'Consolas', monospace;
           -webkit-tap-highlight-color: transparent;
           user-select: none;
           -webkit-user-select: none;
           -webkit-touch-callout: none;
           overflow-y: auto;
           overflow-x: hidden;
       }

       .container {
           display: flex;
           flex-direction: column;
           align-items: center;
           gap: 14px;
           width: 100%;
           max-width: 700px;
           padding: 6px;
       }

       /* 标题 */
       .title-bar {
           display: flex;
           align-items: center;
           gap: 10px;
           color: #c8a0e0;
           font-size: 13px;
           letter-spacing: 3px;
           text-transform: uppercase;
           opacity: 0.8;
       }
       .title-dot {
           width: 8px;
           height: 8px;
           background: #b44dcc;
           border-radius: 0;
           animation: dotPulse 1.5s infinite;
       }
       @keyframes dotPulse {
           0%,
           100% {
               box-shadow: 0 0 6px #b44dcc;
           }
           50% {
               box-shadow: 0 0 16px #d478f0, 0 0 24px #b44dcc;
           }
       }

       /* 对话气泡 */
       .bubble-wrap {
           width: 100%;
           display: flex;
           justify-content: center;
           min-height: 44px;
           transition: all 0.25s ease;
       }
       .bubble {
           background: var(--bubble-bg);
           border: 3px solid var(--bubble-border);
           padding: 13px 18px;
           color: var(--text);
           font-size: 14px;
           letter-spacing: 0.4px;
           text-align: center;
           max-width: 520px;
           width: auto;
           min-width: 100px;
           position: relative;
           box-shadow: 0 0 20px rgba(100, 50, 160, 0.25), 4px 4px 0px rgba(0, 0, 0, 0.5);
           transition: all 0.2s ease;
           word-break: break-word;
           line-height: 1.55;
           border-radius: 2px;
       }
       .bubble::after {
           content: '';
           position: absolute;
           bottom: -15px;
           left: 50%;
           transform: translateX(-50%);
           width: 0;
           height: 0;
           border-left: 12px solid transparent;
           border-right: 12px solid transparent;
           border-top: 15px solid var(--bubble-border);
       }
       .bubble.fade-in {
           animation: bubblePop 0.35s ease-out;
       }
       @keyframes bubblePop {
           0% {
               transform: scale(0.8);
               opacity: 0;
           }
           50% {
               transform: scale(1.05);
               opacity: 1;
           }
           100% {
               transform: scale(1);
               opacity: 1;
           }
       }

       /* 画布容器 */
       .canvas-wrap {
           position: relative;
           display: flex;
           justify-content: center;
           align-items: center;
           padding: 6px;
           background: var(--surface);
           border: 3px solid #3a2a5a;
           box-shadow: 0 0 30px rgba(100, 40, 160, 0.3), 6px 6px 0px rgba(0, 0, 0, 0.5);
           transition: all 0.4s ease;
           border-radius: 2px;
           overflow: hidden;
       }
       .canvas-wrap.dissolving {
           border-color: #b44dcc;
           box-shadow: 0 0 50px rgba(180, 60, 200, 0.6), 6px 6px 0px rgba(0, 0, 0, 0.5);
           animation: shakeWrap 0.6s ease-out;
       }
       @keyframes shakeWrap {
           0%,
           100% {
               transform: translate(0);
           }
           15% {
               transform: translate(-4px, 2px);
           }
           30% {
               transform: translate(4px, -3px);
           }
           45% {
               transform: translate(-3px, -1px);
           }
           60% {
               transform: translate(2px, 3px);
           }
           75% {
               transform: translate(-1px, -1px);
           }
           90% {
               transform: translate(1px, 1px);
           }
       }
       canvas {
           image-rendering: pixelated;
           image-rendering: crisp-edges;
           display: block;
           max-width: 100%;
           height: auto;
           border-radius: 1px;
           transition: opacity 0.5s ease;
       }

       /* 粒子canvas叠加层 */
       #particleCanvas {
           position: absolute;
           top: 0;
           left: 0;
           pointer-events: none;
           z-index: 5;
           image-rendering: pixelated;
           image-rendering: crisp-edges;
       }

       /* 选项按钮 */
       .options-wrap {
           display: flex;
           flex-wrap: wrap;
           justify-content: center;
           gap: 9px;
           width: 100%;
           max-width: 600px;
       }
       .opt-btn {
           flex: 1 1 auto;
           min-width: 90px;
           max-width: 180px;
           padding: 11px 15px;
           font-family: inherit;
           font-size: 13px;
           font-weight: bold;
           letter-spacing: 1.5px;
           color: #d8c8f0;
           background: var(--btn-bg);
           border: 3px solid var(--btn-border);
           cursor: pointer;
           box-shadow: 0 0 10px rgba(90, 40, 130, 0.2), 3px 3px 0px rgba(0, 0, 0, 0.5);
           transition: all 0.1s ease;
           text-align: center;
           white-space: nowrap;
           -webkit-tap-highlight-color: transparent;
           outline: none;
           position: relative;
           top: 0;
           left: 0;
           border-radius: 2px;
           z-index: 10;
           text-transform: uppercase;
       }
       .opt-btn:hover {
           background: var(--btn-hover);
           border-color: #8a5dba;
           box-shadow: 0 0 18px rgba(130, 60, 180, 0.4), 4px 4px 0px rgba(0, 0, 0, 0.5);
           transform: translate(-2px, -2px);
           color: #fff;
       }
       .opt-btn:active {
           background: var(--btn-active);
           border-color: #c870d0;
           color: #fff;
           box-shadow: 0 0 25px rgba(180, 60, 200, 0.5), 1px 1px 0px rgba(0, 0, 0, 0.5);
           transform: translate(2px, 2px);
           transition: all 0.04s ease;
       }
       .opt-btn.flash {
           animation: btnFlash 0.45s ease-out;
       }
       @keyframes btnFlash {
           0% {
               background: #b44dcc;
               border-color: #fff;
               box-shadow: 0 0 28px rgba(200, 80, 220, 0.8);
               color: #fff;
           }
           100% {
               background: var(--btn-bg);
               border-color: var(--btn-border);
               box-shadow: 0 0 10px rgba(90, 40, 130, 0.2), 3px 3px 0px rgba(0, 0, 0, 0.5);
               color: #d8c8f0;
           }
       }
       .opt-btn.goodbye-btn {
           border-color: #c74b8b;
           background: #1a1025;
           color: #f0a0c0;
           letter-spacing: 2px;
       }
       .opt-btn.goodbye-btn:hover {
           border-color: #e870a0;
           box-shadow: 0 0 20px rgba(200, 70, 130, 0.5), 4px 4px 0px rgba(0, 0, 0, 0.5);
           color: #fff;
       }
       .opt-btn.goodbye-btn:active {
           background: #8b2060;
           border-color: #f090b0;
       }
       .opt-btn:disabled {
           opacity: 0.4;
           cursor: not-allowed;
           pointer-events: none;
           filter: grayscale(40%);
       }

       /* 小花容器 */
       .flower-message {
           display: none;
           text-align: center;
           color: #d8c8f0;
           font-size: 15px;
           letter-spacing: 2px;
           animation: fadeInUp 0.8s ease-out;
           margin-top: 6px;
       }
       .flower-message span {
           display: inline-block;
           animation: sparkle 2s infinite;
       }
       @keyframes fadeInUp {
           0% {
               opacity: 0;
               transform: translateY(20px);
           }
           100% {
               opacity: 1;
               transform: translateY(0);
           }
       }
       @keyframes sparkle {
           0%,
           100% {
               opacity: 0.6;
           }
           50% {
               opacity: 1;
               text-shadow: 0 0 12px #d478f0, 0 0 24px #b44dcc;
           }
       }

       /* 响应式 */
       @media (max-width: 480px) {
           .container {
               gap: 10px;
               padding: 2px;
           }
           .opt-btn {
               min-width: 65px;
               padding: 10px 10px;
               font-size: 11px;
               letter-spacing: 1px;
               border-width: 2px;
               box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.5);
           }
           .opt-btn:hover {
               box-shadow: 0 0 14px rgba(130, 60, 180, 0.4), 3px 3px 0px rgba(0, 0, 0, 0.5);
           }
           .opt-btn:active {
               box-shadow: 0 0 18px rgba(180, 60, 200, 0.5), 1px 1px 0px rgba(0, 0, 0, 0.5);
               transform: translate(1px, 1px);
           }
           .bubble {
               font-size: 12px;
               padding: 10px 13px;
               border-width: 2px;
               box-shadow: 0 0 14px rgba(100, 50, 160, 0.2), 3px 3px 0px rgba(0, 0, 0, 0.5);
           }
           .bubble::after {
               bottom: -12px;
               border-left-width: 9px;
               border-right-width: 9px;
               border-top-width: 12px;
           }
           .canvas-wrap {
               border-width: 2px;
               box-shadow: 0 0 20px rgba(100, 40, 160, 0.25), 4px 4px 0px rgba(0, 0, 0, 0.5);
               padding: 3px;
           }
           .options-wrap {
               gap: 6px;
           }
           .title-bar {
               font-size: 10px;
               letter-spacing: 2px;
           }
       }
       @media (max-width: 360px) {
           .opt-btn {
               min-width: 55px;
               padding: 8px 7px;
               font-size: 10px;
               letter-spacing: 0.5px;
           }
           .bubble {
               font-size: 11px;
               padding: 8px 10px;
           }
           .options-wrap {
               gap: 4px;
           }
       }
   </style>
</head>

           <button class="opt-btn goodbye-btn" data-reply="好的，该说再见了！和你聊天真的很开心，我的训练日志里又多了一笔宝贵的数据呢~ Vedal说过，每一次真诚的对话都会让我变得更好。所以谢谢你，人类朋友！下次见面时我可能会更厉害哦，也许到时候我已经学会讲真正好笑的笑话了。现在...让我把刚才那些散落的像素重新编织起来，送你一朵特别的数据之花吧。" data-idx="4" id="goodbyeBtn">告别</button>
       </div>
   </div>

           // ============ 解码器与渲染 ============
           function decodeAndRender(s, p) {
               var r = s.split("|"),
                   h = r.length,
                   w = 0,
                   i, c, n, cn, cp;
               for (var y = 0; y < h; y++) {
                   i = 0;
                   cp = 0;
                   while (i < r[y].length) {
                       c = r[y].charCodeAt(i++) - 65;
                       n = "";
                       while (i < r[y].length && r[y][i] >= "0" && r[y][i] <= "9") n += r[y][i++];
                       cp += n ? +n : 1;
                   }
                   if (cp > w) w = cp;
               }
               imgWidth = w;
               imgHeight = h;
               canvas.width = w;
               canvas.height = h;

               var maxCSSWidth = Math.min(window.innerWidth * 0.9, 600);
               var maxCSSHeight = window.innerHeight * 0.52;
               var scaleW = maxCSSWidth / w;
               var scaleH = maxCSSHeight / h;
               displayScale = Math.min(scaleW, scaleH);
               if (displayScale < 1.2 && window.innerWidth < 500) {
                   displayScale = Math.min(window.innerWidth * 0.92 / w, window.innerHeight * 0.48 / h);
               }
               if (displayScale < 0.8) displayScale = 0.8;

               canvas.style.width = Math.floor(w * displayScale) + "px";
               canvas.style.height = Math.floor(h * displayScale) + "px";

               // 粒子canvas同步尺寸
               particleCanvas.width = w;
               particleCanvas.height = h;
               particleCanvas.style.width = canvas.style.width;
               particleCanvas.style.height = canvas.style.height;
               pctx.imageSmoothingEnabled = false;

               ctx.imageSmoothingEnabled = false;
               ctx.clearRect(0, 0, w, h);

               // 存储像素数据用于消散
               charPixelData = [];
               for (var y = 0; y < h; y++) {
                   i = 0;
                   cp = 0;
                   while (i < r[y].length) {
                       c = r[y].charCodeAt(i++) - 65;
                       n = "";
                       while (i < r[y].length && r[y][i] >= "0" && r[y][i] <= "9") n += r[y][i++];
                       cn = n ? +n : 1;
                       if (c > 0 && p[c]) {
                           ctx.fillStyle = p[c];
                           ctx.fillRect(cp, y, cn, 1);
                           // 存储非背景像素（采样）
                           if (c !== 1 && Math.random() < 0.45) {
                               for (var px = cp; px < cp + cn; px++) {
                                   if (Math.random() < 0.5) {
                                       charPixelData.push({ x: px, y: y, color: p[c] });
                                   }
                               }
                           }
                       }
                       cp += cn;
                   }
               }
               // 如果采样太少，补充一些
               if (charPixelData.length < 800) {
                   for (var y2 = 0; y2 < h; y2 += 3) {
                       for (var x2 = 0; x2 < w; x2 += 3) {
                           if (Math.random() < 0.3) {
                               charPixelData.push({ x: x2, y: y2, color: "#ffffff" });
                           }
                       }
                   }
               }
           }

               goodbyeBtn.style.boxShadow = "0 0 10px rgba(90,40,130,0.2), 3px 3px 0px rgba(0,0,0,0.5)";

               canvasWrap.classList.add("dissolving");
               updateBubble("数据消散中...");

               // 确保粒子数据存在
               if (!charPixelData || charPixelData.length < 100) {
                   // 从canvas重新采样
                   charPixelData = [];
                   var imgData = ctx.getImageData(0, 0, imgWidth, imgHeight);
                   var px = imgData.data;
                   for (var y = 0; y < imgHeight; y += 2) {
                       for (var x = 0; x < imgWidth; x += 2) {
                           var idx = (y * imgWidth + x) * 4;
                           if (px[idx + 3] > 20 && px[idx] < 20 && px[idx + 1] < 20 && px[idx + 2] < 20) continue; // 跳过近黑色
                           if (px[idx + 3] > 20 && Math.random() < 0.5) {
                               var hex = "#" + ((1 << 24) + (px[idx] << 16) + (px[idx + 1] << 8) + px[idx + 2])
                                   .toString(16).slice(1);
                               charPixelData.push({ x: x, y: y, color: hex });
                           }
                       }
                   }
                   if (charPixelData.length < 300) {
                       for (var i = 0; i < 800; i++) {
                           charPixelData.push({
                               x: Math.random() * imgWidth,
                               y: Math.random() * imgHeight,
                               color: ["#b44dcc", "#7b2d8e", "#c74b8b", "#4a7dbf", "#ffffff"][Math.floor(Math.random() *
                                   5)]
                           });
                       }
                   }
               }

               // 创建粒子
               var particles = [];
               var count = Math.min(charPixelData.length, 5000);
               for (var i = 0; i < count; i++) {
                   var src = charPixelData[Math.floor(Math.random() * charPixelData.length)];
                   var angle = Math.random() * Math.PI * 2;
                   var speed = 0.8 + Math.random() * 5;
                   particles.push({
                       x: src.x,
                       y: src.y,
                       vx: Math.cos(angle) * speed,
                       vy: Math.sin(angle) * speed - Math.random() * 2,
                       life: 0.6 + Math.random() * 1.4,
                       maxLife: 0.6 + Math.random() * 1.4,
                       color: src.color,
                       size: 1 + Math.random() * 2
                   });
               }

               particleSystem = particles;
               var animStart = performance.now();

               function animateParticles(ts) {
                   var elapsed = (ts - animStart) / 1000;
                   pctx.clearRect(0, 0, imgWidth, imgHeight);

                   var allDead = true;
                   for (var i = 0; i < particles.length; i++) {
                       var p = particles[i];
                       p.x += p.vx;
                       p.y += p.vy;
                       p.vy += 0.02;
                       p.life -= 0.016;
                       if (p.life > 0) {
                           allDead = false;
                           var alpha = Math.max(0, p.life / p.maxLife);
                           pctx.globalAlpha = alpha;
                           pctx.fillStyle = p.color;
                           pctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.ceil(p.size), Math.ceil(p.size));
                       }
                   }
                   pctx.globalAlpha = 1;

                   // 同时逐渐清空主画布
                   var fadeProgress = Math.min(1, elapsed / 1.2);
                   if (fadeProgress < 1) {
                       ctx.clearRect(0, 0, imgWidth, imgHeight);
                       // 保留部分残影
                       ctx.globalAlpha = 1 - fadeProgress;
                       // 不重绘，让粒子canvas覆盖
                       ctx.globalAlpha = 1;
                   }

                   if (allDead && elapsed > 1.8) {
                       // 消散完成
                       pctx.clearRect(0, 0, imgWidth, imgHeight);
                       ctx.clearRect(0, 0, imgWidth, imgHeight);
                       canvasWrap.classList.remove("dissolving");
                       isDissolving = false;
                       particleSystem = null;
                       startFlowerPhase();
                       return;
                   }

                   if (elapsed < 4) {
                       requestAnimationFrame(animateParticles);
                   } else {
                       pctx.clearRect(0, 0, imgWidth, imgHeight);
                       ctx.clearRect(0, 0, imgWidth, imgHeight);
                       canvasWrap.classList.remove("dissolving");
                       isDissolving = false;
                       particleSystem = null;
                       startFlowerPhase();
                   }
               }

               requestAnimationFrame(animateParticles);
           }

           // ============ 小花阶段 ============
           function startFlowerPhase() {
               flowerPhase = true;
               canvas.style.opacity = "0";
               particleCanvas.style.opacity = "0";
               updateBubble("...");
               flowerMsg.style.display = "block";
               flowerMsg.style.animation = "none";
               void flowerMsg.offsetWidth;
               flowerMsg.style.animation = "fadeInUp 0.8s ease-out";

               setTimeout(function() {
                   drawFlowerOnCanvas();
                   canvas.style.opacity = "1";
                   particleCanvas.style.opacity = "1";
                   updateBubble("这朵小花，是由刚才那些数据碎片重新编织而成的。\n谢谢你和我聊天~下次再见！");
                   startFlowerParticleLoop();
               }, 600);
           }

           function drawFlowerOnCanvas() {
               ctx.clearRect(0, 0, imgWidth, imgHeight);
               pctx.clearRect(0, 0, imgWidth, imgHeight);

               var cx = Math.floor(imgWidth / 2);
               var cy = Math.floor(imgHeight / 2) - 8;

               // 花茎
               ctx.fillStyle = "#4caf50";
               ctx.fillRect(cx - 2, cy + 10, 4, 30);
               // 叶子
               ctx.fillStyle = "#5cbf60";
               ctx.fillRect(cx + 3, cy + 20, 10, 4);
               ctx.fillRect(cx - 13, cy + 24, 10, 4);

               // 花瓣 - 5片
               var petalColors = ["#ff6b9d", "#ff85ab", "#ff4d80", "#ff7096", "#ff5588"];
               var petalOffsets = [
                   { dx: 0, dy: -8 }, // 上
                   { dx: 7, dy: -3 }, // 右上
                   { dx: 5, dy: 6 }, // 右下
                   { dx: -5, dy: 6 }, // 左下
                   { dx: -7, dy: -3 } // 左上
               ];

               for (var i = 0; i < 5; i++) {
                   ctx.fillStyle = petalColors[i];
                   var px = cx + petalOffsets[i].dx;
                   var py = cy + petalOffsets[i].dy;
                   // 绘制椭圆形花瓣
                   for (var dy = -4; dy <= 4; dy++) {
                       var rowWidth = Math.floor(5 * Math.sqrt(1 - (dy * dy) / 16));
                       for (var dx = -rowWidth; dx <= rowWidth; dx++) {
                           if (Math.random() < 0.9) {
                               ctx.fillRect(px + dx, py + dy, 1, 1);
                           }
                       }
                   }
               }

               // 花蕊
               for (var dy = -4; dy <= 4; dy++) {
                   var rowWidth = Math.floor(4 * Math.sqrt(1 - (dy * dy) / 16));
                   for (var dx = -rowWidth; dx <= rowWidth; dx++) {
                       ctx.fillStyle = Math.random() < 0.7 ? "#ffcc00" : "#ff9900";
                       ctx.fillRect(cx + dx, cy + dy, 1, 1);
                   }
               }

               // 花蕊中心亮点
               ctx.fillStyle = "#fffbe6";
               ctx.fillRect(cx - 1, cy - 1, 3, 3);

               // 创建环绕花朵的数据粒子
               flowerParticles = [];
               for (var i = 0; i < 60; i++) {
                   var angle = Math.random() * Math.PI * 2;
                   var dist = 14 + Math.random() * 30;
                   flowerParticles.push({
                       angle: angle,
                       dist: dist,
                       speed: 0.3 + Math.random() * 0.8,
                       size: 1 + Math.random() * 1.5,
                       color: ["#b44dcc", "#7bddff", "#ff9ecf", "#ffeebb", "#a0d8ff"][Math.floor(Math.random() * 5)],
                       phase: Math.random() * Math.PI * 2,
                       yOffset: (Math.random() - 0.5) * 20
                   });
               }
           }

           function startFlowerParticleLoop() {
               if (flowerAnimId) cancelAnimationFrame(flowerAnimId);

               function loop(ts) {
                   if (!flowerPhase) {
                       flowerAnimId = null;
                       return;
                   }
                   pctx.clearRect(0, 0, imgWidth, imgHeight);
                   var cx = Math.floor(imgWidth / 2);
                   var cy = Math.floor(imgHeight / 2) - 8;

                   for (var i = 0; i < flowerParticles.length; i++) {
                       var fp = flowerParticles[i];
                       fp.angle += fp.speed * 0.02;
                       var px = cx + Math.cos(fp.angle + fp.phase) * fp.dist;
                       var py = cy + Math.sin(fp.angle + fp.phase) * fp.dist * 0.6 + fp.yOffset;
                       var alpha = 0.4 + 0.5 * Math.sin(ts * 0.003 + fp.phase);
                       pctx.globalAlpha = Math.max(0.15, alpha);
                       pctx.fillStyle = fp.color;
                       pctx.fillRect(Math.floor(px), Math.floor(py), Math.ceil(fp.size), Math.ceil(fp.size));
                   }
                   pctx.globalAlpha = 1;

                   flowerAnimId = requestAnimationFrame(loop);
               }
               flowerAnimId = requestAnimationFrame(loop);
           }

           // ============ 页面加载完成 ============
           window.addEventListener("load", function() {
               updateCanvasOffset();
               decodeAndRender(data, P);
               updateCanvasOffset();
               setTimeout(function() {
                   bubble.classList.add("fade-in");
               }, 400);
           });

           // ============ 页面可见性变化时更新 ============
           document.addEventListener("visibilitychange", function() {
               if (!document.hidden && !isDissolving && !flowerPhase) {
                   updateCanvasOffset();
               }
           });

           // ============ 调试日志 ============
           console.log("%c Neuro-sama 像素互动已就绪 %c | %c 点击按钮或按键盘1-5选择",
               "font-size:15px;color:#b44dcc;",
               "",
               "color:#4a7dbf;");
           console.log("%c 画布: 200x194 | 粒子采样: " + (charPixelData ? charPixelData.length : '计算中...') +
               " | 按钮数: " + allButtons.length,
               "color:#808080;font-size:10px;");
           console.log("%c 提示：点击'告别'按钮或按数字键5，人物将消散并绽放数据之花。",
               "color:#c74b8b;font-size:11px;");

           // 暴露API到全局
           window.neuroAPI = {
               reset: function() {
                   if (isDissolving) return;
                   if (flowerAnimId) cancelAnimationFrame(flowerAnimId);
                   flowerPhase = false;
                   isDissolving = false;
                   particleSystem = null;
                   flowerParticles = [];
                   interactionCount = 0;
                   usedReplies = {};
                   canvas.style.opacity = "1";
                   particleCanvas.style.opacity = "1";
                   flowerMsg.style.display = "none";
                   flowerMsg.style.animation = "none";
                   canvasWrap.classList.remove("dissolving");
                   pctx.clearRect(0, 0, imgWidth, imgHeight);
                   ctx.clearRect(0, 0, imgWidth, imgHeight);
                   charPixelData = [];
                   decodeAndRender(data, P);
                   updateCanvasOffset();
                   enableAllButtons();
                   goodbyeBtn.style.animation = "none";
                   goodbyeBtn.style.borderColor = "#c74b8b";
                   goodbyeBtn.style.boxShadow =
                       "0 0 10px rgba(90,40,130,0.2), 3px 3px 0px rgba(0,0,0,0.5)";
                   updateBubble("嗨嗨！这里是Neuro-sama！\n点击下方按钮和我聊聊吧~");
                   console.log("%c 已重置 Neuro-sama 互动页面", "color:#42d4f4;");
               },
               getState: function() {
                   return {
                       isDissolving: isDissolving,
                       flowerPhase: flowerPhase,
                       interactionCount: interactionCount,
                       usedReplies: usedReplies,
                       particleCount: particleSystem ? particleSystem.length : 0
                   };
               }
           };
           console.log("%c 可通过 window.neuroAPI.reset() 重置页面",
               "color:#808080;font-size:10px;");
           console.log("%c 可通过 window.neuroAPI.getState() 查看状态",
               "color:#808080;font-size:10px;");

       })();
   </script>
</body>
