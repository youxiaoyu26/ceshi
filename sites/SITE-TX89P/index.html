        // ============ 无限世界：清理远处实体 ============
        function cleanupDistantEntities() {
            const maxDist = world.cleanupDist;
            const maxDistSq = maxDist * maxDist;
            inkStains = inkStains.filter(s => { const dx = s.x - player.x, dy = s.y - player.y; return dx*dx + dy*dy < maxDistSq; });
            worldDecor = worldDecor.filter(d => { const dx = d.x - player.x, dy = d.y - player.y; return dx*dx + dy*dy < maxDistSq * 2; });
            enemies = enemies.filter(e => { const dx = e.x - player.x, dy = e.y - player.y; return dx*dx + dy*dy < maxDistSq * 3; });
        }

        // ============ 主更新循环 ============
        function update() {
            if (game.state !== 'playing' || game.paused) return;
            if (game.freezeTimer > 0) { game.freezeTimer--; draw(); return; }
            game.time++;
            const dt = game.slowMotion;

            if (game.time % 60 === 0) cleanupDistantEntities();
            if (game.time % 30 === 0) generateWorldDecor();

            if (player.invincibleTime > 0) {
                player.invincibleTime--;
                if (player.invincibleTime <= 0) { player.invincible = false; player.liubaiActive = false; }
            }
            const fullHpIndicator = document.getElementById('fullHpIndicator');
            if (player.fullHpProtection && !player.protectionTriggered && player.hp >= player.maxHp) fullHpIndicator.classList.add('active');
            else fullHpIndicator.classList.remove('active');

            if (player.eightMethods) {
                player.eightMethodsTime--;
                if (player.eightMethodsTime <= 0) {
                    player.eightMethods = false;
                    document.getElementById('eightMethodsHint').classList.remove('active');
                }
            }

            // P1：完美闪避暴击计时
            if (player.perfectDodgeCritTime > 0) {
                player.perfectDodgeCritTime--;
                if (player.perfectDodgeCritTime <= 0) player.perfectDodgeCrit = false;
            }

            updateOrbitWeapons();
            updateClones();

            enemies.forEach(enemy => {
                if (enemy.hitFlash > 0) enemy.hitFlash--;
                if (enemy.poisoned > 0) {
                    enemy.poisoned--;
                    if (enemy.poisoned % 30 === 0) { const poisonDmg = player.poisonDamage; enemy.hp -= poisonDmg; addFloatingText(enemy.x, enemy.y - 10, poisonDmg, 'rgba(0,255,100,0.7)', 12, 30); }
                }
                if (enemy.type === 'ninja') {
                    enemy.dashCooldown--;
                    const dx = player.x - enemy.x, dy = player.y - enemy.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 180 && enemy.dashCooldown <= 0) { enemy.vx += (dx/dist) * 9; enemy.vy += (dy/dist) * 9; enemy.dashCooldown = 120; }
                }
                if (enemy.type === 'archer') {
                    enemy.projectileCooldown--;
                    const dx = player.x - enemy.x, dy = player.y - enemy.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 280 && dist > 80 && enemy.projectileCooldown <= 0) {
                        const angle = Math.atan2(dy, dx);
                        enemy.vx -= Math.cos(angle) * 2; enemy.projectileCooldown = 90;
                        if (dist < 100 && !player.invincible) {
                            let damage = enemy.damage * 0.5;
                            if (player.hp >= player.maxHp && player.fullHpProtection && !player.protectionTriggered) {
                                if (damage >= player.hp) { damage = player.hp - 1; player.protectionTriggered = true; showProtectionText(player.x, player.y - 50); triggerShake(); }
                            }
                            player.hp -= damage;
                        }
                    }
                }
                if (player.reflectDamage > 0 && enemy.attackCooldown > 45) {
                    const reflect = enemy.damage * player.reflectDamage;
                    enemy.hp -= reflect;
                    addFloatingText(enemy.x, enemy.y, Math.floor(reflect), 'rgba(255,100,100,0.8)', 13, 40);
                }
            });

            liubaiEffects = liubaiEffects.filter(effect => {
                effect.x += effect.vx * dt; effect.y += effect.vy * dt; effect.life--;
                if (effect.type === 'particle' && effect.orbit !== undefined) { effect.orbit += effect.orbitSpeed; effect.x = player.x + Math.cos(effect.orbit) * 50; effect.y = player.y + Math.sin(effect.orbit) * 30; }
                if (effect.type === 'shockwave') effect.size += (effect.maxSize - effect.size) * 0.1;
                // P1：墨花旋转
                if (effect.type === 'inkBloom' && effect.rotSpeed) { effect.angle += effect.rotSpeed; }
                return effect.life > 0;
            });

            if (input.kuangcaoPressed && player.kuangcaoChanneling) updateKuangcao();

            let moveX = 0, moveY = 0;
            if (input.keys['w'] || input.keys['arrowup']) moveY -= 1;
            if (input.keys['s'] || input.keys['arrowdown']) moveY += 1;
            if (input.keys['a'] || input.keys['arrowleft']) moveX -= 1;
            if (input.keys['d'] || input.keys['arrowright']) moveX += 1;
            const kLen = Math.sqrt(moveX*moveX + moveY*moveY);
            if (kLen > 1) { moveX /= kLen; moveY /= kLen; }
            if (kLen < 0.1) { moveX = Math.max(-1, Math.min(1, input.moveX)); moveY = Math.max(-1, Math.min(1, input.moveY)); }

            const rank = comboRanks[game.currentRank];
            const currentSpeed = player.speed * (1 + player.moveSpeedBonus + rank.speedBonus);
            if (!player.isDodging && !player.kuangcaoChanneling) { player.vx = moveX * currentSpeed; player.vy = moveY * currentSpeed; }
            else if (player.kuangcaoChanneling) { player.vx = moveX * currentSpeed * 0.5; player.vy = moveY * currentSpeed * 0.5; }

            player.x += player.vx * dt;
            player.y += player.vy * dt;

            if (player.isDodging) {
                player.dodgeTime--;
                if (player.dodgeTime <= 0) { player.isDodging = false; player.vx *= 0.3; player.vy *= 0.3; }
            }
            if (player.attackAnim > 0) player.attackAnim--;
            updateHair();

            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.dodgeCooldown > 0) player.dodgeCooldown--;

            if (game.comboTimer > 0) {
                game.comboTimer--;
                if (game.comboTimer <= 0) {
                    game.combo = 0;
                    document.getElementById('comboDisplay').classList.remove('show');
                    game.currentRank = 0;
                    applyRankBonus(0);
                } else if (game.combo > 1) {
                    document.getElementById('comboDisplay').classList.add('show');
                    document.getElementById('comboCount').textContent = game.combo;
                }
            }

            enemies = enemies.filter((enemy) => {
                const dx = player.x - enemy.x, dy = player.y - enemy.y;
                const distSq = dx*dx + dy*dy;
                enemy.simplified = distSq > perf.cullDistance * perf.cullDistance;
                if ((game.time + enemy.updateOffset) % perf.updateInterval === 0 && !enemy.simplified) {
                    const dist = Math.sqrt(distSq);
                    if (dist > 30) { const moveFactor = enemy.speed * 0.08; enemy.vx += (dx / dist) * moveFactor; enemy.vy += (dy / dist) * moveFactor; }
                    enemy.vx *= 0.92; enemy.vy *= 0.92;
                }
                enemy.x += enemy.vx * dt; enemy.y += enemy.vy * dt;

                if (!enemy.simplified && distSq < 2500 && !player.invincible && enemy.attackCooldown <= 0) {
                    let damage = Math.max(0, enemy.damage);
                    if (player.hp >= player.maxHp && player.fullHpProtection && !player.protectionTriggered) {
                        if (damage >= player.hp) { damage = player.hp - 1; player.protectionTriggered = true; showProtectionText(player.x, player.y - 50); triggerShake(); }
                    }
                    player.hp -= damage; enemy.attackCooldown = 50;
                    const dist = Math.sqrt(distSq) || 1;
                    player.vx -= (dx / dist) * 7; player.vy -= (dy / dist) * 7;
                    document.body.style.boxShadow = 'inset 0 0 80px rgba(139,0,0,0.5)';
                    setTimeout(() => document.body.style.boxShadow = 'none', 250);
                }
                if (enemy.attackCooldown > 0) enemy.attackCooldown--;

                if (enemy.hp <= 0) {
                    if (enemy.explodeOnDeath) {
                        const distSq2 = (player.x - enemy.x)**2 + (player.y - enemy.y)**2;
                        if (distSq2 < 10000 && !player.invincible) {
                            let damage = enemy.damage * 0.8;
                            if (player.hp >= player.maxHp && player.fullHpProtection && !player.protectionTriggered) {
                                if (damage >= player.hp) { damage = player.hp - 1; player.protectionTriggered = true; showProtectionText(player.x, player.y - 50); triggerShake(); }
                            }
                            player.hp -= damage;
                            createBloodSplash(player.x, player.y, Math.atan2(player.y - enemy.y, player.x - enemy.x), 2.5);
                        }
                    }
                    game.score += enemy.inkDrop * 10;
                    player.ink = Math.min(player.maxInk, player.ink + enemy.inkDrop * player.inkEfficiency);
                    if (inkStains.length < perf.maxInkStains) inkStains.push({ x: enemy.x, y: enemy.y, size: 0, maxSize: enemy.radius * 2.2, alpha: 0.5, isBlood: enemy.type === 'bomber', jieqiColor: enemy.jieqiColor });
                    return false;
                }
                return true;
            });

            if (enemies.length === 0 && game.state === 'playing' && !upgradePending) {
                upgradePending = true;
                setTimeout(() => {
                    if (enemies.length === 0 && game.state === 'playing') {
                        showUpgrade();
                    }
                    upgradePending = false;
                }, 300);
            }

            particles = particles.filter(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life--; return p.life > 0; });
            swordTrails = swordTrails.filter(t => { t.life--; return t.life > 0; });
            bloodDrops = bloodDrops.filter(b => {
                b.x += b.vx; b.y += b.vy; b.vy += b.gravity; b.life--;
                if (b.life <= 0) {
                    if (inkStains.length < perf.maxInkStains && Math.random() > 0.4) inkStains.push({ x: b.x, y: b.y, size: 0, maxSize: b.size * 1.8, alpha: 0.4, isBlood: true, jieqiColor: getCurrentJieqi().color });
                    return false;
                }
                return true;
            });
            floatingTexts = floatingTexts.filter(ft => { ft.y += ft.vy; ft.life--; return ft.life > 0; });
            if (inkStains.length > perf.maxInkStains) inkStains.shift();
            inkStains.forEach(s => { if (s.size < s.maxSize) s.size += 0.35; });

            game.camera.x += (player.x - canvas.width/2 - game.camera.x) * 0.12;
            game.camera.y += (player.y - canvas.height/2 - game.camera.y) * 0.12;

            if (player.hp <= 0 && game.state === 'playing') gameOver();
            updateUI();
        }

        function updateHair() {
            player.hairSegments[0].x = player.x; player.hairSegments[0].y = player.y;
            for (let i = 1; i < player.hairSegments.length; i++) {
                const prev = player.hairSegments[i-1], curr = player.hairSegments[i];
                const dx = curr.x - prev.x, dy = curr.y - prev.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const maxDist = player.hairLength / player.hairSegments.length;
                if (dist > maxDist) { const angle = Math.atan2(dy, dx); curr.x = prev.x + Math.cos(angle) * maxDist; curr.y = prev.y + Math.sin(angle) * maxDist; }
                if (i % 2 === 0) { curr.x += (Math.random() - 0.5); curr.y += (Math.random() - 0.5) + 0.3; }
            }
        }

        // ============ 绘制系统 ============
        function draw() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-game.camera.x, -game.camera.y);

            const jieqi = getCurrentJieqi();

            // === 第1层：背景/装饰（低对比度）===
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.012)';
            ctx.lineWidth = 1;
            const gridSize = world.gridSize;
            const startX = Math.floor(game.camera.x / gridSize) * gridSize;
            const startY = Math.floor(game.camera.y / gridSize) * gridSize;
            const endX = startX + canvas.width + gridSize;
            const endY = startY + canvas.height + gridSize;

            for (let x = startX; x <= endX; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, endY); ctx.stroke();
            }
            for (let y = startY; y <= endY; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(endX, y); ctx.stroke();
            }

            worldDecor.forEach(decor => {
                const sx = decor.x - game.camera.x, sy = decor.y - game.camera.y;
                if (sx < -100 || sx > canvas.width + 100 || sy < -100 || sy > canvas.height + 100) return;
                const dist = Math.sqrt((decor.x - player.x)**2 + (decor.y - player.y)**2);
                const alpha = Math.max(0, 1 - dist / world.decorDist) * 0.15;
                if (alpha <= 0) return;
                ctx.globalAlpha = alpha;
                if (decor.type === 'rock') {
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.moveTo(decor.x, decor.y - decor.size);
                    ctx.lineTo(decor.x + decor.size * 0.7, decor.y + decor.size * 0.3);
                    ctx.lineTo(decor.x - decor.size * 0.5, decor.y + decor.size * 0.5);
                    ctx.closePath(); ctx.fill();
                } else {
                    ctx.strokeStyle = '#1a2a1a';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(decor.x, decor.y + decor.size);
                    ctx.quadraticCurveTo(decor.x + Math.sin(game.time * 0.01 + decor.seed * 10) * 10, decor.y, decor.x + Math.sin(game.time * 0.02 + decor.seed * 5) * 5, decor.y - decor.size);
                    ctx.stroke();
                }
            });
            ctx.globalAlpha = 1;

            if (game.quality === 'premium') {
                const cloudSeed = Math.floor(game.camera.x / 300) + Math.floor(game.camera.y / 300);
                for (let i = 0; i < 5; i++) {
                    const cx = startX + (i * 300 + cloudSeed * 50) % (canvas.width + 300);
                    const cy = startY + ((i * 137 + cloudSeed * 73) % (canvas.height + 300));
                    patterns.cloud(ctx, cx, cy, 20, 0.08);
                }
            }

            // === 第2层：环境墨迹与血滴（中对比度）===
            inkStains.forEach(stain => {
                const screenX = stain.x - game.camera.x, screenY = stain.y - game.camera.y;
                if (screenX > -120 && screenX < canvas.width + 120 && screenY > -120 && screenY < canvas.height + 120) {
                    const grad = ctx.createRadialGradient(stain.x, stain.y, 0, stain.x, stain.y, stain.size);
                    if (stain.isBlood) grad.addColorStop(0, `rgba(100, 0, 0, ${stain.alpha})`);
                    else if (stain.jieqiColor) {
                        const r = parseInt(stain.jieqiColor.slice(1, 3), 16);
                        const g = parseInt(stain.jieqiColor.slice(3, 5), 16);
                        const b = parseInt(stain.jieqiColor.slice(5, 7), 16);
                        grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${stain.alpha * 0.5})`);
                    } else grad.addColorStop(0, `rgba(30, 30, 30, ${stain.alpha})`);
                    grad.addColorStop(1, 'rgba(10, 10, 10, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(stain.x, stain.y, stain.size, 0, Math.PI * 2); ctx.fill();
                }
            });

            bloodDrops.forEach(b => { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.fill(); });

            // === 第3层：攻击特效（高对比度）===
            if (game.quality === 'premium') {
                swordTrails.forEach(trail => {
                    const alpha = (trail.life / trail.maxLife) * 0.8;
                    if (trail.isBrush) {
                        drawBrushStroke(ctx, trail.x1, trail.y1, trail.x2, trail.y2, trail.width * (trail.life / trail.maxLife), trail.color, alpha);
                    } else {
                        ctx.strokeStyle = trail.color.replace(/[\d.]+\)$/, alpha + ')');
                        ctx.lineWidth = trail.width * (trail.life / trail.maxLife);
                        ctx.lineCap = 'round'; ctx.shadowBlur = 12; ctx.shadowColor = trail.color;
                        ctx.beginPath(); ctx.moveTo(trail.x1, trail.y1); ctx.lineTo(trail.x2, trail.y2); ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                });
            }

            if (game.quality === 'premium' && liubaiEffects.length > 0) {
                liubaiEffects.forEach(effect => {
                    const alpha = effect.life / effect.maxLife;
                    ctx.globalAlpha = alpha;
                    if (effect.type === 'ripple') { ctx.strokeStyle = effect.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(effect.x, effect.y, effect.size * (2 - alpha), 0, Math.PI * 2); ctx.stroke(); }
                    else if (effect.type === 'ink') { ctx.fillStyle = effect.color; ctx.beginPath(); ctx.arc(effect.x, effect.y, effect.size, 0, Math.PI * 2); ctx.fill(); }
                    else if (effect.type === 'particle') { ctx.fillStyle = effect.color; ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(255, 215, 0, 0.8)'; ctx.beginPath(); ctx.arc(effect.x, effect.y, effect.size, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; }
                    else if (effect.type === 'cloud') patterns.cloud(ctx, effect.x, effect.y, effect.size, alpha * 0.3);
                    else if (effect.type === 'shockwave') { ctx.strokeStyle = effect.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(effect.x, effect.y, effect.size, 0, Math.PI * 2); ctx.stroke(); }
                    else if (effect.type === 'ghost') { ctx.fillStyle = effect.color; ctx.beginPath(); ctx.arc(effect.x, effect.y, effect.size, 0, Math.PI * 2); ctx.fill(); }
                    // P1：墨花绽放绘制
                    else if (effect.type === 'inkBloom') {
                        ctx.save();
                        ctx.translate(effect.x, effect.y);
                        ctx.rotate(effect.angle);
                        ctx.fillStyle = effect.color;
                        ctx.globalAlpha = alpha;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(effect.petalLength * 0.25, -effect.size * 0.4, effect.petalLength * 0.7, -effect.size * 0.15, effect.petalLength, 0);
                        ctx.bezierCurveTo(effect.petalLength * 0.7, effect.size * 0.15, effect.petalLength * 0.25, effect.size * 0.4, 0, 0);
                        ctx.fill();
                        ctx.restore();
                    }
                });
                ctx.globalAlpha = 1;
            }

            // === 第3层：分身 ===
            player.clones.forEach(clone => {
                ctx.save(); ctx.translate(clone.x, clone.y); ctx.globalAlpha = 0.5 + Math.sin(game.time * 0.2) * 0.1;
                ctx.strokeStyle = 'rgba(100, 200, 255, 0.5)'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(clone.facing.x * 50, clone.facing.y * 50); ctx.stroke();
                ctx.fillStyle = 'rgba(100, 200, 255, 0.3)'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(100, 200, 255, 0.6)'; ctx.lineWidth = 1; ctx.stroke();
                ctx.restore();
            });

            // === 第2层：敌人 ===
            enemies.forEach(enemy => {
                const screenX = enemy.x - game.camera.x, screenY = enemy.y - game.camera.y;
                if (screenX < -60 || screenX > canvas.width + 60 || screenY < -60 || screenY > canvas.height + 60) return;
                ctx.save(); ctx.translate(enemy.x, enemy.y);
                if (enemy.hitFlash > 0) ctx.globalAlpha = 0.5 + Math.sin(enemy.hitFlash * 0.5) * 0.5;
                if (enemy.poisoned > 0) { ctx.strokeStyle = `rgba(0, 255, 100, ${0.2 + Math.sin(game.time * 0.3) * 0.1})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, enemy.radius + 4, 0, Math.PI * 2); ctx.stroke(); }
                const r = parseInt(enemy.jieqiColor.slice(1, 3), 16), g = parseInt(enemy.jieqiColor.slice(3, 5), 16), b = parseInt(enemy.jieqiColor.slice(5, 7), 16);
                ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.25)`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, enemy.radius + 4, 0, Math.PI * 2); ctx.stroke();

                switch(enemy.type) {
                    case 'slime':
                        const pulse = Math.sin(game.time * 0.1) * 2;
                        ctx.fillStyle = '#1a1a1a'; ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(0, pulse, enemy.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                        patterns.meander(ctx, 0, pulse, 8, 0.3);
                        ctx.fillStyle = '#666'; ctx.beginPath(); ctx.arc(-5, pulse-2, 3, 0, Math.PI * 2); ctx.arc(5, pulse-2, 3, 0, Math.PI * 2); ctx.fill();
                        break;
                    case 'paper':
                        ctx.fillStyle = '#f5f5f5'; ctx.fillRect(-15, -20, 30, 40); ctx.strokeStyle = '#999'; ctx.lineWidth = 1; ctx.strokeRect(-15, -20, 30, 40);
                        patterns.scroll(ctx, 0, -5, 10, 0.4);
                        ctx.fillStyle = '#8b0000'; ctx.beginPath(); ctx.arc(0, -5, 5, 0, Math.PI * 2); ctx.fill();
                        break;
                    case 'ghost':
                        ctx.fillStyle = 'rgba(200, 200, 200, 0.3)'; ctx.beginPath(); ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.lineWidth = 1; ctx.stroke();
                        patterns.cloud(ctx, 0, -5, 8, 0.3);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.beginPath(); ctx.arc(0, -5, 4, 0, Math.PI * 2); ctx.fill();
                        break;
                    case 'ninja':
                        ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); ctx.moveTo(0, -enemy.radius); ctx.lineTo(enemy.radius, enemy.radius); ctx.lineTo(-enemy.radius, enemy.radius); ctx.closePath(); ctx.fill();
                        patterns.taiji(ctx, 0, 0, 6, 0.5);
                        ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
                        break;
                    case 'sumo':
                        ctx.fillStyle = '#3a3a3a'; ctx.beginPath(); ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2); ctx.fill();
                        patterns.lotus(ctx, 0, 0, 12, 0.3);
                        ctx.strokeStyle = '#666'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, enemy.radius - 5, 0, Math.PI * 2); ctx.stroke();
                        break;
                    case 'archer':
                        ctx.fillStyle = '#4a3728'; ctx.beginPath(); ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2); ctx.fill();
                        patterns.auspicious(ctx, 0, -5, 10, 0.3);
                        ctx.strokeStyle = '#8b4513'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -enemy.radius); ctx.lineTo(0, enemy.radius); ctx.stroke();
                        break;
                    case 'bomber':
                        ctx.fillStyle = '#4a0000'; ctx.beginPath(); ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2); ctx.fill();
                        patterns.meander(ctx, 0, 0, 8, 0.3);
                        if (Math.floor(game.time / 10) % 2 === 0) { ctx.fillStyle = '#ff6600'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill(); }
                        break;
                }
                ctx.globalAlpha = 1;
                const hpPct = enemy.hp / enemy.maxHp;
                ctx.fillStyle = '#333'; ctx.fillRect(-20, -38, 40, 4);
                ctx.fillStyle = hpPct > 0.5 ? '#4a4' : '#a44'; ctx.fillRect(-20, -38, 40 * hpPct, 4);
                ctx.restore();
            });

            // === 第3层：环绕武器 ===
            player.orbitWeapons.forEach(weapon => {
                ctx.save(); ctx.translate(weapon.x, weapon.y); ctx.rotate(game.time * 0.1);
                ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
                ctx.fillStyle = 'rgba(255, 215, 0, 0.9)'; ctx.beginPath(); ctx.moveTo(0, -weapon.size); ctx.lineTo(weapon.size * 0.5, 0); ctx.lineTo(0, weapon.size * 1.5); ctx.lineTo(-weapon.size * 0.5, 0); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = 'rgba(139, 69, 19, 0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -weapon.size); ctx.lineTo(0, weapon.size * 1.5); ctx.stroke();
                ctx.shadowBlur = 0; ctx.restore();
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.08)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(player.x, player.y, weapon.orbitRadius, 0, Math.PI * 2); ctx.stroke();
            });

            // === 第3层：玩家（最高对比度）===
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const hairWidth = player.isKuangcao ? 3 : player.hairWidth;
            const hairColor = player.isKuangcao ? 'rgba(255, 215, 0, 0.9)' : 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = hairColor; ctx.lineWidth = hairWidth;
            if (player.isKuangcao) { ctx.shadowBlur = 18; ctx.shadowColor = 'rgba(255, 215, 0, 0.5)'; } else ctx.shadowBlur = 0;
            const attackOffset = player.attackAnim > 0 ? Math.sin(player.attackAnim * 0.5) * 10 : 0;
            ctx.beginPath();
            for (let i = 0; i < player.hairSegments.length; i++) {
                const seg = player.hairSegments[i];
                const offsetX = i > 5 ? Math.cos(player.facing.x * attackOffset) * (i - 5) * 0.5 : 0;
                if (i === 0) ctx.moveTo(seg.x + offsetX, seg.y); else ctx.lineTo(seg.x + offsetX, seg.y);
            }
            ctx.stroke();
            if (player.hairBranches > 1 && !player.isKuangcao) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = player.hairWidth * 0.5;
                const tip = player.hairSegments[player.hairSegments.length - 1];
                ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(tip.x + 22, tip.y + 12); ctx.moveTo(player.x, player.y); ctx.lineTo(tip.x - 22, tip.y + 12); ctx.stroke();
            }
            ctx.shadowBlur = 0;

            ctx.save(); ctx.translate(player.x, player.y);
            if (player.isKuangcao) { ctx.shadowBlur = 22; ctx.shadowColor = 'rgba(255, 215, 0, 0.6)'; }
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
            patterns.taiji(ctx, 0, 0, 9, 0.6);
            ctx.fillStyle = player.isKuangcao ? '#b8860b' : '#700'; ctx.fillRect(-6, 4, 12, 12);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
            if (player.isDodging || player.isKuangcao) { ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(-3, -1, 2, 0, Math.PI * 2); ctx.arc(3, -1, 2, 0, Math.PI * 2); ctx.fill(); }
            else { ctx.beginPath(); ctx.moveTo(-5, -1); ctx.lineTo(-2, -1); ctx.moveTo(2, -1); ctx.lineTo(5, -1); ctx.stroke(); }

            if (player.invincible) {
                const alpha = 0.3 + Math.sin(game.time * 0.3) * 0.2;
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, player.radius + 5, 0, Math.PI * 2); ctx.stroke();
                patterns.auspicious(ctx, 0, 0, player.radius + 10, alpha * 0.4);
            }
            if (player.fullHpProtection && !player.protectionTriggered && player.hp >= player.maxHp) {
                ctx.strokeStyle = 'rgba(74, 255, 74, 0.8)'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(0, 0, player.radius + 9, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
                patterns.lotus(ctx, 0, 0, player.radius + 14, 0.3);
            }
            ctx.shadowBlur = 0;
            if (player.isDodging) { ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-player.vx, -player.vy, player.radius - 2, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
            if (player.kuangcaoChanneling) { ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 135 + Math.sin(game.time * 0.2) * 12, 0, Math.PI * 2); ctx.stroke(); patterns.scroll(ctx, 0, 0, 140, 0.2); }
            if (!game.isTouch) { ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 1; ctx.setLineDash([5, 10]); ctx.beginPath(); ctx.moveTo(0, 0); const aimAngle = Math.atan2(input.mouseWorldY - player.y, input.mouseWorldX - player.x); ctx.lineTo(Math.cos(aimAngle) * 60, Math.sin(aimAngle) * 60); ctx.stroke(); ctx.setLineDash([]); }
            ctx.restore();

            // === 第3层：粒子 ===
            particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 20; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); });
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;

            // === 第4层：浮动文字（最高对比度）===
            floatingTexts.forEach(ft => { const alpha = ft.life / ft.maxLife; ctx.globalAlpha = alpha; ctx.fillStyle = ft.color; ctx.font = `bold ${ft.size}px 'ZCOOL XiaoWei', serif`; ctx.textAlign = 'center'; ctx.fillText(ft.text, ft.x, ft.y); });
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function updateUI() {
            const hpPercent = Math.max(0, Math.min(100, (player.hp / player.maxHp * 100)));
            document.getElementById('hpBar').style.width = hpPercent + '%';
            document.getElementById('hpText').textContent = `${Math.max(0, Math.ceil(player.hp))}/${player.maxHp}`;
            document.getElementById('inkBar').style.width = (player.ink / player.maxInk * 100) + '%';
            document.getElementById('inkText').textContent = `${Math.floor(player.ink)}/${player.maxInk}`;
            document.getElementById('scoreDisplay').textContent = game.score;
            document.getElementById('waveDisplay').textContent = `第 ${game.wave} 波`;
            const jieqi = getCurrentJieqi();
            const jieqiDisplay = document.getElementById('jieqiDisplay');
            jieqiDisplay.textContent = `当前节气：${jieqi.name} · ${jieqi.desc}`; jieqiDisplay.style.color = jieqi.color;

            const dodgeBtn = document.getElementById('dodgeBtn');
            const dodgeCd = document.getElementById('dodgeCooldown');
            const kuangcaoBtn = document.getElementById('kuangcaoBtn');
            if (player.dodgeCooldown > 0) { dodgeCd.style.height = (player.dodgeCooldown / 40 * 100) + '%'; dodgeBtn.classList.add('disabled'); }
            else { dodgeCd.style.height = '0%'; dodgeBtn.classList.remove('disabled'); }
            if (player.ink >= 100 && !player.isKuangcao && !player.kuangcaoChanneling) { kuangcaoBtn.classList.remove('disabled'); kuangcaoBtn.classList.add('ready'); }
            else { kuangcaoBtn.classList.add('disabled'); kuangcaoBtn.classList.remove('ready'); }
        }

        function gameOver() {
            if (game.state === 'gameover') return;
            game.state = 'gameover';
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('gameOver').classList.remove('hidden');
            document.getElementById('gameUI').classList.add('hidden');
            document.getElementById('joystickBase').classList.remove('active');
            document.getElementById('joystickKnob').classList.remove('active');
            input.moveX = 0; input.moveY = 0; input.attacking = false; input.kuangcaoPressed = false;
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }

        // ============ 设置 ============
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const pauseOverlay = document.getElementById('pauseOverlay');
        let settingsOpen = false;
        settingsBtn.addEventListener('click', () => {
            settingsOpen = !settingsOpen;
            if (settingsOpen) { game.paused = true; settingsPanel.classList.add('active'); pauseOverlay.classList.add('active'); }
            else { game.paused = false; settingsPanel.classList.remove('active'); pauseOverlay.classList.remove('active'); }
        });
        pauseOverlay.addEventListener('click', () => { settingsOpen = false; game.paused = false; settingsPanel.classList.remove('active'); pauseOverlay.classList.remove('active'); });
        const shakeSlider = document.getElementById('shakeSlider');
        const shakeValue = document.getElementById('shakeValue');
        shakeSlider.addEventListener('input', (e) => { const value = parseInt(e.target.value); game.shakeIntensity = value / 100; shakeValue.textContent = value + '%'; });
        const soundToggle = document.getElementById('soundToggle');
        soundToggle.addEventListener('click', () => { game.soundEnabled = !game.soundEnabled; soundToggle.textContent = game.soundEnabled ? '开启' : '关闭'; soundToggle.classList.toggle('active', game.soundEnabled); if (game.soundEnabled) initAudio(); });

        // P1：死区调节
        const deadzoneSlider = document.getElementById('deadzoneSlider');
        const deadzoneValue = document.getElementById('deadzoneValue');
        deadzoneSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            deadzone = value / 100;
            deadzoneValue.textContent = value + '%';
            localStorage.setItem('kuangcao_deadzone', deadzone);
        });
        // 读取保存的死区
        const savedDeadzone = localStorage.getItem('kuangcao_deadzone');
        if (savedDeadzone !== null) {
            deadzone = parseFloat(savedDeadzone);
            deadzoneSlider.value = Math.round(deadzone * 100);
            deadzoneValue.textContent = Math.round(deadzone * 100) + '%';
        }

        // P1：自定义布局开关
        const layoutToggle = document.getElementById('layoutToggle');
        const gameUI = document.getElementById('gameUI');
        layoutToggle.addEventListener('click', () => {
            customLayoutMode = !customLayoutMode;
            layoutToggle.textContent = customLayoutMode ? '开启' : '关闭';
            layoutToggle.classList.toggle('active', customLayoutMode);
            if (customLayoutMode) {
                gameUI.classList.add('custom-layout-mode');
                document.getElementById('layoutHint').classList.add('active');
            } else {
                gameUI.classList.remove('custom-layout-mode');
                document.getElementById('layoutHint').classList.remove('active');
                draggedElement = null;
            }
        });

        // ============ 触屏控制 ============
        const joystickArea = document.getElementById('joystickArea');
        const joystickBase = document.getElementById('joystickBase');
        const joystickKnob = document.getElementById('joystickKnob');
        let joystickTouchId = null;
        let joystickPos = { x: 0, y: 0 };
        const maxRadius = 35;
        function getTouchById(touches, id) { for (let i = 0; i < touches.length; i++) if (touches[i].identifier === id) return touches[i]; return null; }

        joystickArea.addEventListener('touchstart', e => {
            e.preventDefault();
            if (joystickTouchId !== null || game.paused) return;
            const touch = e.changedTouches[0]; joystickTouchId = touch.identifier;
            joystickPos.x = touch.clientX; joystickPos.y = touch.clientY;
            joystickBase.style.left = (joystickPos.x - 60) + 'px'; joystickBase.style.top = (joystickPos.y - 60) + 'px';
            joystickKnob.style.left = (joystickPos.x - 25) + 'px'; joystickKnob.style.top = (joystickPos.y - 25) + 'px';
            joystickBase.classList.add('active'); joystickKnob.classList.add('active');
            updateJoystickInput(touch);
        }, { passive: false });
        joystickArea.addEventListener('touchmove', e => { e.preventDefault(); if (joystickTouchId === null || game.paused) return; const touch = getTouchById(e.changedTouches, joystickTouchId); if (!touch) return; updateJoystickInput(touch); }, { passive: false });
        joystickArea.addEventListener('touchend', e => { e.preventDefault(); const touch = getTouchById(e.changedTouches, joystickTouchId); if (!touch) return; joystickTouchId = null; input.moveX = 0; input.moveY = 0; joystickBase.classList.remove('active'); joystickKnob.classList.remove('active'); }, { passive: false });
        joystickArea.addEventListener('touchcancel', e => { e.preventDefault(); const touch = getTouchById(e.changedTouches, joystickTouchId); if (!touch) return; joystickTouchId = null; input.moveX = 0; input.moveY = 0; joystickBase.classList.remove('active'); joystickKnob.classList.remove('active'); }, { passive: false });
        function updateJoystickInput(touch) {
            let dx = touch.clientX - joystickPos.x, dy = touch.clientY - joystickPos.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxRadius) { const ratio = maxRadius / dist; dx *= ratio; dy *= ratio; }
            // P1：应用死区
            const inputDist = Math.sqrt(dx*dx + dy*dy);
            const deadzonePx = deadzone * maxRadius;
            if (inputDist < deadzonePx) {
                dx = 0; dy = 0;
            } else {
                // 重新映射死区外的值到完整范围
                const effectiveMax = maxRadius - deadzonePx;
                const effectiveDist = inputDist - deadzonePx;
                const scale = effectiveDist / effectiveMax;
                const angle = Math.atan2(dy, dx);
                dx = Math.cos(angle) * maxRadius * scale;
                dy = Math.sin(angle) * maxRadius * scale;
            }
            joystickKnob.style.left = (joystickPos.x + dx - 25) + 'px'; joystickKnob.style.top = (joystickPos.y + dy - 25) + 'px';
            input.moveX = dx / maxRadius; input.moveY = dy / maxRadius;
        }

        const attackBtn = document.getElementById('attackBtn');
        attackBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); if (game.paused || customLayoutMode) return; input.attacking = true; attackBtn.classList.add('active'); attack(); }, { passive: false });
        attackBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); input.attacking = false; attackBtn.classList.remove('active'); }, { passive: false });
        document.getElementById('dodgeBtn').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); if (game.paused || customLayoutMode) return; dodge(); }, { passive: false });
        const kuangcaoBtn = document.getElementById('kuangcaoBtn');
        kuangcaoBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); if (game.paused || customLayoutMode) return; if (startKuangcao()) input.kuangcaoPressed = true; }, { passive: false });
        kuangcaoBtn.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); input.kuangcaoPressed = false; cancelKuangcao(); }, { passive: false });
        kuangcaoBtn.addEventListener('touchcancel', e => { e.preventDefault(); e.stopPropagation(); input.kuangcaoPressed = false; cancelKuangcao(); }, { passive: false });
        document.addEventListener('touchmove', e => { if (e.target === canvas || e.target.id === 'joystickArea') e.preventDefault(); }, { passive: false });

        // ============ P1：按钮拖拽自定义布局 ============
        const draggableButtons = ['attackBtn', 'dodgeBtn', 'kuangcaoBtn'];
        function initLayoutDrag() {
            draggableButtons.forEach(id => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', handleLayoutDragStart, { passive: false });
                el.addEventListener('touchmove', handleLayoutDragMove, { passive: false });
                el.addEventListener('touchend', handleLayoutDragEnd, { passive: false });
            });
        }
        function handleLayoutDragStart(e) {
            if (!customLayoutMode) return;
            e.preventDefault(); e.stopPropagation();
            const touch = e.changedTouches[0];
            draggedElement = e.currentTarget;
            draggedElement.classList.add('dragging');
            // 将right/bottom定位转换为left/top定位
            const rect = draggedElement.getBoundingClientRect();
            draggedElement.style.left = rect.left + 'px';
            draggedElement.style.top = rect.top + 'px';
            draggedElement.style.right = 'auto';
            draggedElement.style.bottom = 'auto';
            dragOffset.x = touch.clientX - rect.left;
            dragOffset.y = touch.clientY - rect.top;
        }
        function handleLayoutDragMove(e) {
            if (!draggedElement || !customLayoutMode) return;
            e.preventDefault(); e.stopPropagation();
            const touch = e.changedTouches[0];
            draggedElement.style.left = (touch.clientX - dragOffset.x) + 'px';
            draggedElement.style.top = (touch.clientY - dragOffset.y) + 'px';
        }
        function handleLayoutDragEnd(e) {
            if (!draggedElement) return;
            draggedElement.classList.remove('dragging');
            draggedElement = null;
            saveLayout();
        }
        function saveLayout() {
            const layout = {};
            draggableButtons.forEach(id => {
                const el = document.getElementById(id);
                layout[id] = {
                    left: el.style.left,
                    top: el.style.top,
                    right: el.style.right,
                    bottom: el.style.bottom
                };
            });
            localStorage.setItem(layoutStorageKey, JSON.stringify(layout));
        }
        function loadLayout() {
            const saved = localStorage.getItem(layoutStorageKey);
            if (!saved) return;
            try {
                const layout = JSON.parse(saved);
                Object.keys(layout).forEach(id => {
                    const el = document.getElementById(id);
                    const pos = layout[id];
                    if (pos.left && pos.left !== 'auto') el.style.left = pos.left;
                    if (pos.top && pos.top !== 'auto') el.style.top = pos.top;
                    if (pos.right && pos.right !== 'auto') el.style.right = pos.right;
                    if (pos.bottom && pos.bottom !== 'auto') el.style.bottom = pos.bottom;
                });
            } catch(e) {}
        }

        // ============ PC键鼠 ============
        window.addEventListener('keydown', e => {
            input.keys[e.key.toLowerCase()] = true;
            if (game.state !== 'playing' || game.paused) return;
            if (e.code === 'Space') { e.preventDefault(); dodge(); }
            if (e.code === 'KeyQ') { e.preventDefault(); if (startKuangcao()) input.kuangcaoPressed = true; }
            if (e.code === 'Escape') settingsBtn.click();
        });
        window.addEventListener('keyup', e => {
            input.keys[e.key.toLowerCase()] = false;
            if (e.code === 'KeyQ') { input.kuangcaoPressed = false; cancelKuangcao(); }
        });
        canvas.addEventListener('mousemove', e => { input.mouseX = e.clientX; input.mouseY = e.clientY; input.mouseWorldX = e.clientX + game.camera.x; input.mouseWorldY = e.clientY + game.camera.y; });
        canvas.addEventListener('mousedown', e => { if (game.state !== 'playing' || game.paused) return; if (e.button === 0) { input.attacking = true; attack(); } });
        canvas.addEventListener('mouseup', e => { if (e.button === 0) input.attacking = false; });

        function startGame() {
            document.getElementById('titleScreen').classList.add('hidden');
            document.getElementById('gameUI').classList.remove('hidden');
            initAudio(); initHair(); spawnWave(); game.state = 'playing';
            game.currentRank = 0;
            applyRankBonus(0);
            if (game.isTouch) { document.getElementById('touchHint').style.display = 'block'; document.getElementById('pcHint').style.display = 'none'; }
            else { document.getElementById('touchHint').style.display = 'none'; document.getElementById('pcHint').style.display = 'block'; }
            // P1：加载自定义布局
            loadLayout();
        }

        window.addEventListener('resize', () => { resizeCanvas(); game.isTouch = detectTouch(); });
        // P1：初始化拖拽
        initLayoutDrag();
        loop();
    </script>
</body>
</html>
