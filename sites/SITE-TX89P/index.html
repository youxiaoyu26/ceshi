<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>狂草 - 水墨动作Roguelike</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { background: #0a0a0a; overflow: hidden; font-family: 'Noto Serif SC', 'ZCOOL XiaoWei', serif; color: #e5e5e5; position: fixed; width: 100%; height: 100%; }
        #gameCanvas { display: block; image-rendering: pixelated; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
        .ink-text { text-shadow: 2px 2px 4px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1); letter-spacing: 0.2em; }
        .ui-panel { background: rgba(10, 10, 10, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .ink-bar { background: linear-gradient(90deg, #1a1a1a, #2a2a2a); border: 1px solid rgba(255, 255, 255, 0.2); position: relative; overflow: hidden; border-radius: 999px; }
        .ink-fill { background: linear-gradient(90deg, #fff, #ccc); box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); transition: width 0.1s; height: 100%; border-radius: 999px; }
        .health-fill { background: linear-gradient(90deg, #8b0000, #dc143c); box-shadow: 0 0 10px rgba(220, 20, 60, 0.5); }
        .full-hp-indicator { position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; background: #4aff4a; border-radius: 50%; box-shadow: 0 0 10px #4aff4a; animation: pulse-green 1.5s infinite; display: none; }
        .full-hp-indicator.active { display: block; }
        @keyframes pulse-green { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.2); } }
        .joystick-area { position: absolute; bottom: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; z-index: 10; touch-action: none; }
        .joystick-base { position: absolute; width: 120px; height: 120px; border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; background: rgba(255, 255, 255, 0.1); display: none; pointer-events: none; touch-action: none; }
        .joystick-base.active { display: block; }
        .joystick-knob { position: absolute; width: 50px; height: 50px; background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(200,200,200,0.7)); border-radius: 50%; box-shadow: 0 4px 20px rgba(0,0,0,0.6); display: none; pointer-events: none; touch-action: none; }
        .joystick-knob.active { display: block; }
        .attack-btn { position: absolute; bottom: 100px; right: 60px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(139,0,0,0.8), rgba(100,0,0,0.6)); border: 3px solid rgba(255, 100, 100, 0.5); display: flex; align-items: center; justify-content: center; font-size: 14px; color: rgba(255,255,255,0.9); pointer-events: auto; box-shadow: 0 4px 20px rgba(139,0,0,0.4); transition: all 0.1s; z-index: 20; font-family: 'ZCOOL XiaoWei', serif; touch-action: none; }
        .attack-btn:active { transform: scale(0.95); background: radial-gradient(circle, rgba(200,0,0,0.9), rgba(139,0,0,0.8)); }
        .attack-btn.active { background: radial-gradient(circle, rgba(255,50,50,0.9), rgba(200,0,0,0.8)); box-shadow: 0 0 30px rgba(255,0,0,0.6); }
        .skill-btn { position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; pointer-events: auto; transition: all 0.2s; background: rgba(0,0,0,0.6); z-index: 20; font-family: 'ZCOOL XiaoWei', serif; touch-action: none; }
        .skill-btn:active { transform: scale(0.9); }
        .skill-btn.disabled { opacity: 0.3; border-color: rgba(255,255,255,0.1); }
        .skill-dodge { bottom: 220px; right: 40px; border-color: rgba(100, 200, 255, 0.5); color: rgba(100, 200, 255, 0.9); }
        .skill-kuangcao { bottom: 100px; right: 180px; border-color: rgba(255, 215, 0, 0.5); color: rgba(255, 215, 0, 0.9); }
        .skill-kuangcao.ready { animation: pulse 1.5s infinite; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        .skill-kuangcao.channeling { background: rgba(255, 215, 0, 0.3); animation: channeling 0.5s infinite alternate; }
        @keyframes channeling { from { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); } to { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .combo-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.8); pointer-events: none; opacity: 0; transition: opacity 0.3s; font-family: 'ZCOOL XiaoWei', serif; display: flex; flex-direction: column; align-items: center; }
        .combo-display.show { opacity: 1; animation: comboPop 0.5s ease-out; }
        @keyframes comboPop { 0% { transform: translate(-50%, -50%) scale(0.5); } 50% { transform: translate(-50%, -50%) scale(1.2); } 100% { transform: translate(-50%, -50%) scale(1); } }
        .combo-rank { font-size: 20px; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.5); margin-top: -10px; }
        .liubai-text { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 72px; font-weight: 900; color: rgba(255,255,255,0.95); text-shadow: 0 0 40px rgba(255,255,255,0.8); pointer-events: none; opacity: 0; transition: all 0.5s; font-family: 'ZCOOL XiaoWei', serif; }
        .liubai-text.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        .screen-shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-2px, 0, 0); } 40%, 60% { transform: translate3d(2px, 0, 0); } }
        .title-screen { background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); }
        .start-btn { background: linear-gradient(135deg, rgba(139,0,0,0.8), rgba(100,0,0,0.6)); border: 2px solid rgba(255,100,100,0.5); box-shadow: 0 4px 20px rgba(139,0,0,0.4); }
        .upgrade-card { transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); background: rgba(20,20,20,0.9); display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; cursor: pointer; }
        .upgrade-card:hover { border-color: rgba(255,255,255,0.3); background: rgba(35,35,35,0.95); }
        .upgrade-card:active { transform: scale(0.98); border-color: rgba(255,255,255,0.5); background: rgba(40,40,40,0.9); }
        .upgrade-card .flow-type { font-size: 10px; padding: 2px 10px; border-radius: 20px; background: rgba(255,255,255,0.1); color: #aaa; margin-left: auto; }
        .hidden { display: none !important; }
        .settings-btn { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; color: rgba(255,255,255,0.8); pointer-events: auto; z-index: 30; transition: all 0.3s; cursor: pointer; touch-action: none; }
        .settings-btn:hover { background: rgba(255,255,255,0.15); transform: rotate(45deg); }
        .settings-btn:active { transform: rotate(90deg) scale(0.9); }
        .settings-panel { position: absolute; top: 70px; right: 20px; width: 220px; background: rgba(10,10,10,0.95); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 16px; pointer-events: auto; z-index: 35; opacity: 0; transform: translateY(-10px); pointer-events: none; transition: all 0.3s; }
        .settings-panel.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .settings-title { font-size: 14px; color: rgba(255,255,255,0.9); margin-bottom: 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; font-family: 'ZCOOL XiaoWei', serif; }
        .setting-item { margin-bottom: 12px; }
        .setting-item label { display: block; font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
        .setting-slider { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; }
        .setting-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: pointer; }
        .setting-value { font-size: 10px; color: rgba(255,255,255,0.8); text-align: right; margin-top: 2px; }
        .toggle-btn { width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: rgba(255,255,255,0.8); font-size: 11px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .toggle-btn:hover { background: rgba(255,255,255,0.2); }
        .toggle-btn.active { background: rgba(100,200,100,0.3); border-color: rgba(100,200,100,0.5); color: #4aff4a; }
        .toggle-btn:active { transform: scale(0.95); }
        .quality-selector { display: flex; gap: 8px; margin-top: 6px; }
        .quality-btn { flex: 1; padding: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: rgba(255,255,255,0.6); font-size: 10px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .quality-btn:hover { background: rgba(255,255,255,0.15); }
        .quality-btn.active { background: rgba(100,150,255,0.3); border-color: rgba(100,150,255,0.6); color: #6aa8ff; }
        .pause-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 25; }
        .pause-overlay.active { opacity: 1; pointer-events: auto; }
        .pause-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: 900; color: rgba(255,255,255,0.5); letter-spacing: 0.5em; font-family: 'ZCOOL XiaoWei', serif; }
        .control-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.3); font-size: 11px; font-family: 'ZCOOL XiaoWei', serif; pointer-events: none; text-align: center; white-space: nowrap; }
        @media (pointer: coarse) { .attack-btn, .skill-btn, .joystick-area { display: flex !important; } .control-hint { display: none !important; } }
        @media (pointer: fine) { .attack-btn, .skill-btn, .joystick-area { display: none !important; } }
        .eight-methods-hint { position: absolute; bottom: 260px; right: 50px; color: rgba(255,215,0,0.8); font-size: 14px; font-family: 'ZCOOL XiaoWei', serif; text-shadow: 0 0 20px rgba(255,215,0,0.3); pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        .eight-methods-hint.active { opacity: 1; }
        .channel-bar { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); width: 200px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 99px; overflow: hidden; display: none; z-index: 15; }
        .channel-bar.active { display: block; }
        .channel-fill { height: 100%; background: linear-gradient(90deg, #ffd700, #ff6b00); transition: width 0.1s; width: 0%; border-radius: 99px; }

        /* ===== P1新增：墨晕效果 ===== */
        .ink-bleed-overlay {
            position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s ease-out; z-index: 20;
            box-shadow: inset 0 0 120px 60px rgba(0,0,0,0.85);
        }
        .ink-bleed-overlay.active { opacity: 1; }
        .ink-bleed-overlay::before, .ink-bleed-overlay::after {
            content: ''; position: absolute; border-radius: 50%; filter: blur(50px); opacity: 0.7;
        }
        .ink-bleed-overlay::before { top: -80px; left: -80px; width: 250px; height: 250px; background: radial-gradient(circle, rgba(0,0,0,0.95), transparent 70%); }
        .ink-bleed-overlay::after { bottom: -80px; right: -80px; width: 250px; height: 250px; background: radial-gradient(circle, rgba(0,0,0,0.95), transparent 70%); }

        /* ===== P1新增：自定义布局模式 ===== */
        .custom-layout-mode .attack-btn,
        .custom-layout-mode .skill-btn {
            border: 2px dashed rgba(255,255,255,0.6) !important;
            animation: layoutPulse 1.2s infinite;
            cursor: move !important;
        }
        @keyframes layoutPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
            50% { opacity: 0.65; box-shadow: 0 0 25px rgba(255,255,255,0.4); }
        }
        .dragging { z-index: 100 !important; opacity: 0.85; transform: scale(1.08); }
        .layout-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 18px; color: rgba(255,255,255,0.7); pointer-events: none;
            font-family: 'ZCOOL XiaoWei', serif; text-shadow: 0 0 10px rgba(0,0,0,0.8);
            opacity: 0; transition: opacity 0.3s; z-index: 15;
        }
        .layout-hint.active { opacity: 1; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-black">

    <canvas id="gameCanvas"></canvas>

    <div id="titleScreen" class="absolute inset-0 flex flex-col items-center justify-center title-screen z-50">
        <h1 class="text-6xl md:text-8xl font-black mb-2 ink-text text-white tracking-widest text-center px-4" style="font-family: 'ZCOOL XiaoWei', serif;">狂草</h1>
        <p class="text-sm md:text-lg text-gray-400 mb-8 tracking-[0.3em]" style="font-family: 'ZCOOL XiaoWei', serif;">墨韵·节气·狂书·无限</p>
        <div class="space-y-4 text-center px-6">
            <button onclick="startGame()" class="start-btn px-10 py-4 text-xl rounded-lg text-white tracking-widest active:scale-95 transition-transform cursor-pointer" style="font-family: 'ZCOOL XiaoWei', serif;">挥毫开战</button>
            <div class="text-xs text-gray-500 mt-6 space-y-2" style="font-family: 'ZCOOL XiaoWei', serif;">
                <p id="touchHint">左半屏触摸移动 | 右侧按钮攻击/闪避/狂草</p>
                <p id="pcHint" style="display:none">WASD移动 | 鼠标左键攻击 | 空格闪避 | Q狂草</p>
                <p>无限地图 · 完美闪避触发"留白" · 满血免死保护</p>
            </div>
        </div>
    </div>

    <div id="gameUI" class="absolute inset-0 pointer-events-none hidden">
        <div class="absolute top-4 left-4 w-40 md:w-56">
            <div class="mb-2 relative">
                <div class="flex justify-between mb-1 text-xs">
                    <span class="text-gray-300" style="font-family: 'ZCOOL XiaoWei', serif;">气血</span>
                    <span id="hpText" class="text-red-400">100/100</span>
                </div>
                <div class="ink-bar h-2 md:h-3">
                    <div id="hpBar" class="health-fill rounded-full" style="width: 100%"></div>
                    <div id="fullHpIndicator" class="full-hp-indicator"></div>
                </div>
            </div>
            <div class="mb-2">
                <div class="flex justify-between mb-1 text-xs">
                    <span class="text-gray-300" style="font-family: 'ZCOOL XiaoWei', serif;">墨韵</span>
                    <span id="inkText" class="text-white">0/100</span>
                </div>
                <div class="ink-bar h-3 md:h-4">
                    <div id="inkBar" class="ink-fill rounded-full" style="width: 0%"></div>
                </div>
            </div>
            <div class="text-white text-lg font-bold" id="scoreDisplay">0</div>
            <div class="text-gray-500 text-xs" id="waveDisplay">第 1 波</div>
            <div class="text-amber-400 text-xs mt-1" id="jieqiDisplay" style="font-family: 'ZCOOL XiaoWei', serif;">当前节气：立春</div>
        </div>

        <div id="comboDisplay" class="combo-display">
            <span><span id="comboCount">0</span> <span class="text-lg">连击</span></span>
            <span id="comboRank" class="combo-rank">初墨</span>
        </div>
        <div id="liubaiText" class="liubai-text">留白</div>

        <!-- P1新增：墨晕覆盖层 -->
        <div id="inkBleedOverlay" class="ink-bleed-overlay"></div>
        <!-- P1新增：自定义布局提示 -->
        <div id="layoutHint" class="layout-hint">拖拽调整按钮位置</div>

        <div id="settingsBtn" class="settings-btn pointer-events-auto">⚙</div>
        <div id="settingsPanel" class="settings-panel">
            <div class="settings-title">设置</div>
            <div class="setting-item">
                <label>画质模式</label>
                <div class="quality-selector">
                    <div id="qualityStandard" class="quality-btn active" onclick="setQuality('standard')">标准</div>
                    <div id="qualityPremium" class="quality-btn" onclick="setQuality('premium')">精美</div>
                </div>
                <div class="setting-value" id="qualityDesc">标准画质 - 流畅优先</div>
            </div>
            <div class="setting-item">
                <label>震感强度</label>
                <input type="range" id="shakeSlider" class="setting-slider" min="0" max="100" value="50">
                <div class="setting-value" id="shakeValue">50%</div>
            </div>
            <div class="setting-item">
                <label>打击音效</label>
                <div id="soundToggle" class="toggle-btn active">开启</div>
            </div>
            <!-- P1新增：摇杆死区 -->
            <div class="setting-item">
                <label>摇杆死区</label>
                <input type="range" id="deadzoneSlider" class="setting-slider" min="0" max="50" value="10">
                <div class="setting-value" id="deadzoneValue">10%</div>
            </div>
            <!-- P1新增：自定义布局开关 -->
            <div class="setting-item">
                <label>自定义布局</label>
                <div id="layoutToggle" class="toggle-btn">关闭</div>
            </div>
        </div>
        <div id="pauseOverlay" class="pause-overlay">
            <div class="pause-text">已暂停</div>
        </div>

        <div id="joystickArea" class="joystick-area"></div>
        <div id="joystickBase" class="joystick-base"></div>
        <div id="joystickKnob" class="joystick-knob"></div>

        <div id="attackBtn" class="attack-btn"><span>攻</span></div>
        <div id="dodgeBtn" class="skill-btn skill-dodge">
            <span class="text-lg mb-1">避</span><span class="text-[10px]">闪避</span>
            <div id="dodgeCooldown" class="cooldown-overlay" style="height: 0%"></div>
        </div>
        <div id="kuangcaoBtn" class="skill-btn skill-kuangcao disabled">
            <span class="text-lg mb-1">狂</span><span class="text-[10px]">狂草</span>
        </div>
        <div id="channelBar" class="channel-bar"><div id="channelFill" class="channel-fill"></div></div>
        <div id="eightMethodsHint" class="eight-methods-hint">八法 · 方向释法</div>
        <div class="control-hint">WASD移动 | 鼠标左键攻击 | 空格闪避 | Q狂草</div>
    </div>

    <div id="upgradeScreen" class="absolute inset-0 bg-black/95 flex items-center justify-center hidden z-40 p-4">
        <div class="text-center w-full max-w-md">
            <h2 class="text-3xl font-bold mb-2 text-white" style="font-family: 'ZCOOL XiaoWei', serif;">笔锋精进</h2>
            <p class="text-gray-400 mb-2 text-sm" style="font-family: 'ZCOOL XiaoWei', serif;">选择一项墨宝强化</p>
            <p class="text-amber-400 mb-6 text-xs" id="nextJieqiText" style="font-family: 'ZCOOL XiaoWei', serif;">下一节气：雨水</p>
            <div class="space-y-3" id="upgradeOptions"></div>
        </div>
    </div>

    <div id="gameOver" class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center hidden z-50">
        <h2 class="text-5xl font-bold text-white mb-4" style="font-family: 'ZCOOL XiaoWei', serif;">墨尽</h2>
        <p class="text-xl text-gray-400 mb-2" style="font-family: 'ZCOOL XiaoWei', serif;">最终得分</p>
        <p class="text-4xl text-white mb-8 font-bold" id="finalScore">0</p>
        <button onclick="location.reload()" class="px-8 py-3 bg-red-900/50 border border-red-500/50 rounded-lg text-white active:scale-95 transition-transform cursor-pointer" style="font-family: 'ZCOOL XiaoWei', serif;">重开一局</button>
    </div>

    <script>
        // ============ 24节气数据 ============
        const jieqiList = [
            { name: '立春', desc: '万物复苏', color: '#4a7c59', enemyMod: 'speed', modValue: 1.0 },
            { name: '雨水', desc: '润物无声', color: '#5a8a9c', enemyMod: 'hp', modValue: 1.1 },
            { name: '惊蛰', desc: '春雷乍动', color: '#8b6914', enemyMod: 'damage', modValue: 1.15 },
            { name: '春分', desc: '昼夜平分', color: '#6b8e23', enemyMod: 'count', modValue: 1.2 },
            { name: '清明', desc: '气清景明', color: '#4a6741', enemyMod: 'speed', modValue: 1.15 },
            { name: '谷雨', desc: '雨生百谷', color: '#2f5d50', enemyMod: 'hp', modValue: 1.2 },
            { name: '立夏', desc: '万物并秀', color: '#8b4513', enemyMod: 'damage', modValue: 1.2 },
            { name: '小满', desc: '小得盈满', color: '#a0522d', enemyMod: 'count', modValue: 1.3 },
            { name: '芒种', desc: '忙种忙收', color: '#cd853f', enemyMod: 'speed', modValue: 1.2 },
            { name: '夏至', desc: '日长之至', color: '#b8860b', enemyMod: 'hp', modValue: 1.3 },

            } else if (isCrit) {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);

        // ============ P1：毛笔笔触绘制 ============
        function drawBrushStroke(ctx, x1, y1, x2, y2, width, color, alpha) {
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.sqrt(dx*dx + dy*dy);
            if (len < 1) return;
            const angle = Math.atan2(dy, dx);
            const perpX = -Math.sin(angle), perpY = Math.cos(angle);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            // 主笔触：中间粗两头细
            const grad = ctx.createLinearGradient(x1, y1, x2, y2);
            grad.addColorStop(0, color.replace(/[\d.]+\)$/, (alpha * 0.3) + ')'));
            grad.addColorStop(0.5, color.replace(/[\d.]+\)$/, (alpha * 0.9) + ')'));
            grad.addColorStop(1, color.replace(/[\d.]+\)$/, (alpha * 0.2) + ')'));
            ctx.strokeStyle = grad;
            ctx.lineWidth = width;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            // 飞白效果：笔触边缘不规则细线
            ctx.lineWidth = width * 0.25;
            for (let i = 0; i < 3; i++) {
                const offset = (Math.random() - 0.5) * width * 0.9;
                const flickerAlpha = alpha * (0.15 + Math.random() * 0.25);
                ctx.strokeStyle = color.replace(/[\d.]+\)$/, flickerAlpha + ')');
                ctx.beginPath();
                const fx1 = x1 + perpX * offset, fy1 = y1 + perpY * offset;
                const fx2 = x2 + perpX * offset * 0.4, fy2 = y2 + perpY * offset * 0.4;
                ctx.moveTo(fx1, fy1); ctx.lineTo(fx2, fy2); ctx.stroke();
            }
            // 墨点飞溅
            ctx.fillStyle = color;
            for (let i = 0; i < 4; i++) {
                const t = 0.2 + Math.random() * 0.6;
                const px = x1 + dx * t + (Math.random() - 0.5) * width * 0.8;
                const py = y1 + dy * t + (Math.random() - 0.5) * width * 0.8;
                const size = Math.random() * width * 0.25;
                ctx.globalAlpha = alpha * (0.2 + Math.random() * 0.3);
                ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        // ============ P1：墨花绽放效果 ============
        function createInkBloom(x, y, color, intensity) {
            intensity = intensity || 1;
            const petalCount = Math.floor((5 + Math.random() * 4) * intensity);
            for (let i = 0; i < petalCount; i++) {

                    color: color || `rgba(${25+Math.random()*35},${25+Math.random()*35},${25+Math.random()*35},${0.35+Math.random()*0.35})`,
                    angle, petalLength: size * (1.2 + Math.random() * 1.2),
                    rotSpeed: (Math.random() - 0.5) * 0.08
                });

            // 中心浓墨点
            for (let i = 0; i < 6 * intensity; i++) {

        // ============ 打击感 ============

        function freezeFrame(frames) { game.freezeTimer = frames; }

        // ============ 八法定义 ============
        const eightMethods = [
            { name: '侧锋', dir: { x: -1, y: 0 }, desc: '横向范围', color: '#8bf',
              effect: (angle) => { return { damageMult: 0.9, rangeMult: 1.8, knockback: 12, isWide: true, trailColor: 'rgba(100,180,255,0.8)' }; } },
            { name: '中锋', dir: { x: 0, y: -1 }, desc: '直线穿透', color: '#fff',
              effect: (angle) => { return { damageMult: 1.3, rangeMult: 1.2, knockback: 8, pierce: true, trailColor: 'rgba(255,255,255,0.9)' }; } },
            { name: '逆锋', dir: { x: 0, y: 1 }, desc: '范围击退', color: '#f84',
              effect: (angle) => { return { damageMult: 0.7, rangeMult: 2.0, knockback: 22, isAoe: true, trailColor: 'rgba(255,136,68,0.8)' }; } },
            { name: '露锋', dir: { x: 1, y: 0 }, desc: '多段快速', color: '#4f4',
              effect: (angle) => { return { damageMult: 0.6, rangeMult: 1.0, knockback: 4, multiHit: 3, trailColor: 'rgba(68,255,68,0.8)' }; } },
            { name: '藏锋', dir: { x: -0.707, y: -0.707 }, desc: '高暴击', color: '#f4f',
              effect: (angle) => { return { damageMult: 1.0, rangeMult: 1.0, knockback: 6, critBonus: 0.4, trailColor: 'rgba(255,68,255,0.8)' }; } },
            { name: '折锋', dir: { x: 0.707, y: -0.707 }, desc: '墨韵伤害', color: '#ff4',
              effect: (angle) => { return { damageMult: 1.2, rangeMult: 1.0, knockback: 6, inkDamage: 0.3, trailColor: 'rgba(255,255,68,0.8)' }; } },
            { name: '转锋', dir: { x: -0.707, y: 0.707 }, desc: '回旋周围', color: '#f82',
              effect: (angle) => { return { damageMult: 0.8, rangeMult: 2.2, knockback: 10, isSpin: true, trailColor: 'rgba(255,136,34,0.8)' }; } },
            { name: '回锋', dir: { x: 0.707, y: 0.707 }, desc: '吸血', color: '#f44',
              effect: (angle) => { return { damageMult: 0.9, rangeMult: 1.0, knockback: 6, lifeSteal: 0.2, trailColor: 'rgba(255,68,68,0.8)' }; } }
        ];

        function getEightMethodFromDirection(dx, dy) {
            if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) return eightMethods[1];
            let angle = Math.atan2(dy, dx);
            let minDiff = Infinity;
            let best = eightMethods[0];
            for (let m of eightMethods) {
                let mAngle = Math.atan2(m.dir.y, m.dir.x);
                let diff = Math.abs(angle - mAngle);
                if (diff > Math.PI) diff = 2 * Math.PI - diff;
                if (diff < minDiff) { minDiff = diff; best = m; }
            }
            return best;
        }

        function performEightMethodAttack(method) {
            const eff = method.effect(0);
            const baseDamage = player.damage;
            let damage = baseDamage * eff.damageMult;
            const critBonus = eff.critBonus || 0;
            let isCrit = Math.random() < (player.critChance + critBonus + (player.perfectDodgeCrit ? 0.5 : 0));
            if (isCrit) damage *= 2.2;
            const rank = comboRanks[game.currentRank];
            damage *= (1 + rank.damageBonus);
            if (eff.inkDamage) {
                const inkDmg = player.ink * eff.inkDamage * 0.05;
                damage += inkDmg;
                player.ink = Math.max(0, player.ink - 10);
                addFloatingText(player.x, player.y-50, '墨伤', '#ffd700', 16, 40);
            }
            if (eff.lifeSteal) {
                const heal = damage * eff.lifeSteal;
                player.hp = Math.min(player.maxHp, player.hp + heal);
                showHealNumber(player.x, player.y-30, heal);
            }
            const range = player.hairLength * (eff.rangeMult || 1);
            const knockback = eff.knockback || 8;
            const angle = Math.atan2(player.facing.y, player.facing.x);
            if (eff.isWide) {
                const sectorAngle = 1.2;
                enemies.forEach(enemy => {
                    const dx = enemy.x - player.x, dy = enemy.y - player.y;
                    const dist = Math.sqrt(dx*dx+dy*dy);
                    if (dist > range) return;
                    const ang = Math.atan2(dy, dx);
                    let diff = ang - angle;
                    while (diff > Math.PI) diff -= 2*Math.PI;
                    while (diff < -Math.PI) diff += 2*Math.PI;
                    if (Math.abs(diff) < sectorAngle) {
                        applyDamageToEnemy(enemy, damage, knockback, dx, dy, isCrit);
                    }
                });
            } else if (eff.isAoe) {
                enemies.forEach(enemy => {
                    const dx = enemy.x - player.x, dy = enemy.y - player.y;
                    const dist = Math.sqrt(dx*dx+dy*dy);
                    if (dist < range) {
                        applyDamageToEnemy(enemy, damage * 0.8, knockback, dx, dy, isCrit);
                    }
                });
                if (game.quality === 'premium') {
                    for (let i=0; i<20; i++) {
                        const a = Math.random()*Math.PI*2;
                        const r = range*Math.random();
                        liubaiEffects.push({ x: player.x+Math.cos(a)*r, y: player.y+Math.sin(a)*r, vx: 0, vy: 0, life: 20, maxLife: 20, size: 3, type: 'ink', color: `rgba(255,136,68,${0.3+Math.random()*0.3})` });
                    }
                }
            } else if (eff.isSpin) {
                const count = 8;
                for (let i=0; i<count; i++) {
                    const a = angle + (Math.PI*2/count)*i;
                    const tx = player.x + Math.cos(a)*range*0.7;
                    const ty = player.y + Math.sin(a)*range*0.7;
                    enemies.forEach(enemy => {
                        const dx = enemy.x - tx, dy = enemy.y - ty;
                        if (dx*dx+dy*dy < (enemy.radius+25)*(enemy.radius+25)) {
                            applyDamageToEnemy(enemy, damage*0.5, knockback, dx, dy, isCrit);
                        }
                    });
                    if (game.quality === 'premium') createSwordTrail(player.x, player.y, tx, ty, true);
                }
            } else if (eff.multiHit) {
                for (let h=0; h<eff.multiHit; h++) {
                    setTimeout(() => {
                        const offset = (h - (eff.multiHit-1)/2) * 20;
                        const a = angle + offset * 0.03;
                        const tx = player.x + Math.cos(a)*range;
                        const ty = player.y + Math.sin(a)*range;
                        enemies.forEach(enemy => {
                            const dx = enemy.x - tx, dy = enemy.y - ty;
                            if (dx*dx+dy*dy < (enemy.radius+30)*(enemy.radius+30)) {
                                applyDamageToEnemy(enemy, damage*0.4, knockback, dx, dy, isCrit);
                            }
                        });
                        if (game.quality === 'premium') createSwordTrail(player.x, player.y, tx, ty, true);
                    }, h*60);
                }
            } else {
                const tx = player.x + Math.cos(angle)*range;
                const ty = player.y + Math.sin(angle)*range;
                enemies.forEach(enemy => {
                    const dx = enemy.x - tx, dy = enemy.y - ty;
                    if (dx*dx+dy*dy < (enemy.radius+30)*(enemy.radius+30)) {
                        applyDamageToEnemy(enemy, damage, knockback, dx, dy, isCrit);
                    }
                });
                if (game.quality === 'premium') createSwordTrail(player.x, player.y, tx, ty, true);
            }
            createHitBurst(player.x + Math.cos(angle)*range*0.5, player.y + Math.sin(angle)*range*0.5, method.color, 12);
            // P1：八法攻击也触发墨花
            createInkBloom(player.x + Math.cos(angle)*range*0.5, player.y + Math.sin(angle)*range*0.5, method.color, 0.8);
            playSwingSound();
            if (isCrit) triggerHeavyShake();
            freezeFrame(2);
            player.ink = Math.max(0, player.ink - 15);
        }

        function applyDamageToEnemy(enemy, damage, knockback, dx, dy, isCrit) {
            if (enemy.hp <= 0) return;
            if (enemy.evasion && Math.random() < enemy.evasion) {
                addFloatingText(enemy.x, enemy.y, '闪避', 'rgba(200,200,200,0.8)', 14, 40);
                return;
            }
            enemy.hp -= damage;
            enemy.hitFlash = 12;
            const dist = Math.sqrt(dx*dx+dy*dy) || 1;
            const kb = knockback * (enemy.knockbackResist ? (1-enemy.knockbackResist) : 1);
            enemy.vx += (dx/dist) * kb;
            enemy.vy += (dy/dist) * kb;
            createBloodSplash(enemy.x, enemy.y, Math.atan2(dy, dx), isCrit ? 2 : 1.2);
            createHitBurst(enemy.x, enemy.y, isCrit ? 'rgba(255,50,50,0.9)' : 'rgba(255,200,100,0.8)', isCrit ? 12 : 6);
            // P1：墨花绽放
            createInkBloom(enemy.x, enemy.y, 'rgba(40,40,40,0.7)', isCrit ? 1.3 : 0.9);
            game.combo++;
            game.comboTimer = 120;
            const newRank = getRankForCombo(game.combo);
            if (newRank !== game.currentRank) {
                applyRankBonus(newRank);
                game.currentRank = newRank;
            }
            addFloatingText(enemy.x, enemy.y-20, Math.floor(damage), isCrit ? 'rgba(255,0,0,1)' : 'rgba(255,255,255,1)', isCrit ? 22 : 17, 60);
            playHitSound(isCrit, false);
            if (player.lifeSteal > 0) {
                const heal = damage * player.lifeSteal;
                const old = player.hp;
                player.hp = Math.min(player.maxHp, player.hp + heal);
                if (player.hp > old) showHealNumber(player.x, player.y-30, heal);
            }
            if (enemy.hp <= 0 && player.killHeal > 0) {
                const heal = player.killHeal;
                const old = player.hp;
                player.hp = Math.min(player.maxHp, player.hp + heal);
                if (player.hp > old) showHealNumber(player.x, player.y-30, heal);
            }
            player.ink = Math.min(player.maxInk, player.ink + 6 * player.inkEfficiency);
        }

        // ============ 攻击系统 ============
        function attack() {
            if (player.attackCooldown > 0 || player.isDodging || player.kuangcaoChanneling) return;
            if (player.eightMethods) {
                let dx = input.moveX, dy = input.moveY;
                if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) { dx = player.facing.x; dy = player.facing.y; }
                const method = getEightMethodFromDirection(dx, dy);
                performEightMethodAttack(method);
                player.eightMethodUsed = true;
                player.attackCooldown = Math.floor(8 / player.attackSpeed);
                return;
            }

            player.attacking = true;
            player.attackCooldown = Math.floor(10 / player.attackSpeed);
            player.attackAnim = 12;
            playSwingSound();

            let angle;
            if (!game.isTouch) {
                angle = Math.atan2(input.mouseWorldY - player.y, input.mouseWorldX - player.x);
            } else {
                const target = getNearestEnemy();
                if (target) { angle = Math.atan2(target.y - player.y, target.x - player.x); player.targetEnemy = target; }
                else if (Math.abs(input.moveX) > 0.1 || Math.abs(input.moveY) > 0.1) angle = Math.atan2(input.moveY, input.moveX);
                else angle = Math.atan2(player.facing.y, player.facing.x);
            }
            player.facing = { x: Math.cos(angle), y: Math.sin(angle) };

            const dashDist = 15;
            player.x += Math.cos(angle) * dashDist;
            player.y += Math.sin(angle) * dashDist;

            const reach = player.hairLength;
            const tipX = player.x + Math.cos(angle) * reach;
            const tipY = player.y + Math.sin(angle) * reach;

            if (game.quality === 'premium') createSwordTrail(player.x - Math.cos(angle) * 20, player.y - Math.sin(angle) * 20, tipX, tipY, player.isKuangcao);
            createHitBurst(player.x + Math.cos(angle) * reach * 0.5, player.y + Math.sin(angle) * reach * 0.5, 'rgba(255,255,255,0.8)', 5);

            let hitCount = 0, hasCrit = false;
            const rank = comboRanks[game.currentRank];
            const baseDamage = player.damage * (1 + rank.damageBonus);
            enemies.forEach(enemy => {
                const dx = enemy.x - tipX, dy = enemy.y - tipY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < enemy.radius + 30) {
                    if (enemy.evasion && Math.random() < enemy.evasion) { addFloatingText(enemy.x, enemy.y, '闪避', 'rgba(200,200,200,0.8)', 14, 40); return; }
                    hitCount++;
                    const isCrit = Math.random() < (player.critChance + rank.critBonus + (player.perfectDodgeCrit ? 0.5 : 0));
                    if (isCrit) hasCrit = true;
                    let damage = baseDamage * (isCrit ? 2.2 : 1) * (game.slowMotion < 1 ? 1.5 : 1);
                    if (player.comboBonus > 0 && game.combo > 5) damage *= (1 + player.comboBonus * Math.min(game.combo, 25) / 25);
                    enemy.hp -= damage;
                    enemy.hitFlash = 12;
                    let knockback = 10;
                    if (enemy.knockbackResist) knockback *= (1 - enemy.knockbackResist);
                    const knockbackAngle = Math.atan2(dy, dx);
                    enemy.vx += Math.cos(knockbackAngle) * knockback;
                    enemy.vy += Math.sin(knockbackAngle) * knockback;
                    createBloodSplash(enemy.x, enemy.y, knockbackAngle, isCrit ? 2 : 1.2);
                    createHitBurst(enemy.x, enemy.y, isCrit ? 'rgba(255,50,50,0.9)' : 'rgba(255,200,100,0.8)', isCrit ? 12 : 6);
                    // P1：墨花绽放
                    createInkBloom(enemy.x, enemy.y, 'rgba(40,40,40,0.7)', isCrit ? 1.5 : 1);

                    if (player.burstOnHit > 0) {
                        const burstRadius = 60;
                        enemies.forEach(e2 => {
                            if (e2 === enemy) return;
                            const dx2 = e2.x - enemy.x, dy2 = e2.y - enemy.y;
                            if (dx2*dx2 + dy2*dy2 < burstRadius * burstRadius) {
                                e2.hp -= damage * player.burstOnHit; e2.hitFlash = 6;
                                e2.vx += (dx2 / (Math.sqrt(dx2*dx2+dy2*dy2) || 1)) * 4;
                                e2.vy += (dy2 / (Math.sqrt(dx2*dx2+dy2*dy2) || 1)) * 4;
                            }
                        });
                        createHitBurst(enemy.x, enemy.y, 'rgba(255,100,0,0.7)', 10);
                    }
                    if (player.shockwaveRange > 0) {
                        createShockwave(enemy.x, enemy.y, player.shockwaveRange);
                        enemies.forEach(e2 => {
                            if (e2 === enemy) return;
                            const dx2 = e2.x - enemy.x, dy2 = e2.y - enemy.y;
                            const d2 = Math.sqrt(dx2*dx2 + dy2*dy2);
                            if (d2 < player.shockwaveRange && d2 > 0) { e2.hp -= damage * 0.3; e2.vx += (dx2 / d2) * 6; e2.vy += (dy2 / d2) * 6; e2.hitFlash = 5; }
                        });
                    }
                    if (player.poisonDamage > 0) enemy.poisoned = 120;
                    game.combo++;
                    game.comboTimer = 120;
                    const newRank = getRankForCombo(game.combo);
                    if (newRank !== game.currentRank) {
                        applyRankBonus(newRank);
                        game.currentRank = newRank;
                    }
                    addFloatingText(enemy.x, enemy.y - 20, Math.floor(damage), isCrit ? 'rgba(255,0,0,1)' : 'rgba(255,255,255,1)', isCrit ? 22 : 17, 60);
                    playHitSound(isCrit, false);

                    if (enemy.hp <= 0 && player.killHeal > 0) {
                        const healAmount = player.killHeal;
                        const oldHp = player.hp;
                        player.hp = Math.min(player.maxHp, player.hp + healAmount);
                        if (player.hp > oldHp) showHealNumber(player.x, player.y - 30);
                    }
                    if (player.lifeSteal > 0) {
                        const healAmount = damage * (player.lifeSteal + rank.lifestealBonus);
                        const oldHp = player.hp;
                        player.hp = Math.min(player.maxHp, player.hp + healAmount);
                        if (player.hp > oldHp) showHealNumber(player.x, player.y - 30);
                    }
                    player.ink = Math.min(player.maxInk, player.ink + 6 * player.inkEfficiency);
                    if (isCrit) { triggerHeavyShake(); freezeFrame(3); }
                    if (game.effects.inkSplash && particles.length < perf.maxParticles) {
                        for (let i = 0; i < 6; i++) particles.push({ x: enemy.x, y: enemy.y, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, life: 25, size: Math.random() * 4 + 2, color: `rgba(${20 + Math.random() * 40},${20 + Math.random() * 40},${20 + Math.random() * 40},0.9)`, isInk: true });
                    }
                }
            });

            if (player.doubleAttack && hitCount > 0) {
                setTimeout(() => {
                    const secondAngle = angle + (Math.random() - 0.5) * 0.5;
                    const secondTipX = player.x + Math.cos(secondAngle) * reach * 0.8;
                    const secondTipY = player.y + Math.sin(secondAngle) * reach * 0.8;
                    createHitBurst(secondTipX, secondTipY, 'rgba(255,150,50,0.6)', 4);
                    enemies.forEach(enemy => {
                        const dx = enemy.x - secondTipX, dy = enemy.y - secondTipY;
                        if (Math.sqrt(dx*dx + dy*dy) < enemy.radius + 25) {
                            const dmg = player.damage * 0.5;
                            enemy.hp -= dmg; enemy.hitFlash = 6;
                            enemy.vx += (dx / (Math.sqrt(dx*dx+dy*dy) || 1)) * 5;
                            enemy.vy += (dy / (Math.sqrt(dx*dx+dy*dy) || 1)) * 5;
                            addFloatingText(enemy.x, enemy.y, Math.floor(dmg), 'rgba(255,200,100,0.9)', 14, 40);
                            createBloodSplash(enemy.x, enemy.y, Math.atan2(dy, dx), 0.6);
                            createInkBloom(enemy.x, enemy.y, 'rgba(40,40,40,0.5)', 0.6);
                        }
                    });
                }, 100);
            }
            if (player.hairBranches > 1 && !player.isKuangcao) {
                for (let b = 1; b < player.hairBranches; b++) {
                    const branchAngle = angle + (b % 2 === 0 ? 0.35 : -0.35) * Math.ceil(b / 2);
                    const branchTipX = player.x + Math.cos(branchAngle) * reach * 0.85;
                    const branchTipY = player.y + Math.sin(branchAngle) * reach * 0.85;
                    if (game.quality === 'premium') createSwordTrail(player.x, player.y, branchTipX, branchTipY, player.isKuangcao);
                    enemies.forEach(enemy => {
                        const dx = enemy.x - branchTipX, dy = enemy.y - branchTipY;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < enemy.radius + 22) {
                            if (enemy.evasion && Math.random() < enemy.evasion) return;
                            const damage = player.damage * 0.7;
                            enemy.hp -= damage; enemy.hitFlash = 8;
                            let knockback = 6;
                            if (enemy.knockbackResist) knockback *= (1 - enemy.knockbackResist);
                            const knockbackAngle = Math.atan2(dy, dx);
                            enemy.vx += Math.cos(knockbackAngle) * knockback;
                            enemy.vy += Math.sin(knockbackAngle) * knockback;
                            createBloodSplash(enemy.x, enemy.y, knockbackAngle, 0.8);
                            createHitBurst(enemy.x, enemy.y, 'rgba(255,255,255,0.5)', 3);
                            createInkBloom(enemy.x, enemy.y, 'rgba(40,40,40,0.5)', 0.6);
                            if (player.lifeSteal > 0) {
                                const healAmount = damage * player.lifeSteal;
                                const oldHp = player.hp;
                                player.hp = Math.min(player.maxHp, player.hp + healAmount);
                                if (player.hp > oldHp) showHealNumber(player.x, player.y - 30);
                            }
                            addFloatingText(enemy.x, enemy.y, Math.floor(damage), 'rgba(255,255,255,0.8)', 15, 50);
                        }
                    });
                }
            }
            if (hitCount > 0) freezeFrame(2);
        }

        // ============ 环绕武器 ============
        function updateOrbitWeapons() {
            player.orbitWeapons.forEach((weapon, idx) => {
                weapon.angle += weapon.speed;
                weapon.x = player.x + Math.cos(weapon.angle) * weapon.orbitRadius;
                weapon.y = player.y + Math.sin(weapon.angle) * weapon.orbitRadius;
                enemies.forEach(enemy => {
                    const dx = enemy.x - weapon.x, dy = enemy.y - weapon.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < enemy.radius + weapon.size + 5 && weapon.cooldown <= 0) {
                        weapon.cooldown = weapon.maxCooldown;
                        const damage = player.damage * weapon.damageMult;
                        enemy.hp -= damage; enemy.hitFlash = 6;
                        enemy.vx += (dx / dist) * 3; enemy.vy += (dy / dist) * 3;
                        createHitBurst(weapon.x, weapon.y, 'rgba(255,215,0,0.7)', 3);
                        addFloatingText(enemy.x, enemy.y, Math.floor(damage), 'rgba(255,215,0,0.9)', 13, 45);
                        player.ink = Math.min(player.maxInk, player.ink + 2 * player.inkEfficiency);
                    }
                });
                if (weapon.cooldown > 0) weapon.cooldown--;
            });
        }
        function addOrbitWeapon() {
            const count = player.orbitWeapons.length;
            player.orbitWeapons.push({ angle: (Math.PI * 2 / 3) * count, x: 0, y: 0, orbitRadius: 50 + count * 15, speed: 0.08, size: 8, damageMult: 0.4, cooldown: 0, maxCooldown: 20, type: 'brush' });

        // ============ 分身系统 ============
        function updateClones() {
            player.clones.forEach(clone => {
                let nearest = null, minDist = Infinity;
                enemies.forEach(e => { const d = (e.x-clone.x)**2 + (e.y-clone.y)**2; if (d < minDist) { minDist = d; nearest = e; } });
                if (nearest && minDist < 40000) {
                    const angle = Math.atan2(nearest.y - clone.y, nearest.x - clone.x);
                    clone.x += Math.cos(angle) * 4; clone.y += Math.sin(angle) * 4;
                    clone.facing = { x: Math.cos(angle), y: Math.sin(angle) };
                    if (clone.attackCooldown <= 0) {
                        clone.attackCooldown = 25;
                        const tipX = clone.x + Math.cos(angle) * 60;
                        const tipY = clone.y + Math.sin(angle) * 60;
                        enemies.forEach(enemy => {
                            const dx = enemy.x - tipX, dy = enemy.y - tipY;
                            if (Math.sqrt(dx*dx + dy*dy) < enemy.radius + 20) {
                                const dmg = player.damage * 0.5;
                                enemy.hp -= dmg; enemy.hitFlash = 5;
                                createHitBurst(enemy.x, enemy.y, 'rgba(100,200,255,0.6)', 3);
                                addFloatingText(enemy.x, enemy.y, Math.floor(dmg), 'rgba(100,200,255,0.8)', 12, 40);
                            }
                        });
                        if (game.quality === 'premium') createSwordTrail(clone.x, clone.y, tipX, tipY, false);
                    }
                } else {
                    const dx = player.x - clone.x, dy = player.y - clone.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 80) { clone.x += (dx/dist) * 3; clone.y += (dy/dist) * 3; }
                }
                if (clone.attackCooldown > 0) clone.attackCooldown--;
                clone.life--;
            });

        // ============ 闪避与留白 ============
        function dodge() {
            if (player.dodgeCooldown > 0 || player.isDodging || player.kuangcaoChanneling) return;

            // P1：检测完美闪避（敌人攻击判定前）
            let perfectDodge = false;
            for (let enemy of enemies) {
                const dx = enemy.x - player.x, dy = enemy.y - player.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < enemy.radius + player.radius + 30 && enemy.attackCooldown > 35 && enemy.attackCooldown < 50) {
                    perfectDodge = true; break;
                }
            }

            player.isDodging = true; player.dodgeTime = 12; player.dodgeCooldown = 40;
            if (player.dodgeInvincible) { player.invincible = true; player.invincibleTime = 35; }

            let dx = input.moveX, dy = input.moveY;
            if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) { dx = -player.facing.x; dy = -player.facing.y; }
            const len = Math.sqrt(dx*dx + dy*dy);
            if (len > 0) { dx /= len; dy /= len; }
            player.vx = dx * 12; player.vy = dy * 12;

            for (let i = 0; i < 3; i++) liubaiEffects.push({ x: player.x - dx * i * 8, y: player.y - dy * i * 8, vx: 0, vy: 0, life: 15, maxLife: 15, size: 8, type: 'ghost', color: 'rgba(255,255,255,0.2)' });

            let nearEnemy = false;
            const checkCount = Math.min(enemies.length, 6);
            for (let i = 0; i < checkCount; i++) { const enemy = enemies[i]; const edx = enemy.x - player.x, edy = enemy.y - player.y; if (edx*edx + edy*edy < 10000) { nearEnemy = true; break; } }

            if (nearEnemy) {
                triggerLiubai();
                if (perfectDodge) {
                    triggerInkBleed();
                    addFloatingText(player.x, player.y - 60, '留白·惊鸿', 'rgba(255,215,0,1)', 26, 120);
                    player.perfectDodgeCrit = true;
                    player.perfectDodgeCritTime = 180;
                }
            }
        }
