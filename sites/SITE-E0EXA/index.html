<body class="bg1">
    <canvas id="particles" width="414" height="718"></canvas>
    <div class="volume-btn" id="volumeBtn">🔊</div>
    
    <div id="cover" class="cover">
        <h1>🩷 嫂嫂来了</h1>
        <p>隐秘地下恋 · 模拟器</p>
        <div class="warning">⚠️ 绝对不能被粉丝发现<br>暴露值越高越危险<br>🎯 彩蛋提示：全程选A有惊喜</div>
        <button class="start-btn" id="startBtn">开启秘密恋爱 →</button>
    </div>

    <div id="game" class="game-box hidden">
        <div class="exp-bar"><div class="exp-fill" id="expFill" style="width: 0%;"></div></div>
        <div class="exp-text"><span>🔻 暴露值</span><span id="expValue">0</span><span>%</span><span>💕 越界即危险</span></div>
        <div id="content"></div>
        <div class="footer">🌸 藏到最后 · 才是顶级嫂嫂</div>
    </div>

<script>
    // ========== 配置 ==========
    const MEMBERS = ["马嘉祺", "丁程鑫", "宋亚轩", "刘耀文", "张真源", "严浩翔", "贺峻霖"];
    const COLORS = { "马嘉祺":"#2c3e66", "丁程鑫":"#e8852a", "宋亚轩":"#5b8cbf", "刘耀文":"#8899aa", "张真源":"#4a7a6e", "严浩翔":"#b8860b", "贺峻霖":"#c9627e" };
    
    // 状态
    let step = 1, exposure = 0, boy = "", currentQ = 2, waitNext = false, currentStory = "", lastExp = 0, backtrackLeft = 3, randomMate = "";
    let soundOn = true;
    let audioCtx = null;
    
    // 🏆 彩蛋追踪：记录每道题是否选了A
    let selectedAHistory = [];  // 记录第2-8题是否选了A
    
    // 音效
    function initAudio() { if(!audioCtx) audioCtx = new (AudioContext||webkitAudioContext)(); }
    function playTone(type) {
        if(!audioCtx || !soundOn) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now+0.4);
        if(type==='select'){ osc.frequency.value=880; osc.start(now); osc.stop(now+0.15); }
        else if(type==='exposure'){ osc.frequency.value=660; osc.start(now); osc.stop(now+0.2); }
        else if(type==='next'){ osc.frequency.value=1046; osc.start(now); osc.stop(now+0.1); }
        else if(type==='ending'){ osc.frequency.value=1318; osc.start(now); osc.stop(now+0.25); }
        else if(type==='perfect'){ osc.frequency.value=1568; osc.start(now); osc.stop(now+0.3); }
    }
    
    // 更新暴露值
    function updateUI() {
        let p = Math.min(100, exposure);
        document.getElementById('expFill').style.width = p + '%';
        document.getElementById('expValue').innerText = p;
        if(p>=70) document.body.className = 'bg4';
        else if(p>=40) document.body.className = 'bg3';
        else if(p>=15) document.body.className = 'bg2';
        else document.body.className = 'bg1';
        if(p>=100) document.querySelector('.game-box')?.classList.add('redflash');
    }
    function addExp(v) { 
        exposure = Math.min(100, exposure + v); 
        updateUI(); 
        if(v>0) playTone('exposure');
        if(v>=30) document.querySelector('.game-box')?.classList.add('shake');
    }
    
    // 随机队友
    function getRandomMate() { return MEMBERS.filter(m=>m!==boy)[Math.floor(Math.random()*6)]; }
    
    // 检查是否触发彩蛋结局（全部选A）
    function isAllAEnding() {
        // 需要完成第2-8题，共7题，且全部选了A
        return selectedAHistory.length === 7 && selectedAHistory.every(v => v === true);
    }
    
    // ========== 完整剧情 ==========
    const QUESTIONS = {
        2: { title:"后台候场，队友全都在旁边聊天", desc:"他趁乱轻轻碰了一下你的指尖", qId:2,
            opts: {
                A: { txt:"A. 立刻抽开手，假装整理台本", story:"你指尖像被烫到般微微一缩，动作快得几乎没有痕迹。右手顺势拿起旁边的台本，低头翻了两页，眉头轻蹙假装在默读台词。{{boy}}甚至来不及感受你指尖的温度，你已经转身和刘耀文讨论起走位顺序。旁边的工作人员忙着核对流程单，没人注意到这个不到半秒的触碰。只有你知道，心跳已经快到嗓子眼，但脸上表情稳得像什么都没发生过。", exp:5, isA:true },
                B: { txt:"B. 轻轻回勾他的手指，飞快松开", story:"你的小指在{{boy}}掌心轻轻一勾，像蜻蜓点水。他整个人僵了零点几秒，耳尖肉眼可见地泛红，立刻偏过头假装在和严浩翔聊天，声音却有点发紧。你飞快收回手，目光飘向远处的舞台灯光，嘴角却控制不住微微上扬。周围嘈杂依旧，{{mate}}在旁边刷手机没抬头，但这个隐秘的电流已经足够让你们心跳加速一整晚。", exp:17, isA:false },
                C: { txt:"C. 抬头和他对视，眼神软下来", story:"你抬起头，恰好撞进{{boy}}温柔的眼神里。那一秒你忘了身处后台，忘了周围全是队友和工作人员，眼神不自觉地柔软下来，嘴角弯起一个只有他能读懂的弧度。他愣了一瞬，喉结微微滚动。下一秒，{{mate}}端着水杯从旁边经过，余光扫到你们对视的画面，脚步顿了一下，挑了挑眉，露出一副「我好像知道了什么」的表情，但很识趣地没吭声，默默走开了。", exp:38, isA:false },
                D: { txt:"D. 自然地拉住他的手，多握一会儿", story:"你的手指穿过{{boy}}的指缝，十指相扣，掌心相贴。他明显慌了，指尖微微发抖却舍不得松开。你们就这样偷偷握了两秒，像偷吃了糖的小孩。但偏偏这时，旁边负责催场的工作人员转身要给你递耳麦，目光直直落在你们交握的手上——顿了整整半秒。虽然她没说什么，但眼神里闪过一丝疑惑，低头快步走开了。更糟的是，斜对面有个举着相机的站姐正在拍后台花絮，镜头刚好扫过这个方向。", exp:74, isA:false }
            }},
        3: { title:"粉丝接机，他戴着你送的情侣手链", desc:"人多拥挤，他抬手整理口罩时手链露了出来", qId:3,
            opts: {
                A: { txt:"A. 完全装作路人，低头快步离开", story:"你低下头，把脸埋进围巾里，脚步不停地往出口方向走。余光里瞥见{{boy}}被人群簇拥着往前走，你们之间隔着至少十几个人。你没有回头，没有停顿，甚至故意绕了个弯从另一侧离开。手机震了一下，是他发的消息：「安全，你走了吗？」你走出机场大厅，深吸一口冷空气，回了个「嗯」。从头到尾，没有任何一个粉丝注意到你。危机解除，干净利落。", exp:9, isA:true },
                B: { txt:"B. 站在人群外围远远看着", story:"你站在人群最外圈，混在几个举着应援手幅的散粉中间，姿态自然。{{boy}}被人流推着往前走时，视线淡淡扫过外围，在你身上停了不到半秒就移开了——像看任何一个普通路人。你知道他看见你了，他也知道你在。但你们的眼神没有第二次交汇。你安静地站在原地，直到他被工作人员护送上保姆车，才转身离开。全程无破绽，就像一场默契的擦肩。", exp:22, isA:false },
                C: { txt:"C. 目光落在手链上，忍不住对他笑了一下", story:"你看见那根手链在灯光下闪了一下，心口一暖，嘴角不自觉地弯了起来。那种笑藏不住——不是对偶像的喜欢，是看向恋人的温柔。{{boy}}恰好偏头，捕捉到你那个笑容，眼神明显顿了半拍，脚步也跟着慢了零点几秒。旁边一个举着单反的私生饭立刻察觉不对，顺着他的视线看向你，快速按了好几下快门。她低头翻看照片，又抬头看看你，开始和旁边的人小声嘀咕：「那个女生是谁啊？他刚才是不是在看她？」", exp:44, isA:false },
                D: { txt:"D. 下意识往前挤，想提醒他遮住手链", story:"你急了，那根手链太显眼，万一被站姐拍到大图，粉丝分分钟能扒出是同款。你下意识拨开前面的人往前挤了两步，伸手想给{{boy}}打个手势。但你的动作太突兀了——周围好几个粉丝齐刷刷转头看你，有人皱眉，有人举起手机直接对着你拍。「这谁啊？怎么突然往前冲？」「她好像在跟他打手势？」窃窃私语声从四面八方涌过来。你僵在原地，感觉无数道目光像针一样扎在身上。他听见动静想回头，被工作人员一把推进了车里。", exp:86, isA:false }
            }},
        4: { title:"团综游戏环节，他输了被惩罚撒娇", desc:"他下意识朝你站的后台方向看过来", qId:4,
            opts: {
                A: { txt:"A. 立刻低头猛戳手机，避开视线", story:"{{boy}}目光扫过来的瞬间，你已经把头低了下去，刘海遮住半张脸，手指在手机屏幕上飞快地划，假装在回消息。余光里你感觉到他的视线在你头顶停留了一秒，然后收了回去。你听见主持人笑着说「哇好可爱」，观众席爆发出尖叫。你始终没有抬头，直到旁边的场务说「这一段录完了」，你才悄悄舒了一口气。完美避开，天衣无缝。", exp:6, isA:true },
                B: { txt:"B. 飞快对他眨一下眼，口型说加油", story:"你看懂了他的求救信号，在{{boy}}目光投来的那一刻，飞快地眨了一下右眼，嘴唇几乎没动地吐出两个字的口型：「加油。」距离很远，旁边的人根本看不清你在做什么。但他看见了。他耳朵瞬间红透，低下头闷笑了一声，然后大大方方地完成了撒娇惩罚，比平时放得开得多。主持人夸他今天状态好，只有你知道为什么。镜头扫过你时你已经恢复了面无表情，像什么都没发生过。", exp:28, isA:false },
                C: { txt:"C. 没忍住笑出声，目光一直黏在他身上", story:"{{boy}}撒娇的样子太可爱了，你完全控制不住自己。他每做一个动作你就笑，眼神黏在他身上移不开，像被磁铁吸住了一样。旁边的现场导演回头看了你一眼，皱了下眉。观众席前排有几个粉丝顺着他的视线方向往后看，注意到了你。你听见有人小声说：「那边那个女生是谁啊？她怎么一直在笑？」「她是不是认识他啊？」你猛然惊醒，但已经晚了——至少五六个人在看着你，表情写满了好奇和怀疑。", exp:49, isA:false },
                D: { txt:"D. 站起来对他比大大的加油手势", story:"你站起来，双手举过头顶比了一个大大的心，嘴巴张成O型无声地喊「加油」。动作大到旁边的场务都侧目了。更糟的是，摇臂摄像机刚好扫过观众席，你的身影被拍进了镜头里，投放在现场大屏上。观众席一阵骚动，不少人顺着大屏看向你本人，开始窃窃私语。有人举起手机拍你，有人问「她是粉丝还是工作人员？」「她怎么坐在后台区？」你坐下来的那一刻手心全是汗。", exp:71, isA:false }
            }},
        5: { title:"深夜录制结束，他说要偷偷送你回去", desc:"周围没有粉丝，但可能有蹲守代拍", qId:5,
            opts: {
                A: { txt:"A. 坚决拒绝，让他立刻上车", story:"你摇头，语气很轻但很坚定：「不行，你上车，我自己打车。」{{boy}}张了张嘴想说什么，你推了他一下：「快走，明天还有早班机。」他看了你一眼，眼神里有点委屈但还是乖乖上了保姆车。车门关上的瞬间他给你发了条消息：「到了跟我说。」你站在原地等车，看着他的车消失在夜色里，才招手拦了辆出租车。全程零同框，代拍就算蹲在巷口也拍不到任何东西。理智到极致，安全到极致。", exp:10, isA:true },

    // 粒子效果
    let canvas, ctx, particles = [];
    function initParticles() {
        canvas = document.getElementById('particles');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx = canvas.getContext('2d');
        for(let i=0;i<50;i++) particles.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-0.5)*0.5, vy:Math.random()*0.5+0.2, size:Math.random()*3+1, color:'#e8a0b0' });
        function animate() {
            if(!ctx) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for(let p of particles) {
                ctx.beginPath();
                ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                if(p.y > canvas.height) p.y = 0;
                if(p.x > canvas.width) p.x = 0;
                if(p.x < 0) p.x = canvas.width;
            }
            requestAnimationFrame(animate);
        }
        animate();
    }
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    initParticles();
