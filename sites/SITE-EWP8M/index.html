<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 勇者传说 - 游戏化编程教学</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2s infinite; }
        @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
        .game-container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(20,20,40,0.9); border: 2px solid #4a4a8a; border-radius: 12px;
            padding: 15px 25px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(74,74,138,0.3);
        }
        .player-info { display: flex; align-items: center; gap: 20px; }
        .avatar { width: 50px; height: 50px; background: #6b4ee6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 3px solid #9b7bff; }
        .player-name { font-size: 18px; font-weight: bold; color: #9b7bff; }
        .player-title { font-size: 12px; color: #888; }
        .stats { display: flex; gap: 25px; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 11px; color: #888; text-transform: uppercase; }
        .stat-value { font-size: 20px; font-weight: bold; color: #ffd700; }
        .xp-bar { width: 200px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .xp-fill { height: 100%; background: #ffd700; border-radius: 4px; transition: width 0.5s ease; }
        .game-area { display: grid; grid-template-columns: 280px 1fr; gap: 20px; margin-bottom: 20px; }
        .level-map { background: rgba(20,20,40,0.9); border: 2px solid #4a4a8a; border-radius: 12px; padding: 20px; max-height: 600px; overflow-y: auto; }
        .map-title { font-size: 16px; color: #9b7bff; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #4a4a8a; padding-bottom: 10px; }
        .chapter { margin-bottom: 15px; }
        .chapter-header { font-size: 13px; color: #ffd700; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .level-list { display: flex; flex-direction: column; gap: 5px; }
        .level-btn { padding: 10px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .level-btn.locked { background: #2a2a4a; color: #666; cursor: not-allowed; }
        .level-btn.available { background: #3a3a6a; color: #ccc; border: 1px solid #5a5a9a; }
        .level-btn.available:hover { background: #4a4a8a; transform: translateX(5px); }
        .level-btn.active { background: #6b4ee6; color: white; border: 2px solid #9b7bff; box-shadow: 0 0 15px rgba(107,78,230,0.4); }
        .level-btn.completed { background: #2a4a2a; color: #7fff7f; border: 1px solid #4a8a4a; }
        .level-icon { font-size: 16px; }
        .level-stars { margin-left: auto; color: #ffd700; font-size: 12px; }
        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .lesson-panel { background: rgba(20,20,40,0.9); border: 2px solid #4a4a8a; border-radius: 12px; padding: 25px; min-height: 300px; }
        .lesson-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #4a4a8a; }
        .lesson-title { font-size: 22px; color: #9b7bff; }
        .lesson-tag { background: #6b4ee6; color: white; padding: 4px 12px; border-radius: 15px; font-size: 12px; }
        .lesson-content { line-height: 1.8; color: #ccc; margin-bottom: 20px; }
        .lesson-content h3 { color: #ffd700; margin: 15px 0 10px; font-size: 16px; }
        .lesson-content p { margin-bottom: 10px; }
        .lesson-content ul { margin-left: 20px; margin-bottom: 15px; }
        .lesson-content li { margin-bottom: 8px; }
        .code-example { background: #1a1a2e; border: 1px solid #4a4a8a; border-radius: 8px; padding: 15px; margin: 15px 0; font-family: 'Consolas','Monaco',monospace; font-size: 14px; overflow-x: auto; position: relative; }
        .code-example .tag { color: #ff6b6b; }
        .code-example .attr { color: #ffd93d; }
        .code-example .value { color: #6bcb77; }
        .code-example .comment { color: #888; }
        .code-example .text { color: #e0e0e0; }
        .code-label { position: absolute; top: 5px; right: 10px; font-size: 10px; color: #666; background: #0f0f23; padding: 2px 8px; border-radius: 4px; }
        .challenge-panel { background: rgba(20,20,40,0.9); border: 2px solid #4a4a8a; border-radius: 12px; padding: 25px; }
        .challenge-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .challenge-icon { font-size: 28px; }
        .challenge-title { font-size: 20px; color: #ff6b6b; }
        .challenge-desc { color: #ccc; margin-bottom: 20px; line-height: 1.6; }
        .task-box { background: #1a1a2e; border-left: 4px solid #ff6b6b; padding: 15px 20px; margin-bottom: 20px; border-radius: 0 8px 8px 0; }
        .task-box h4 { color: #ff6b6b; margin-bottom: 8px; }
        .editor-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .editor-box { background: #0a0a1a; border: 2px solid #4a4a8a; border-radius: 8px; overflow: hidden; }
        .editor-header { background: #1a1a3a; padding: 8px 15px; font-size: 13px; color: #9b7bff; display: flex; align-items: center; gap: 8px; }
        .editor-textarea { width: 100%; min-height: 200px; background: #0a0a1a; color: #e0e0e0; border: none; padding: 15px; font-family: 'Consolas','Monaco',monospace; font-size: 14px; resize: vertical; outline: none; line-height: 1.6; }
        .preview-box { background: white; min-height: 200px; padding: 15px; overflow: auto; }
        .preview-box * { color: black; }
        .action-btns { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: all 0.3s; font-weight: bold; }
        .btn-run { background: #6b4ee6; color: white; }
        .btn-run:hover { background: #8b6eff; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(107,78,230,0.4); }
        .btn-submit { background: #ff6b6b; color: white; }
        .btn-submit:hover { background: #ff8e8e; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,107,107,0.4); }
        .btn-next { background: #6bcb77; color: #0f0f23; }
        .btn-next:hover { background: #8ee898; transform: translateY(-2px); }
        .btn-hint { background: #4a4a8a; color: #ccc; }
        .btn-hint:hover { background: #5a5aaa; }
        .result-panel { margin-top: 20px; padding: 20px; border-radius: 8px; display: none; }
        .result-panel.success { display: block; background: rgba(107,203,119,0.15); border: 2px solid #6bcb77; }
        .result-panel.fail { display: block; background: rgba(255,107,107,0.15); border: 2px solid #ff6b6b; }
        .result-title { font-size: 18px; margin-bottom: 10px; }
        .result-panel.success .result-title { color: #6bcb77; }
        .result-panel.fail .result-title { color: #ff6b6b; }
        .result-msg { color: #ccc; line-height: 1.6; }
        .reward-box { display: flex; gap: 20px; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(107,203,119,0.3); }
        .reward-item { display: flex; align-items: center; gap: 5px; color: #ffd700; }
        .hint-panel { background: rgba(255,217,61,0.1); border: 1px solid #ffd93d; border-radius: 8px; padding: 15px; margin-top: 15px; display: none; }
        .hint-panel.show { display: block; }
        .hint-title { color: #ffd93d; font-size: 14px; margin-bottom: 8px; }
        .hint-text { color: #ccc; font-size: 13px; line-height: 1.6; }
        .knowledge-card { background: rgba(107,78,230,0.1); border: 1px solid #6b4ee6; border-radius: 8px; padding: 15px; margin: 15px 0; }
        .knowledge-card h4 { color: #9b7bff; margin-bottom: 10px; font-size: 14px; }
        .knowledge-card table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .knowledge-card th, .knowledge-card td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #4a4a8a; }
        .knowledge-card th { color: #ffd700; font-weight: normal; }
        .knowledge-card td { color: #ccc; }
        .progress-section { background: rgba(20,20,40,0.9); border: 2px solid #4a4a8a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .progress-title { font-size: 14px; color: #9b7bff; margin-bottom: 10px; }
        .progress-bar { width: 100%; height: 20px; background: #1a1a3a; border-radius: 10px; overflow: hidden; border: 1px solid #4a4a8a; }
        .progress-fill { height: 100%; background: #6b4ee6; border-radius: 10px; transition: width 0.5s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; font-size: 11px; color: white; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal { background: #1a1a3a; border: 2px solid #6b4ee6; border-radius: 16px; padding: 40px; max-width: 500px; width: 90%; text-align: center; transform: scale(0.8); transition: transform 0.3s; }
        .modal-overlay.show .modal { transform: scale(1); }
        .modal-icon { font-size: 60px; margin-bottom: 20px; }
        .modal-title { font-size: 24px; color: #ffd700; margin-bottom: 15px; }
        .modal-text { color: #ccc; line-height: 1.6; margin-bottom: 25px; }
        .modal-rewards { display: flex; justify-content: center; gap: 30px; margin-bottom: 25px; }
        .modal-reward { text-align: center; }
        .modal-reward-icon { font-size: 30px; }
        .modal-reward-value { color: #ffd700; font-weight: bold; }
        .welcome-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f23; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .welcome-screen.hidden { opacity: 0; pointer-events: none; }
        .welcome-title { font-size: 48px; color: #9b7bff; margin-bottom: 20px; text-shadow: 0 0 30px rgba(155,123,255,0.5); }
        .welcome-subtitle { font-size: 20px; color: #ccc; margin-bottom: 40px; }
        .welcome-btn { padding: 15px 50px; font-size: 18px; background: #6b4ee6; color: white; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s; }
        .welcome-btn:hover { background: #8b6eff; transform: scale(1.05); box-shadow: 0 0 30px rgba(107,78,230,0.5); }
        .welcome-features { display: flex; gap: 40px; margin-top: 50px; }
        .welcome-feature { text-align: center; }
        .welcome-feature-icon { font-size: 40px; margin-bottom: 10px; }
        .welcome-feature-text { color: #888; font-size: 14px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f23; }
        ::-webkit-scrollbar-thumb { background: #4a4a8a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b4ee6; }
        @media (max-width: 900px) {
            .game-area { grid-template-columns: 1fr; }
            .level-map { max-height: 300px; }
            .editor-container { grid-template-columns: 1fr; }
            .welcome-title { font-size: 32px; }
            .welcome-features { flex-direction: column; gap: 20px; }
            .stats { flex-wrap: wrap; gap: 10px; }
            .xp-bar { width: 120px; }
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-title">HTML 勇者传说</div>
        <div class="welcome-subtitle">通过游戏冒险，成为 HTML 大师</div>
        <button class="welcome-btn" onclick="startGame()">开始冒险</button>
        <div class="welcome-features">
            <div class="welcome-feature">
                <div class="welcome-feature-icon">📚</div>
                <div class="welcome-feature-text">30+ 关卡</div>
            </div>
            <div class="welcome-feature">
                <div class="welcome-feature-icon">⚔️</div>
                <div class="welcome-feature-text">实战挑战</div>
            </div>
            <div class="welcome-feature">
                <div class="welcome-feature-icon">🏆</div>
                <div class="welcome-feature-text">成就系统</div>
            </div>
        </div>
    </div>
    <div class="stars" id="stars"></div>
    <div class="game-container" id="gameContainer" style="display:none;">
        <div class="status-bar">
            <div class="player-info">
                <div class="avatar">🧙‍♂️</div>
                <div>
                    <div class="player-name" id="playerName">HTML学徒</div>
                    <div class="player-title">Lv.<span id="playerLevel">1</span></div>
                </div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">经验值</div>
                    <div class="stat-value" id="xpValue">0</div>
                    <div class="xp-bar"><div class="xp-fill" id="xpBar" style="width:0%"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">金币</div>
                    <div class="stat-value">💰 <span id="goldValue">0</span></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">完成度</div>
                    <div class="stat-value"><span id="progressValue">0</span>%</div>
                </div>
            </div>
        </div>
        <div class="progress-section">
            <div class="progress-title">📊 学习进度</div>

        </div>

            <div class="level-map">
                <div class="map-title">🗺️ 冒险地图</div>
                <div id="chapterList"></div>
            </div>
            <div class="content-area">
                <div class="lesson-panel" id="lessonPanel">
                    <div class="lesson-header">
                        <div class="lesson-title" id="lessonTitle">欢迎来到 HTML 世界</div>
                        <div class="lesson-tag" id="lessonTag">基础</div>
                    </div>
                    <div class="lesson-content" id="lessonContent"></div>
                </div>
                <div class="challenge-panel" id="challengePanel">
                    <div class="challenge-header">
                        <div class="challenge-icon">⚔️</div>
                        <div class="challenge-title" id="challengeTitle">实战挑战</div>
                    </div>
                    <div class="challenge-desc" id="challengeDesc">完成下方的代码挑战来证明你的实力！</div>
                    <div class="task-box" id="taskBox">
                        <h4>🎯 任务目标</h4>

                    </div>

                        <div class="editor-box">
                            <div class="editor-header"><span>📝</span> 代码编辑器</div>
                            <textarea class="editor-textarea" id="codeEditor" placeholder="在此输入你的 HTML 代码..."></textarea>
                        </div>
                        <div class="editor-box">
                            <div class="editor-header"><span>👁️</span> 实时预览</div>
                            <div class="preview-box" id="previewBox"><p style="color:#999;text-align:center;margin-top:80px;">预览区域</p></div>
                        </div>
                    </div>

    <div class="modal-overlay" id="levelModal">
        <div class="modal">

            <div class="modal-text" id="modalText">你成功完成了这个挑战！</div>
            <div class="modal-rewards" id="modalRewards"></div>
            <button class="btn btn-next" onclick="closeModal()">继续冒险</button>
        </div>

    <script>
        // ==================== 游戏数据 ====================
        const gameData = {
            player: { name: 'HTML学徒', level: 1, xp: 0, maxXp: 100, gold: 0, completedLevels: [], currentLevel: 0 },
            chapters: [
                {
                    title: '第一章：HTML 基础',
                    icon: '🌱',
                    levels: [
                        {
                            id: 0, title: 'HTML 初识', tag: '入门',
                            content: `<h3>🌍 什么是 HTML？</h3><p>HTML（HyperText Markup Language，超文本标记语言）是构建网页的标准语言。它使用"标签"来描述网页的结构和内容。</p><h3>📐 HTML 基本结构</h3><p>每个 HTML 文档都有以下基本结构：</p><div class="code-example"><span class="code-label">HTML</span><span class="tag">&lt;!DOCTYPE html&gt;</span><br><span class="tag">&lt;html&gt;</span><br>  <span class="tag">&lt;head&gt;</span><br>    <span class="tag">&lt;title&gt;</span><span class="text">页面标题</span><span class="tag">&lt;/title&gt;</span><br>  <span class="tag">&lt;/head&gt;</span><br>  <span class="tag">&lt;body&gt;</span><br>    <span class="tag">&lt;h1&gt;</span><span class="text">这是一个标题</span><span class="tag">&lt;/h1&gt;</span><br>    <span class="tag">&lt;p&gt;</span><span class="text">这是一个段落。</span><span class="tag">&lt;/p&gt;</span><br>  <span class="tag">&lt;/body&gt;</span><br><span class="tag">&lt;/html&gt;</span></div><h3>🔑 关键概念</h3><ul><li><strong>&lt;!DOCTYPE html&gt;</strong> - 声明文档类型为 HTML5</li><li><strong>&lt;html&gt;</strong> - HTML 文档的根元素</li><li><strong>&lt;head&gt;</strong> - 包含元数据（标题、样式等）</li><li><strong>&lt;body&gt;</strong> - 包含可见的页面内容</li><li><strong>标签</strong> - 用尖括号包围，如 &lt;tag&gt;</li><li><strong>闭合标签</strong> - 用 / 表示结束，如 &lt;/tag&gt;</li></ul>`,
                            challenge: { title: '创建你的第一个网页', desc: '让我们从最简单的网页开始！', task: '创建一个包含 "Hello World" 标题的 HTML 页面。使用 &lt;h1&gt; 标签。', hint: '使用 &lt;h1&gt;Hello World&lt;/h1&gt; 来创建一个大标题。', check: (code) => { const hasH1 = code.includes('<h1>') && code.includes('</h1>'); const hasHello = code.toLowerCase().includes('hello'); return hasH1 && hasHello; }, successMsg: '太棒了！你成功创建了第一个 HTML 页面！', failMsg: '检查一下：你是否使用了 &lt;h1&gt; 标签？是否包含了 "Hello" 文本？', xp: 50, gold: 10 }
                        },
                        {
                            id: 1, title: '段落与文本', tag: '基础',
                            content: `<h3>📝 段落标签 &lt;p&gt;</h3><p>&lt;p&gt; 标签用于定义段落。浏览器会自动在段落前后添加空白。</p><h3>✨ 文本格式化标签</h3><div class="knowledge-card"><h4>📋 常用文本标签</h4><table><tr><th>标签</th><th>作用</th><th>示例</th></tr><tr><td>&lt;b&gt;</td><td>粗体</td><td><b>粗体文本</b></td></tr><tr><td>&lt;i&gt;</td><td>斜体</td><td><i>斜体文本</i></td></tr><tr><td>&lt;u&gt;</td><td>下划线</td><td><u>下划线文本</u></td></tr><tr><td>&lt;strong&gt;</td><td>重要文本（语义粗体）</td><td><strong>重要</strong></td></tr><tr><td>&lt;em&gt;</td><td>强调文本（语义斜体）</td><td><em>强调</em></td></tr><tr><td>&lt;br&gt;</td><td>换行（单标签）</td><td>行1<br>行2</td></tr><tr><td>&lt;hr&gt;</td><td>水平分割线</td><td><hr style="border-color:#4a4a8a;"></td></tr></table></div><h3>💡 重要区别</h3><p>&lt;b&gt; 和 &lt;strong&gt; 看起来一样，但 &lt;strong&gt; 有语义含义，表示重要内容。&lt;i&gt; 和 &lt;em&gt; 同理。</p>`,
                            challenge: { title: '格式化你的文本', desc: '练习使用不同的文本格式化标签！', task: '创建一个包含以下内容的段落：1) 粗体文本 2) 斜体文本 3) 一条水平分割线', hint: '使用 &lt;b&gt;粗体&lt;/b&gt;、&lt;i&gt;斜体&lt;/i&gt; 和 &lt;hr&gt; 标签。', check: (code) => { const hasB = (code.includes('<b>') || code.includes('<strong>')); const hasI = (code.includes('<i>') || code.includes('<em>')); const hasHR = code.includes('<hr'); return hasB && hasI && hasHR; }, successMsg: '完美！你已经掌握了文本格式化！', failMsg: '确保你使用了粗体、斜体标签和水平分割线。', xp: 60, gold: 15 }
                        },
                        {

        // ==================== 游戏逻辑 ====================
        let playerData = { ...gameData.player };
        let currentLevelData = null;

        // 生成星空背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 开始游戏
        function startGame() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('gameContainer').style.display = 'block';
            setTimeout(() => {
                document.getElementById('welcomeScreen').style.display = 'none';
            }, 500);
            loadGame();
        }

        // 从本地存储加载游戏
        function loadGame() {
            const saved = localStorage.getItem('htmlGameData');
            if (saved) {
                playerData = JSON.parse(saved);
            }
            updateUI();
            renderMap();
            loadLevel(playerData.currentLevel);
        }

        // 保存游戏
        function saveGame() {
            localStorage.setItem('htmlGameData', JSON.stringify(playerData));
        }

        // 更新 UI
        function updateUI() {
            document.getElementById('playerName').textContent = getTitle(playerData.level);
            document.getElementById('playerLevel').textContent = playerData.level;
            document.getElementById('xpValue').textContent = playerData.xp;
            document.getElementById('goldValue').textContent = playerData.gold;
            
            const totalLevels = gameData.chapters.reduce((sum, c) => sum + c.levels.length, 0);
            const progress = Math.round((playerData.completedLevels.length / totalLevels) * 100);
            document.getElementById('progressValue').textContent = progress;
            document.getElementById('mainProgress').style.width = progress + '%';
            document.getElementById('mainProgress').textContent = progress + '%';
            
            const xpPercent = Math.min((playerData.xp / playerData.maxXp) * 100, 100);
            document.getElementById('xpBar').style.width = xpPercent + '%';
        }

        // 获取称号
        function getTitle(level) {
            const titles = {
                1: 'HTML学徒', 2: 'HTML新手', 3: 'HTML探索者', 4: 'HTML学者',
                5: 'HTML法师', 6: 'HTML大师', 7: 'HTML宗师', 8: 'HTML传奇'
            };
            return titles[level] || 'HTML传说';
        }

        // 渲染地图
        function renderMap() {
            const container = document.getElementById('chapterList');
            container.innerHTML = '';
            
            gameData.chapters.forEach((chapter, ci) => {
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'chapter';
                
                const header = document.createElement('div');
                header.className = 'chapter-header';
                header.textContent = `${chapter.icon} ${chapter.title}`;
                chapterDiv.appendChild(header);
                
                const levelList = document.createElement('div');
                levelList.className = 'level-list';
                
                chapter.levels.forEach((level, li) => {
                    const btn = document.createElement('button');
                    btn.className = 'level-btn';
                    
                    // 判断关卡状态
                    const allPrevLevels = gameData.chapters.slice(0, ci).reduce((sum, c) => sum + c.levels.length, 0) + li;
                    const isCompleted = playerData.completedLevels.includes(level.id);
                    const isAvailable = allPrevLevels === 0 || playerData.completedLevels.includes(allPrevLevels - 1) || isCompleted;
                    const isActive = playerData.currentLevel === level.id;
                    
                    if (isActive) btn.classList.add('active');
                    else if (isCompleted) btn.classList.add('completed');
                    else if (isAvailable) btn.classList.add('available');
                    else btn.classList.add('locked');
                    
                    const icon = isCompleted ? '✅' : isAvailable ? '📖' : '🔒';
                    const stars = isCompleted ? '⭐⭐⭐' : '';
                    
                    btn.innerHTML = `<span class="level-icon">${icon}</span> ${level.title} <span class="level-stars">${stars}</span>`;
                    
                    if (isAvailable || isCompleted) {
                        btn.onclick = () => loadLevel(level.id);
                    }
                    
                    levelList.appendChild(btn);
                });
                
                chapterDiv.appendChild(levelList);
                container.appendChild(chapterDiv);
            });
        }

        // 加载关卡
        function loadLevel(levelId) {
            playerData.currentLevel = levelId;
            saveGame();
            
            // 找到关卡数据
            let level = null;
            for (const chapter of gameData.chapters) {
                level = chapter.levels.find(l => l.id === levelId);
                if (level) break;
            }
            
            if (!level) return;
            currentLevelData = level;
            
            // 更新教学内容
            document.getElementById('lessonTitle').textContent = level.title;
            document.getElementById('lessonTag').textContent = level.tag;
            document.getElementById('lessonContent').innerHTML = level.content;
            
            // 更新挑战
            document.getElementById('challengeTitle').textContent = level.challenge.title;
            document.getElementById('challengeDesc').textContent = level.challenge.desc;
            document.getElementById('taskContent').innerHTML = level.challenge.task;
            document.getElementById('hintText').textContent = level.challenge.hint;
            
            // 清空编辑器
            document.getElementById('codeEditor').value = '';
            document.getElementById('previewBox').innerHTML = '<p style="color:#999;text-align:center;margin-top:80px;">预览区域</p>';
            
            // 隐藏结果和提示
            document.getElementById('resultPanel').className = 'result-panel';
            document.getElementById('hintPanel').classList.remove('show');
            document.getElementById('nextBtn').style.display = 'none';
            
            // 如果已完成，显示答案
            if (playerData.completedLevels.includes(levelId)) {
                document.getElementById('codeEditor').value = getExampleCode(levelId);
                runCode();
            }
            
            updateUI();
            renderMap();
        }

        // 获取示例代码
        function getExampleCode(levelId) {
            const examples = {
                0: '<h1>Hello World</h1>',
                1: '<p>这是一段<b>粗体</b>和<i>斜体</i>文本。</p>\n<hr>',

                16: '<div>\n  <h2>标题</h2>\n  <p>这是一段<span>重要</span>文字。</p>\n</div>',
                17: '<header>\n  <h1>张三 - 个人简历</h1>\n</header>\n<main>\n  <img src="https://via.placeholder.com/150" alt="头像">\n  <p>我是一名前端开发工程师。</p>\n  <h2>技能</h2>\n  <ul>\n    <li>HTML/CSS</li>\n    <li>JavaScript</li>\n  </ul>\n  <h2>教育经历</h2>\n  <table border="1">\n    <tr><th>学校</th><th>年份</th></tr>\n    <tr><td>某某大学</td><td>2020-2024</td></tr>\n  </table>\n  <h2>联系我</h2>\n  <form>\n    <input type="email" placeholder="你的邮箱">\n    <textarea rows="3" placeholder="留言"></textarea>\n    <button type="submit">发送</button>\n  </form>\n</main>\n<footer>联系方式：email@example.com</footer>'
            };
            return examples[levelId] || '';
        }

        // 运行代码
        function runCode() {
            const code = document.getElementById('codeEditor').value;
            const preview = document.getElementById('previewBox');
            
            // 安全地渲染 HTML
            preview.innerHTML = code;
        }

        // 切换提示
        function toggleHint() {
            document.getElementById('hintPanel').classList.toggle('show');
        }

        // 提交挑战
        function submitChallenge() {
            if (!currentLevelData) return;
            
            const code = document.getElementById('codeEditor').value;
            const resultPanel = document.getElementById('resultPanel');
            const resultTitle = document.getElementById('resultTitle');
            const resultMsg = document.getElementById('resultMsg');
            const rewardBox = document.getElementById('rewardBox');
            const nextBtn = document.getElementById('nextBtn');
            
            // 使用 eval 执行检查函数（这里使用字符串方式存储检查逻辑）
            const checkResult = checkLevel(currentLevelData.id, code);
            
            if (checkResult) {
                // 成功
                resultPanel.className = 'result-panel success';
                resultTitle.textContent = '🎉 挑战成功！';
                resultMsg.textContent = currentLevelData.challenge.successMsg;
                
                rewardBox.innerHTML = `
                    <div class="reward-item">⭐ 经验 +${currentLevelData.challenge.xp}</div>
                    <div class="reward-item">💰 金币 +${currentLevelData.challenge.gold}</div>
                `;
                
                // 更新玩家数据
                if (!playerData.completedLevels.includes(currentLevelData.id)) {
                    playerData.completedLevels.push(currentLevelData.id);
                    playerData.xp += currentLevelData.challenge.xp;
                    playerData.gold += currentLevelData.challenge.gold;
                    
                    // 升级检查
                    while (playerData.xp >= playerData.maxXp) {
                        playerData.xp -= playerData.maxXp;
                        playerData.level++;
                        playerData.maxXp = Math.floor(playerData.maxXp * 1.5);
                    }
                    
                    saveGame();
                    updateUI();
                    renderMap();
                }
                
                nextBtn.style.display = 'inline-block';
                
                // 显示模态框
                setTimeout(() => {
                    showModal(currentLevelData);
                }, 500);
            } else {
                // 失败
                resultPanel.className = 'result-panel fail';
                resultTitle.textContent = '❌ 挑战失败';
                resultMsg.textContent = currentLevelData.challenge.failMsg;
                rewardBox.innerHTML = '';
                nextBtn.style.display = 'none';
            }
        }

        // 关卡检查函数
        function checkLevel(levelId, code) {
            const checks = {
                0: () => code.includes('<h1>') && code.includes('</h1>') && code.toLowerCase().includes('hello'),
                1: () => (code.includes('<b>') || code.includes('<strong>')) && (code.includes('<i>') || code.includes('<em>')) && code.includes('<hr'),
                2: () => code.includes('<h1>') && code.includes('</h1>') && code.includes('<h2>') && code.includes('</h2>') && code.includes('<h3>') && code.includes('</h3>'),
                3: () => code.includes('<a') && code.includes('</a>') && code.includes('href') && code.includes('target') && code.includes('_blank'),
                4: () => code.includes('<img') && code.includes('src') && code.includes('alt') && code.includes('width'),
                5: () => code.includes('<a') && code.includes('</a>') && code.includes('<img') && code.includes('href') && code.includes('src'),
                6: () => code.includes('<ul>') && code.includes('</ul>') && (code.match(/<li>/g) || []).length >= 3,
                7: () => code.includes('<ol') && code.includes('</ol>') && code.includes('type') && (code.match(/<li>/g) || []).length >= 3,
                8: () => (code.match(/<ul>/g) || []).length >= 2 && (code.match(/<li>/g) || []).length >= 4,
                9: () => code.includes('<table>') && code.includes('</table>') && (code.match(/<tr>/g) || []).length >= 2 && code.includes('<th>') && code.includes('<td>'),
                10: () => code.includes('<table') && code.includes('border') && code.includes('width') && code.includes('<tr>') && code.includes('<td>'),
                11: () => code.includes('colspan') && code.includes('<table>') && code.includes('<tr>') && code.includes('<td>'),
                12: () => code.includes('<form') && code.includes('</form>') && code.includes('type="text"') && code.includes('type="submit"') && code.includes('name'),
                13: () => code.includes('type="email"') && code.includes('type="password"') && code.includes('type="checkbox"') && code.includes('<form'),
                14: () => code.includes('<select') && code.includes('</select>') && code.includes('<option') && code.includes('<textarea') && code.includes('<button'),
                15: () => code.includes('<header') && code.includes('</header>') && code.includes('<nav') && code.includes('</nav>') && code.includes('<main') && code.includes('</main>') && code.includes('<section') && code.includes('</section>') && code.includes('<footer') && code.includes('</footer>'),
                16: () => code.includes('<div') && code.includes('</div>') && code.includes('<span') && code.includes('</span>') && code.includes('<h2') && code.includes('<p'),
                17: () => code.includes('<h1') && code.includes('</h1>') && code.includes('<img') && code.includes('<ul') && code.includes('</ul>') && code.includes('<table') && code.includes('</table>') && code.includes('<form') && code.includes('</form>') && (code.includes('<header') || code.includes('<main') || code.includes('<footer') || code.includes('<section') || code.includes('<article'))
            };
            return checks[levelId] ? checks[levelId]() : false;
        }

        // 下一关
        function nextLevel() {
            const allLevels = gameData.chapters.flatMap(c => c.levels);
            const currentIndex = allLevels.findIndex(l => l.id === playerData.currentLevel);
            if (currentIndex < allLevels.length - 1) {
                loadLevel(allLevels[currentIndex + 1].id);
            }
        }

        // 显示模态框
        function showModal(level) {
            const modal = document.getElementById('levelModal');
            document.getElementById('modalIcon').textContent = '🎉';
            document.getElementById('modalTitle').textContent = `${level.title} - 完成！`;
            document.getElementById('modalText').textContent = level.challenge.successMsg;
            document.getElementById('modalRewards').innerHTML = `
                <div class="modal-reward"><div class="modal-reward-icon">⭐</div><div class="modal-reward-value">+${level.challenge.xp} XP</div></div>
                <div class="modal-reward"><div class="modal-reward-icon">💰</div><div class="modal-reward-value">+${level.challenge.gold} 金币</div></div>
            `;
            modal.classList.add('show');
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('levelModal').classList.remove('show');
        }

        // 初始化
        createStars();
    </script>
</body>
