<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 交互地球仪</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        canvas {
            display: block;
        }
        
        /* 标题覆盖层 */
        .overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        
        .overlay h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }
        
        .overlay p {
            font-size: 0.9rem;
            opacity: 0.8;
            letter-spacing: 1px;
        }
        
        /* 控制提示 */
        .controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            z-index: 10;
            pointer-events: none;
            display: flex;
            gap: 20px;
        }
        
        .hint-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .hint-icon {
            width: 24px;
            height: 24px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        
        /* 加载动画 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            z-index: 20;
            transition: opacity 0.5s;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* 坐标显示 */
        .coords {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="loading" id="loading">正在加载地球纹理...</div>
        
        <div class="overlay">
            <h1>🌍 3D 交互地球仪</h1>
            <p>Interactive 3D Globe</p>
        </div>
        
        <div class="controls-hint">
            <div class="hint-item">
                <div class="hint-icon">🖱️</div>
                <span>左键拖拽旋转</span>
            </div>
            <div class="hint-item">
                <div class="hint-icon">🔍</div>
                <span>滚轮缩放</span>
            </div>
            <div class="hint-item">
                <div class="hint-icon">✋</div>
                <span>右键平移</span>
            </div>
        </div>
        
        <div class="coords" id="coords">Lat: 0° | Lon: 0°</div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 3.5;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // 控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.5;
        controls.maxDistance = 10;
        controls.enablePan = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        
        // 纹理加载器
        const textureLoader = new THREE.TextureLoader();
        const loadingManager = new THREE.LoadingManager();
        
        loadingManager.onLoad = () => {
            document.getElementById('loading').classList.add('hidden');
        };
        
        const managedTextureLoader = new THREE.TextureLoader(loadingManager);
        
        // 地球组
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);
        
        // 地球几何体
        const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
        
        // 地球材质
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: managedTextureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
            bumpMap: managedTextureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
            bumpScale: 0.05,
            specularMap: managedTextureLoader.load('https://unpkg.com/three-globe/example/img/earth-water.png'),
            specular: new THREE.Color(0x333333),
            shininess: 5
        });
        
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earthGroup.add(earth);
        
        // 云层
        const cloudGeometry = new THREE.SphereGeometry(1.02, 64, 64);
        const cloudMaterial = new THREE.MeshPhongMaterial({
            map: managedTextureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png'),
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        
        const clouds = new THREE.Mesh(cloudGeometry, cloudMaterial);
        earthGroup.add(clouds);
        
        // 大气光晕（使用着色器）
        const atmosphereGeometry = new THREE.SphereGeometry(1.2, 64, 64);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 4.0);
                    gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);
        
        // 星空背景
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 3000;
        const posArray = new Float32Array(starsCount * 3);
        
        for(let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const starsMaterial = new THREE.PointsMaterial({
            size: 0.02,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true
        });
        
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);
        
        // 光照
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);
        
        const backLight = new THREE.DirectionalLight(0x001133, 0.5);
        backLight.position.set(-5, -3, -5);
        scene.add(backLight);
        
        // 鼠标交互 - 显示坐标
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const coordsDiv = document.getElementById('coords');
        
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(earth);
            
            if (intersects.length > 0) {
                const point = intersects[0].point;
                const lat = Math.asin(point.y) * (180 / Math.PI);
                const lon = Math.atan2(point.z, point.x) * (180 / Math.PI);
                coordsDiv.textContent = `Lat: ${lat.toFixed(2)}° | Lon: ${lon.toFixed(2)}°`;
            }
        }
        
        window.addEventListener('mousemove', onMouseMove);
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 云层缓慢旋转
            clouds.rotation.y += 0.0002;
            
            // 星空缓慢旋转
            stars.rotation.y += 0.0001;
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
        
        // 点击暂停/恢复自动旋转
        renderer.domElement.addEventListener('click', () => {
            controls.autoRotate = !controls.autoRotate;
        });
    </script>
</body>
</html>
