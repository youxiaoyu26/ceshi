<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>专属你的浪漫表白 · 语音·天气·画板</title>
  <style>
    :root {
      --primary-color: #ff4d79;
      --glass-bg: rgba(255, 255, 255, 0.2);
      --glass-border: rgba(255, 255, 255, 0.3);
      --radius: 15px;
      --text-color: white;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      overflow-x: hidden;
      background: linear-gradient(135deg, #feb47b 0%, #ff7e5f 100%);
      transition: background 0.5s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 背景粒子容器 */
    #particles-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      animation: floatUp linear infinite;
      opacity: 0.8;
      pointer-events: none;
      font-size: 24px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .weather-particle {
      position: absolute;
      animation: weatherFloat linear infinite;
    }

    @keyframes weatherFloat {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-100vh) rotate(20deg); opacity: 0; }
    }

    /* 主容器 */
    .container {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      z-index: 1;
      padding: 1rem;
      backdrop-filter: blur(5px);
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 2rem 1.5rem;
      border-radius: var(--radius);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 100%;
      text-align: center;
      color: var(--text-color);
      animation: fadeInUp 0.8s ease;
      transition: all 0.3s;
    }

    section {
      display: none;
      width: 100%;
    }
    section.active {
      display: block;
    }

    h2 {
      margin-bottom: 1.2rem;
      font-weight: 300;
      letter-spacing: 2px;
      font-size: 1.7rem;
    }

    label {
      display: block;
      margin: 0.8rem 0 0.3rem;
      font-size: 0.9rem;
      opacity: 0.9;
      text-align: left;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 1rem;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.85);
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
      color: #333;
    }
    input:focus, select:focus, textarea:focus {
      background: white;
      box-shadow: 0 0 0 3px rgba(255, 77, 121, 0.3);
    }
    textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      background: var(--primary-color);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(255, 77, 121, 0.4);
      letter-spacing: 1px;
    }
    button:active {
      transform: scale(0.96);
    }
    button.prev {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: none;
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: none;
    }

    /* 画板区域 */
    #drawCanvas {
      border: 2px dashed rgba(255,255,255,0.6);
      border-radius: 12px;
      margin: 0.8rem 0;
      background: rgba(255,255,255,0.2);
      touch-action: none;
    }

    .preview-box {
      background: rgba(0,0,0,0.15);
      border-radius: 12px;
      padding: 12px;
      max-height: 100px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.85rem;
      margin: 0.5rem 0 1rem;
      word-break: break-word;
      color: rgba(255,255,255,0.9);
    }

    /* 结果展示页 */
    #resultPage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: inherit;
      z-index: 999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.5s ease;
    }
    #resultPage.active {
      display: flex;
    }

    .big-message {
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255,255,255,0.6);
      margin: 0.5rem;
      animation: heartBeat 1.5s infinite;
      color: white;
    }
    .sub-message {
      font-size: 1.2rem;
      opacity: 0.9;
      margin: 0.8rem;
      color: white;
    }
    .countdown-text {
      font-size: 1rem;
      background: rgba(0,0,0,0.2);
      padding: 6px 16px;
      border-radius: 20px;
      margin: 0.5rem;
    }

    @keyframes heartBeat {
      0%{transform:scale(1);}
      15%{transform:scale(1.15);}
      30%{transform:scale(1);}
      45%{transform:scale(1.1);}
      60%{transform:scale(1);}
    }

    .result-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 1.5rem;
    }

    /* 弹窗样式 */
    .blessing-popup {
      position: fixed;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      color: #333;
      padding: 16px 22px;
      border-radius: var(--radius);
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      z-index: 100;
      pointer-events: none;
      font-weight: 500;
      max-width: 80vw;
      word-break: break-word;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transition: opacity 0.5s, transform 0.5s;
    }
    .blessing-popup.whisper {
      animation: whisperUp 4s linear forwards;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 25px;
      background: rgba(255,255,255,0.85);
    }
    @keyframes popIn {
      0%{opacity:0; transform:scale(0.5) rotate(-10deg);}
      100%{opacity:1; transform:scale(1) rotate(0deg);}
    }
    @keyframes whisperUp {
      0%{bottom:-10%;opacity:0;}
      20%{opacity:1;}
      80%{opacity:1;}
      100%{bottom:110%;opacity:0;}
    }

    /* 爱心雨特效 (语音触发) */
    .love-rain {
      position: fixed;
      top: -60px;
      font-size: 30px;
      animation: rainFall linear forwards;
      z-index: 200;
      pointer-events: none;
    }
    @keyframes rainFall {
      to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* 声波爱心 */
    #voiceLove {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 50px;
      z-index: 150;
      transition: transform 0.05s;
      pointer-events: none;
      display: none;
    }
    #voiceLove.active {
      display: block;
    }

    /* 浮动按钮 */
    .float-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 200;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 24px;
      font-size: 1rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .float-btn.show {
      display: flex;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      .card { padding: 1.5rem 1rem; }
      button { padding: 12px 18px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <!-- 背景粒子 (天气/爱心混合) -->
  <div id="particles-container"></div>

  <!-- 声波跳动爱心 -->
  <div id="voiceLove">❤️</div>

  <!-- 主配置区 -->
  <div class="container" id="mainBg">
    <section id="step1" class="active">
      <div class="card">
        <h2>✨ 你是谁？</h2>
        <input type="text" id="myName" placeholder="你的名字..." value="">
        <button onclick="nextStep(2)">下一步</button>
      </div>
    </section>

    <section id="step2">
      <div class="card">
        <h2>💌 你想对谁表白？</h2>
        <input type="text" id="targetName" placeholder="TA的名字..." value="">
        <div class="btn-group">
          <button class="prev" onclick="nextStep(1)">上一步</button>
          <button onclick="nextStep(3)">下一步</button>
        </div>
      </div>
    </section>

    <section id="step3">
      <div class="card">
        <h2>🎵 选择背景音乐</h2>
        <select id="musicSelect">
          <option value="441491828">告白气球 - 周杰伦</option>
          <option value="1859245">恋爱循环 - 花泽香菜</option>
          <option value="1397345903">我想和你在一起 - 郑国锋</option>
        </select>
        <p style="font-size:0.8rem;opacity:0.8;">音乐将在表白时播放</p>
        <div class="btn-group">
          <button class="prev" onclick="nextStep(2)">上一步</button>
          <button onclick="nextStep(4)">下一步</button>
        </div>
      </div>
    </section>

    <section id="step4">
      <div class="card">
        <h2>🎨 定制浪漫风格</h2>
        <label>背景主题：</label>
        <select id="themeSelect" onchange="changeBg(this.value)">
          <option value="linear-gradient(135deg, #feb47b 0%, #ff7e5f 100%)">经典浪漫</option>
          <option value="linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)">梦幻紫罗兰</option>
          <option value="linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)">清新薄荷</option>
        </select>
        <label>弹窗圆角：<span id="radiusValue">15</span>px</label>
        <input type="range" id="radiusInput" min="0" max="50" value="15" oninput="document.getElementById('radiusValue').textContent=this.value">
        <label>弹窗速度：<span id="speedValue">1.5</span>秒</label>
        <input type="range" id="speedInput" min="0.5" max="4" step="0.5" value="1.5" oninput="document.getElementById('speedValue').textContent=this.value">
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="whisperMode" style="width:auto;margin:0;"> 悄悄话模式
        </label>
        <div class="btn-group">
          <button class="prev" onclick="nextStep(3)">上一步</button>
          <button onclick="nextStep(5)">下一步</button>
        </div>
      </div>
    </section>

    <section id="step5">
      <div class="card">
        <h2>💬 表白寄语</h2>
        <label>寄语模式：</label>
        <select id="msgType" onchange="handleMsgTypeChange()">
          <option value="official">官方 100+ 祝福语库</option>
          <option value="custom">单句深情告白</option>
          <option value="customList">自定义多条 (每行一句)</option>
        </select>
        <div id="customSingleBox">
          <input type="text" id="customMsg" placeholder="输入一句专属告白...">
        </div>
        <div id="customListBox" style="display:none;">
          <textarea id="customList" placeholder="每行一句祝福语"></textarea>
        </div>
        <div class="preview-box">🌟 预览：<span id="previewText">遇见你，是我这辈子最美的意外。</span></div>
        <div class="btn-group">
          <button class="prev" onclick="nextStep(4)">上一步</button>
          <button onclick="nextStep(6)">下一步</button>
        </div>
      </div>
    </section>

    <!-- 新增步骤：纪念日 & 手写画板 -->
    <section id="step6">
      <div class="card">
        <h2>📅 纪念日 & 手写心</h2>
        <label>📆 设置纪念日（可选）</label>
        <input type="date" id="anniversaryDate">
        <label>✍️ 画下你的心意（可保存）</label>
        <canvas id="drawCanvas" width="280" height="180"></canvas>
        <div class="btn-group" style="margin-top:0.5rem;">
          <button class="secondary" onclick="clearCanvas()">清除</button>
          <button class="secondary" onclick="saveDrawing()">保存画作</button>
        </div>
        <div class="btn-group">
          <button class="prev" onclick="nextStep(5)">上一步</button>
          <button onclick="startShow()">✨ 开始表白</button>
        </div>
      </div>
    </section>
  </div>

  <!-- 结果展示页（高潮） -->
  <div id="resultPage">
    <div class="big-message" id="resultTitle">亲爱的</div>
    <div class="sub-message" id="resultSubtitle"></div>
    <div class="countdown-text" id="countdownDisplay"></div>
    <div class="result-buttons">
      <button onclick="startBlessingPopups()">🎉 开始弹幕祝福</button>
      <button class="secondary" onclick="resetAll()">🔄 重新设置</button>
    </div>
    <p style="margin-top:15px; font-size:0.8rem; opacity:0.7; color:white;">
      🎤 点击麦克风按钮说出“我爱你”或TA的名字
    </p>
    <button id="micButton" style="margin-top:10px; background:#fff; color:#ff4d79; box-shadow:none;" onclick="startVoiceRecognition()">🎙️ 开启语音惊喜</button>
  </div>

  <!-- 浮动停止/继续按钮 -->
  <button class="float-btn" id="floatStopBtn" onclick="togglePopups()">
    <span id="floatIcon">⏸️</span> <span id="floatText">停止弹幕</span>
  </button>

  <!-- 隐藏的音乐容器 -->
  <div id="musicContainer" style="display:none;"></div>

  <script>
    (function() {
      // ---------- 全局变量 ----------
      let popupInterval = null;
      let isPopupActive = false;
      let currentConfig = {};
      let savedDrawing = null; // 存储画板图片 dataURL
      let voiceRecognition = null;
      let audioContext = null;
      let analyser = null;
      let micStream = null;
      let animationId = null;

      const blessings = [
        "遇见你，是我这辈子最美的意外。", "往后余生，风雪是你，平淡是你。",
        "你是我所有温柔的归宿。", "如果你累了，我的肩膀永远给你靠。",
        "众生皆苦，唯有你是草莓味。", "你出现的那一刻，世界都亮了。",
        "山河远阔，人间烟火，无一是你，无一不是你。", "想和你一起看清晨的日出。",
        "你是我唯一的偏爱。", "我的心里从此住了一个人。"
      ];
      for(let i=11; i<=110; i++) blessings.push(`第${i}份爱：你是人间理想，是我心头的白月光。`);

      function $(id) { return document.getElementById(id); }

      // ---------- 步骤切换 ----------
      window.nextStep = function(step) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        $('step' + step).classList.add('active');
        if (step === 5) updatePreview();
        if (step === 6) initCanvas();
      };

      window.changeBg = function(val) {
        $('mainBg').style.background = val;
        document.body.style.background = val;
      };

      window.handleMsgTypeChange = function() {
        const type = $('msgType').value;
        $('customSingleBox').style.display = type === 'custom' ? 'block' : 'none';
        $('customListBox').style.display = type === 'customList' ? 'block' : 'none';
        updatePreview();
      };

      function updatePreview() {
        const type = $('msgType').value;
        let preview = '';
        if (type === 'official') preview = blessings.slice(0,3).join(' ； ');
        else if (type === 'custom') preview = $('customMsg').value || '(未输入)';
        else if (type === 'customList') {
          const lines = $('customList').value.split('\n').filter(l=>l.trim()!=='');
          preview = lines.length>0 ? lines.slice(0,3).join(' ； ') : '(未输入)';
        }
        $('previewText').textContent = preview || '...';
      }
      $('customMsg').addEventListener('input', updatePreview);
      $('customList').addEventListener('input', updatePreview);
      $('msgType').addEventListener('change', updatePreview);

      function getBlessingList() {
        const type = currentConfig.msgType;
        if (type === 'official') return blessings;
        if (type === 'custom') return currentConfig.customMsg ? [currentConfig.customMsg] : blessings;
        if (type === 'customList') {
          const lines = currentConfig.customList.split('\n').filter(l=>l.trim()!=='');
          return lines.length>0 ? lines : blessings;
        }
        return blessings;
      }
      function getRandomBlessing() {
        const list = getBlessingList();
        return list[Math.floor(Math.random() * list.length)];
      }

      // ---------- 背景粒子（天气联动） ----------
      let weatherType = 'default'; // 'clear','rain','clouds', etc.
      function createParticle() {
        const container = $('particles-container');
        const icons = weatherType === 'rain' ? ['💧','💧','💧','☔'] :
                      weatherType === 'clouds' ? ['☁️','☁️','⛅'] :
                      weatherType === 'clear' ? ['☀️','🌤️','✨'] :
                      ['❤️','✨','🌸','💕','🌟'];
        const el = document.createElement('div');
        el.className = weatherType !== 'default' ? 'weather-particle' : 'particle';
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        el.style.left = Math.random()*100 + '%';
        el.style.animationDuration = (Math.random()*8+6) + 's';
        el.style.fontSize = (Math.random()*20+15) + 'px';
        container.appendChild(el);
        setTimeout(() => el.remove(), 14000);
      }
      setInterval(createParticle, 800);
      for(let i=0;i<12;i++) setTimeout(createParticle, i*150);

      // 获取天气（免费API）
      async function fetchWeather() {
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, {timeout:5000});
          });
          const {latitude, longitude} = pos.coords;
          const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
          const data = await resp.json();
          const code = data.current_weather.weathercode;
          // 简单映射：0 晴天，1-3 多云，45-48 雾，51-67 雨，71-77 雪
          if (code === 0) weatherType = 'clear';
          else if (code >=1 && code<=3) weatherType = 'clouds';
          else if (code >=51 && code<=67) weatherType = 'rain';
          else weatherType = 'default';
        } catch (e) {
          weatherType = 'default';
        }
      }
      fetchWeather();

      // ---------- 震动反馈 ----------
      function vibrate(ms=30) { if(navigator.vibrate) navigator.vibrate(ms); }

      // 长按心跳震动
      let pressTimer = null;
      let heartVibeInterval = null;
      document.addEventListener('pointerdown', (e) => {
        pressTimer = setTimeout(() => {
          if (heartVibeInterval) clearInterval(heartVibeInterval);
          heartVibeInterval = setInterval(() => vibrate(100), 200); // 模拟心跳
        }, 500);
      });
      document.addEventListener('pointerup', () => {
        clearTimeout(pressTimer);
        if (heartVibeInterval) { clearInterval(heartVibeInterval); heartVibeInterval = null; }
      });
      document.addEventListener('pointercancel', () => {
        clearTimeout(pressTimer);
        if (heartVibeInterval) { clearInterval(heartVibeInterval); heartVibeInterval = null; }
      });

      // ---------- 语音识别 & 爱心雨 ----------
      window.startVoiceRecognition = function() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
          alert('您的浏览器不支持语音识别，请用Chrome打开。');
          return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (voiceRecognition) voiceRecognition.stop();
        voiceRecognition = new SpeechRecognition();
        voiceRecognition.lang = 'zh-CN';
        voiceRecognition.interimResults = false;
        voiceRecognition.continuous = true;
        voiceRecognition.onresult = (event) => {
          const transcript = event.results[event.results.length-1][0].transcript.trim();
          const target = currentConfig.targetName || '';
          if (transcript.includes('我爱你') || (target && transcript.includes(target))) {
            triggerLoveRain();
            vibrate(100);
          }
        };
        voiceRecognition.start();
        $('micButton').textContent = '🎙️ 正在聆听...';
        $('micButton').style.background = '#ff4d79';
        $('micButton').style.color = 'white';
      };

      function triggerLoveRain() {
        for (let i=0; i<30; i++) {
          setTimeout(() => {
            const rain = document.createElement('div');
            rain.className = 'love-rain';
            rain.textContent = ['❤️','💕','💖','💘','💝'][Math.floor(Math.random()*5)];
            rain.style.left = Math.random()*100 + '%';
            rain.style.animationDuration = (Math.random()*2+2) + 's';
            rain.style.fontSize = (Math.random()*30+20) + 'px';
            document.body.appendChild(rain);
            setTimeout(() => rain.remove(), 3000);
          }, i*50);
        }
      }

      // ---------- 声波跳动爱心 ----------
      async function startVoiceLove() {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          const source = audioContext.createMediaStreamSource(micStream);
          source.connect(analyser);
          analyser.fftSize = 256;
          const bufferLength = analyser.frequencyBinCount;
          const dataArray = new Uint8Array(bufferLength);
          const loveEl = $('voiceLove');
          loveEl.classList.add('active');
          function updateLove() {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i=0; i<bufferLength; i++) sum += dataArray[i];
            const avg = sum / bufferLength;
            const scale = 0.8 + avg/128 * 0.8; // 0.8~1.6
            loveEl.style.transform = `translateX(-50%) scale(${scale})`;
            animationId = requestAnimationFrame(updateLove);
          }
          updateLove();
        } catch (e) {
          console.log('麦克风权限未获取');
        }
      }

      // ---------- 画板功能 ----------
      let canvas, ctx, drawing = false;
      function initCanvas() {
        canvas = $('drawCanvas');
        ctx = canvas.getContext('2d');
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ff4d79';
        ctx.lineCap = 'round';
        if (!canvas._eventsAttached) {
          canvas.addEventListener('pointerdown', startDraw);
          canvas.addEventListener('pointermove', draw);
          canvas.addEventListener('pointerup', endDraw);
          canvas.addEventListener('pointerleave', endDraw);
          canvas._eventsAttached = true;
        }
      }
      function startDraw(e) {
        drawing = true;
        const rect = canvas.getBoundingClientRect();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
      }
      function draw(e) {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
      }
      function endDraw() { drawing = false; }
      window.clearCanvas = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      };
      window.saveDrawing = function() {
        savedDrawing = canvas.toDataURL();
        alert('画作已保存，将在弹窗中随机出现！');
      };

      // ---------- 纪念日倒计时 ----------
      function updateCountdown() {
        if (!currentConfig.anniversaryDate) return '';
        const target = new Date(currentConfig.anniversaryDate);
        const now = new Date();
        const diff = target - now;
        if (diff <= 0) return '🎉 纪念日已到！';
        const days = Math.floor(diff / (1000*60*60*24));
        const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
        return `距纪念日还有 ${days} 天 ${hours} 时 ${minutes} 分`;
      }

      // ---------- 开始表白 ----------
      window.startShow = function() {
        currentConfig.myName = $('myName').value || '我';
        currentConfig.targetName = $('targetName').value || '你';
        currentConfig.musicId = $('musicSelect').value;
        currentConfig.theme = $('themeSelect').value;
        currentConfig.radius = $('radiusInput').value + 'px';
        currentConfig.speed = parseFloat($('speedInput').value) * 1000;
        currentConfig.msgType = $('msgType').value;
        currentConfig.customMsg = $('customMsg').value;
        currentConfig.customList = $('customList').value;
        currentConfig.whisper = $('whisperMode').checked;
        currentConfig.anniversaryDate = $('anniversaryDate').value;

        changeBg(currentConfig.theme);
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));

        $('resultTitle').textContent = `亲爱的 ${currentConfig.targetName}`;
        $('resultSubtitle').textContent = `—— 来自 ${currentConfig.myName} 的深情告白`;
        $('countdownDisplay').textContent = updateCountdown();
        $('resultPage').classList.add('active');

        // 音乐
        const mc = $('musicContainer');
        mc.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = `https://music.163.com/outchain/player?type=2&id=${currentConfig.musicId}&auto=1&height=66`;
        mc.appendChild(iframe);

        vibrate(50);
        startVoiceLove(); // 开启声波爱心
      };

      // 弹幕控制
      window.startBlessingPopups = function() {
        $('resultPage').classList.remove('active');
        $('floatStopBtn').classList.add('show');
        $('floatIcon').textContent = '⏸️';
        $('floatText').textContent = '停止弹幕';
        startPopupInterval();
        isPopupActive = true;
        vibrate(20);
      };

      window.togglePopups = function() {
        if (isPopupActive) {
          stopPopupInterval();
          $('floatIcon').textContent = '▶️';
          $('floatText').textContent = '继续弹幕';
          isPopupActive = false;
        } else {
          startPopupInterval();
          $('floatIcon').textContent = '⏸️';
          $('floatText').textContent = '停止弹幕';
          isPopupActive = true;
        }
      };

      function startPopupInterval() {
        if (popupInterval) clearInterval(popupInterval);
        const speed = currentConfig.speed || 1500;
        const radius = currentConfig.radius || '15px';
        const whisper = currentConfig.whisper;
        const myName = currentConfig.myName;
        const targetName = currentConfig.targetName;

        popupInterval = setInterval(() => {
          const popup = document.createElement('div');
          popup.className = 'blessing-popup' + (whisper ? ' whisper' : '');
          popup.style.borderRadius = radius;

          let content = getRandomBlessing();
          if (!whisper) content = `${targetName}，${content} —— ${myName}`;
          popup.innerText = content;

          // 随机附加手绘画作
          if (savedDrawing && Math.random() < 0.4) {
            const img = document.createElement('img');
            img.src = savedDrawing;
            img.style.width = '60px';
            img.style.height = '40px';
            img.style.marginLeft = '8px';
            img.style.verticalAlign = 'middle';
            popup.appendChild(img);
          }

          if (!whisper) {
            popup.style.left = Math.max(10, Math.random()*(window.innerWidth-200)) + 'px';
            popup.style.top = Math.max(10, Math.random()*(window.innerHeight-100)) + 'px';
            popup.style.transform = `rotate(${(Math.random()-0.5)*30}deg) scale(${0.8+Math.random()*0.6})`;
          }

          document.body.appendChild(popup);
          vibrate(15);
          const dt = whisper ? 4000 : speed;
          setTimeout(() => popup.style.opacity='0', dt*0.7);
          setTimeout(() => { if(popup.parentNode) popup.remove(); }, dt+200);
        }, whisper ? 2000 : 800);
      }

      function stopPopupInterval() {
        if (popupInterval) { clearInterval(popupInterval); popupInterval = null; }
      }

      window.resetAll = function() {
        stopPopupInterval();
        isPopupActive = false;
        $('floatStopBtn').classList.remove('show');
        $('resultPage').classList.remove('active');
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        $('step1').classList.add('active');
        $('musicContainer').innerHTML = '';
        if (voiceRecognition) voiceRecognition.stop();
        $('micButton').textContent = '🎙️ 开启语音惊喜';
        $('micButton').style.background = '#fff';
        $('micButton').style.color = '#ff4d79';
        $('voiceLove').classList.remove('active');
        if (micStream) micStream.getTracks().forEach(t=>t.stop());
        if (animationId) cancelAnimationFrame(animationId);
      };

      window.addEventListener('beforeunload', () => {
        stopPopupInterval();
        if (micStream) micStream.getTracks().forEach(t=>t.stop());
      });

      updatePreview();
    })();
  </script>
</body>
</html>
