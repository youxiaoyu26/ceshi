});

let _savedWins = null;
let _savedSel = 0;

function setMode(m){
  if(m === state.mode) return;
  state.mode = m;
  document.body.classList.toggle('runmode', m === 'run');
  $('#mEdit').classList.toggle('on', m === 'edit');
  $('#mRun').classList.toggle('on', m === 'run');

  if(m === 'run'){
    _savedWins = {};
    for(const k in state.wins){
      _savedWins[k] = state.wins[k].open;
      if(state.wins[k].open) closeWin(k);
    }
    _savedSel = state.sel;
    state.sel = 0;
  } else {
    if(_savedWins){
      for(const k in _savedWins){
        if(_savedWins[k]) openWin(k);
      }
      _savedWins = null;
    }
    state.sel = _savedSel || 0;
  }
  renderStage();
}
$('#mEdit').addEventListener('click', () => setMode('edit'));
$('#mRun').addEventListener('click', () => setMode('run'));

$('#btnUndo').addEventListener('click', undo);
$('#btnRedo').addEventListener('click', redo);

function walkAll(fn){ const w = n => n.kids.forEach(k => { fn(k); w(k); }); w(state.root); }

function allDraggable(){
  let total = 0, on = 0;
  walkAll(k => { total++; if(k.draggable) on++; });
  return total > 0 && on === total;
}
function anyDraggable(){
  let on = 0;
  walkAll(k => { if(k.draggable) on++; });
  return on > 0;
}
function syncRunDragBtn(){
  const all = allDraggable();
  const any = anyDraggable();
  const b = $('#btnRunDrag');
  b.classList.toggle('on', all);
  b.style.opacity = any ? '1' : '.75';
  b.title = all
    ? '全部元素：运行时可拖拽（点击全部锁定）'
    : '点击让全部元素在运行时都可拖拽';
}

$('#btnRunDrag').addEventListener('click', () => {
  const v = !allDraggable();
  pushUndoNow();
  walkAll(k => { k.draggable = v; });
  renderStage();
  if(state.wins.props.open) renderProps();
  renderHier();
  syncRunDragBtn();
  save();
  toast(v ? '全部元素：运行时可拖拽' : '全部元素：运行时锁定');
});

$('#btnReset').addEventListener('click', () => {
  const html = `
    <div style="padding:4px 2px 12px;color:#8e8b83;font-size:12.5px;line-height:1.9">
      清空全部元素并恢复为默认示例？<br>
      此操作也可用顶部 <b style="color:#e2a355">↺</b> 撤销。
    </div>
    <button class="confirm-btn danger" id="rstOk">确认重置</button>
    <button class="confirm-btn" id="rstCancel"
            style="background:#262624;color:#8e8b83;margin-top:8px">取消</button>
  `;
  $('#sheetTitle').textContent = '确认重置';
  $('#sheetBody').innerHTML = html;
  $('#sheetMask').classList.add('on');

  $('#rstOk').addEventListener('click', () => {
    closeSheet();
    pushUndoNow();
    localStorage.removeItem(STORE);
    buildDemo();
    state.sel = state.root.kids[0] ? state.root.kids[0].id : 0;
    renderStage();
    renderHier();
    if(state.wins.props.open) renderProps();
    if(state.wins.events.open) renderEvents();
    scheduleCode(0);
    save();
    syncRunDragBtn();
    toast('已重置');
  });
  $('#rstCancel').addEventListener('click', closeSheet);
});

function setZoom(z){
  state.zoom = clamp(Math.round(z * 100) / 100, 0.3, 2.5);
  $('#zoomLvl').textContent = Math.round(state.zoom * 100) + '%';
  doCalcStageSize();
  save();
}
$('#zoomIn').addEventListener('click', () => setZoom(state.zoom + 0.15));
$('#zoomOut').addEventListener('click', () => setZoom(state.zoom - 0.15));
$('#zoomLvl').addEventListener('click', () => setZoom(1));

window.addEventListener('keydown', e => {
  if(state.mode !== 'edit') return;

  const ae = document.activeElement;
  if(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  if(ae && ae.isContentEditable) return;

  const meta = e.metaKey || e.ctrlKey;
  if(meta && e.key === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
  if(meta && (e.key === 'y' || (e.key === 'z' && e.shiftKey))){ e.preventDefault(); redo(); return; }
  if(meta && e.key === 'd' && state.sel){
    e.preventDefault();
    const n = findNode(state.sel);
    if(n && n.id !== 0) doNodeAction('clone', n);
    return;
  }

  const isDel = e.key === 'Delete' || e.key === 'Backspace'
             || e.keyCode === 46 || e.keyCode === 8;
  if(isDel && state.sel){
    e.preventDefault();
    deleteNode(state.sel, e.shiftKey);
    return;
  }

  if(e.key === 'Escape'){ selectNode(0); return; }

  const step = e.shiftKey ? 10 : 1;
  if(state.sel && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    const n = findNode(state.sel);
    if(!n || n.id === 0) return;
    pushUndo();
    if(e.key === 'ArrowUp') n.y -= step;
    if(e.key === 'ArrowDown') n.y += step;
    if(e.key === 'ArrowLeft') n.x -= step;
    if(e.key === 'ArrowRight') n.x += step;
    updateEl(n);
    scheduleCode();
    save();
    schedulePropsRender();
  }
});

  card.kids.push(title, desc, slider, progress, toggle, btn, btn2, chip);

  badge.bg = '#d65a55'; badge.color = '#ffffff';
  state.root.kids.push(badge);

  const push = (src, ev, target, action, params) => {
    src.events[ev].push({
      id: state.nextId++, t: target.id, a: action, p: params || {},
    });
  };
  push(btn, 'onClick', chip, 'setBg', { v: '#d65a55' });
  push(btn, 'onClick', chip, 'setColor', { v: '#ffffff' });
  push(btn, 'onClick', chip, 'alert', { v: '按钮事件已触发！' });
  push(btn2, 'onClick', circle, 'toggle');
  push(circle, 'onDrag', chip, 'scaleTo', { v: 1.15 });
  push(slider, 'onClick', progress, 'setOpacity', { v: 1 });
}

/* =========================================================
   20. 初始化
   ========================================================= */
(function init(){
  const loaded = load();
  if(!loaded){
    buildDemo();
    state.wins.hier.open = true;
  }

  applyWin('hier');
  applyWin('props');
  applyWin('events');
  applyWin('code');
  syncDock();
  syncRunDragBtn();
  $('#zoomLvl').textContent = Math.round(state.zoom * 100) + '%';
  syncUndoBtns();

  if(!state.sel && state.root.kids[0]){
    state.sel = state.root.kids[0].id;
  }

  renderStage();
  renderHier();
  renderProps();
  if(state.wins.code.open) renderCode();

  if(state.mode === 'run') setMode('edit');

  window.addEventListener('resize', () => {
    doCalcStageSize();
    const vw = window.innerWidth, vh = window.innerHeight;
    for(const k in state.wins){
      const w = state.wins[k];
      w.x = Math.max(0, Math.min(vw - 80, w.x));
      w.y = Math.max(48, Math.min(vh - 60, w.y));
      if(w.open) applyWin(k);
    }
  });

  document.addEventListener('visibilitychange', () => {
    if(document.hidden) saveNow();
  });
})();
