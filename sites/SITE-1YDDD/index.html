<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>无聊点 · 解闷小页面合集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1e1e2f 0%, #2a2a40 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.2rem;
      margin: 0;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 2.5rem;
      padding: 1.8rem 1.5rem 2rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
    }

    h1 {
      text-align: center;
      font-weight: 500;
      font-size: 2.2rem;
      letter-spacing: 4px;
      color: #d9d9e3;
      margin-bottom: 1.5rem;
      text-shadow: 0 4px 10px rgba(0,0,0,0.4);
      word-break: break-word;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.5rem;
      border-radius: 3rem;
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #b0b0c0;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.6rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.5px;
      flex: 1 0 auto;
      white-space: nowrap;
      background: rgba(255,255,255,0.05);
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255,255,255,0.2);
    }

    .tab-btn.active {
      background: #f1c40f;
      color: #1e1e2f;
      font-weight: 600;
      box-shadow: 0 6px 14px rgba(241, 196, 15, 0.4);
      border: none;
    }

    .panel {
      display: none;
      animation: fade 0.35s ease;
      background: rgba(20, 20, 30, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1.8rem 1.2rem;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .panel.active {
      display: block;
    }

    @keyframes fade {
      from { opacity: 0.3; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .boredom-widget {
      text-align: center;
      color: #e0e0e8;
    }

    button {
      background: #f1c40f;
      border: none;
      color: #1e1e2f;
      font-weight: bold;
      padding: 0.7rem 1.8rem;
      border-radius: 3rem;
      font-size: 1rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
      margin-top: 1rem;
      background: linear-gradient(135deg, #f9ca24, #f39c12);
    }

    button:active {
      transform: scale(0.96);
    }

    .counter-display {
      font-size: 3.5rem;
      font-weight: 700;
      background: rgba(0,0,0,0.5);
      padding: 0.8rem 1.8rem;
      border-radius: 2rem;
      display: inline-block;
      margin: 0.8rem 0;
      letter-spacing: 2px;
      color: #f1c40f;
    }

    .bubble-box {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      margin: 1.5rem 0;
    }

    .bubble {
      background: #f39c12;
      border-radius: 50%;
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #1e1e2f;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0,0,0,0.4);
      transition: 0.15s;
      font-size: 1.3rem;
    }

    .bubble:active {
      transform: scale(0.8);
      opacity: 0.8;
    }

    .fact-text {
      font-style: italic;
      background: rgba(255,255,255,0.1);
      padding: 1rem;
      border-radius: 1.5rem;
      margin: 1rem 0;
    }

    .slider-value {
      font-size: 2rem;
      font-weight: bold;
      color: #f1c40f;
    }

    input[type=range] {
      width: 100%;
      margin: 0.8rem 0;
    }

    .dot-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.8rem;
      justify-items: center;
      margin: 1.2rem 0;
    }

    .dot {
      width: 38px;
      height: 38px;
      background: #444;
      border-radius: 50%;
      transition: 0.1s;
    }

    .progress-bar {
      height: 18px;
      background: #2c2c3a;
      border-radius: 20px;
      margin: 1.2rem 0;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #f1c40f;
      border-radius: 20px;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>✨ 无聊点 ✨</h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="clicker">🔘 点点点</button>
    <button class="tab-btn" data-tab="bubbles">🫧 捏泡泡</button>
    <button class="tab-btn" data-tab="slider">🎚️ 滑条</button>
    <button class="tab-btn" data-tab="fact">📚 冷知识</button>
    <button class="tab-btn" data-tab="dots">🔴 点点阵</button>
    <button class="tab-btn" data-tab="counter">🧮 计数器</button>
    <button class="tab-btn" data-tab="progress">📊 进度条</button>
    <button class="tab-btn" data-tab="color">🎨 变色</button>
    <button class="tab-btn" data-tab="mood">😐 心情</button>
  </div>

  <!-- 面板们 -->
  <div class="panel active" id="clicker">
    <div class="boredom-widget">
      <h2>👆 纯点击</h2>
      <p>点击次数：</p>
      <div class="counter-display" id="clickCount">0</div>
      <button id="clickBtn">点我！</button>
      <button id="resetClickBtn" style="background:#7f8c8d; margin-left:0.5rem;">重置</button>
    </div>
  </div>

  <div class="panel" id="bubbles">
    <div class="boredom-widget">
      <h2>🫧 捏泡泡纸</h2>
      <p>戳破它们~</p>
      <div class="bubble-box" id="bubbleContainer"></div>
      <button id="refreshBubbles">🔄 新泡泡</button>
    </div>
  </div>

  <div class="panel" id="slider">
    <div class="boredom-widget">
      <h2>🎚️ 无聊滑动</h2>
      <span class="slider-value" id="sliderValue">50</span>
      <input type="range" id="boredSlider" min="0" max="100" value="50">
      <p>当前无聊指数</p>
    </div>
  </div>

  <div class="panel" id="fact">
    <div class="boredom-widget">
      <h2>📚 无用冷知识</h2>
      <div class="fact-text" id="factDisplay">点击按钮获取无聊知识</div>
      <button id="newFactBtn">🔄 再来一条</button>
    </div>
  </div>

  <div class="panel" id="dots">
    <div class="boredom-widget">
      <h2>🔴 点亮格子</h2>
      <div class="dot-grid" id="dotGrid"></div>
      <button id="clearDots">🧹 清除</button>
    </div>
  </div>

  <div class="panel" id="counter">
    <div class="boredom-widget">
      <h2>🧮 加减计数器</h2>
      <div class="counter-display" id="counterValue">0</div>
      <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
        <button id="decrementBtn">➖</button>
        <button id="incrementBtn">➕</button>
      </div>
      <button id="resetCounterBtn" style="background:#95a5a6;">归零</button>
    </div>
  </div>

  <div class="panel" id="progress">
    <div class="boredom-widget">
      <h2>📊 无聊进度</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <p><span id="progressPercent">0</span>%</p>
      <button id="addProgressBtn">➕ 增加进度</button>
      <button id="resetProgressBtn" style="background:#7f8c8d;">重置</button>
    </div>
  </div>

  <div class="panel" id="color">
    <div class="boredom-widget">
      <h2>🎨 随机变色</h2>
      <div id="colorBox" style="width:100px; height:100px; background:#f1c40f; margin:1rem auto; border-radius:1.5rem; box-shadow:0 0 20px rgba(0,0,0,0.5);"></div>
      <button id="changeColorBtn">🎲 换颜色</button>
    </div>
  </div>

  <div class="panel" id="mood">
    <div class="boredom-widget">
      <h2>😐 今天心情</h2>
      <div style="font-size:4rem;" id="moodEmoji">😐</div>
      <div style="display:flex; gap:0.8rem; justify-content:center; flex-wrap:wrap; margin-top:1rem;">
        <button class="mood-btn" data-mood="😄">开心</button>
        <button class="mood-btn" data-mood="😴">困</button>
        <button class="mood-btn" data-mood="😡">生气</button>
        <button class="mood-btn" data-mood="🥳">兴奋</button>
        <button class="mood-btn" data-mood="😐">无聊</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // --- 标签页切换 ---
    const tabs = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.panel');

    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        const tabId = btn.getAttribute('data-tab');
        tabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        panels.forEach(p => p.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
      });
    });

    // --- 1. 点击器 ---
    let clickCount = 0;
    const clickDisplay = document.getElementById('clickCount');
    document.getElementById('clickBtn').addEventListener('click', () => {
      clickCount++;
      clickDisplay.textContent = clickCount;
    });
    document.getElementById('resetClickBtn').addEventListener('click', () => {
      clickCount = 0;
      clickDisplay.textContent = clickCount;
    });

    // --- 2. 泡泡纸 ---
    const bubbleContainer = document.getElementById('bubbleContainer');
    function createBubbles(count = 12) {
      bubbleContainer.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = '💥';
        bubble.addEventListener('click', function(e) {
          this.style.opacity = '0';
          this.style.transform = 'scale(0.2)';
          setTimeout(() => { this.remove(); }, 200);
        });
        bubbleContainer.appendChild(bubble);
      }
    }
    createBubbles();
    document.getElementById('refreshBubbles').addEventListener('click', () => createBubbles(12));

    // --- 3. 滑动条 ---
    const slider = document.getElementById('boredSlider');
    const sliderValue = document.getElementById('sliderValue');
    slider.addEventListener('input', (e) => {
      sliderValue.textContent = e.target.value;
    });

    // --- 4. 冷知识 ---
    const facts = [
      "章鱼有三颗心脏。",
      "香蕉其实是浆果，而草莓不是。",
      "打喷嚏时心脏会暂停一瞬间。",
      "猪几乎看不到天空。",
      "你无法同时呼吸和吞咽。",
      "平均而言，人一生会花6个月坐在红灯前。",
      "考拉的指纹与人类几乎无法区分。",
      "蜂蜜永远不会变质。",
      "蜗牛可以睡三年。",
      "大象是唯一不会跳的哺乳动物。"
    ];
    const factDisplay = document.getElementById('factDisplay');
    document.getElementById('newFactBtn').addEventListener('click', () => {
      const randomFact = facts[Math.floor(Math.random() * facts.length)];
      factDisplay.textContent = randomFact;
    });

    // --- 5. 点点阵 ---
    const dotGrid = document.getElementById('dotGrid');
    function buildDotGrid(rows = 4, cols = 5) {
      dotGrid.innerHTML = '';
      dotGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      for (let i = 0; i < rows * cols; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.addEventListener('click', function() {
          const currentColor = this.style.backgroundColor;
          if (!currentColor || currentColor === 'rgb(68, 68, 68)' || currentColor === '#444') {
            this.style.backgroundColor = '#f1c40f';
          } else {
            this.style.backgroundColor = '#444';
          }
        });
        dotGrid.appendChild(dot);
      }
    }
    buildDotGrid();
    document.getElementById('clearDots').addEventListener('click', () => {
      document.querySelectorAll('.dot').forEach(d => d.style.backgroundColor = '#444');
    });

    // --- 6. 计数器 ---
    let counterVal = 0;
    const counterDisplay = document.getElementById('counterValue');
    document.getElementById('incrementBtn').addEventListener('click', () => {
      counterVal++;
      counterDisplay.textContent = counterVal;
    });
    document.getElementById('decrementBtn').addEventListener('click', () => {
      counterVal--;
      counterDisplay.textContent = counterVal;
    });
    document.getElementById('resetCounterBtn').addEventListener('click', () => {
      counterVal = 0;
      counterDisplay.textContent = counterVal;
    });

    // --- 7. 进度条 ---
    let progress = 0;
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    document.getElementById('addProgressBtn').addEventListener('click', () => {
      if (progress < 100) {
        progress = Math.min(progress + 10, 100);
        progressFill.style.width = progress + '%';
        progressPercent.textContent = progress;
      }
    });
    document.getElementById('resetProgressBtn').addEventListener('click', () => {
      progress = 0;
      progressFill.style.width = '0%';
      progressPercent.textContent = '0';
    });

    // --- 8. 变色 ---
    const colorBox = document.getElementById('colorBox');
    document.getElementById('changeColorBtn').addEventListener('click', () => {
      const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
      colorBox.style.backgroundColor = randomColor;
    });

    // --- 9. 心情 ---
    const moodEmoji = document.getElementById('moodEmoji');
    document.querySelectorAll('.mood-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const mood = this.getAttribute('data-mood');
        moodEmoji.textContent = mood;
      });
    });

  })();
</script>
</body>
</html>
