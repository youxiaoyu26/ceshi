    let canvas, ctx, particles = [];
    function initParticles() {
        canvas = document.getElementById('particles');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx = canvas.getContext('2d');
        for(let i=0;i<40;i++) particles.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, vx:(Math.random()-0.5)*0.3, vy:Math.random()*0.3+0.15, size:Math.random()*2.5+0.5, color:'#8ece8e' });
        function animate() {
            if(!ctx) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for(let p of particles) {
                ctx.beginPath();
                ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                if(p.y > canvas.height) p.y = 0;
                if(p.x > canvas.width) p.x = 0;
                if(p.x < 0) p.x = canvas.width;
            }
            requestAnimationFrame(animate);
        }
        animate();
    }
    window.addEventListener('resize', () => { if(canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } });
    initParticles();
    
    function render() {
        let container = document.getElementById('content');
        if(step === 1) {
            let html = `<div class="scene-card"><div class="badge">🍏 青涩开篇</div>你和TF四代的他，正在谈一场不能公开的青涩秘密。<br><br>走廊、食堂、教室、大巴、操场、天台、校门口……每一个眼神、一次对视，都可能被粉丝拍到。<br><br>藏到最后，才算顶级嫂嫂。</div><div class="question">🍏 第1题 · 锁定你的少年</div><div class="options">`;
            MEMBERS.forEach((n,i) => { html += `<div class="option select-boy" data-boy="${n}" style="border-left:3px solid ${COLORS[n]}">${i+1}. ${n}</div>`; });
            html += `</div><div style="text-align:center; opacity:0.6; padding:10px;">✨ 选择后开始青涩秘密 ✨</div>`;
            container.innerHTML = html;
            document.querySelectorAll('.select-boy').forEach(el => {
                el.addEventListener('click', () => {
                    boy = el.getAttribute('data-boy');
                    randomMate = getRandomMate();
                    step = 2; currentQ = 2; waitNext = false;
                    selectedAHistory = [];
                    playTone('select');
                    render();
                });
            });
            return;
        }
        if(step === 9) {
            let ending = getEnding();
            let isPerfectEnding = isAllAEnding();
            let endingClass = isPerfectEnding ? 'rainbow' : '';
            container.innerHTML = `<div class="story-box"><div class="story-header">📖 最终结局</div><div class="story-text ${endingClass}" style="white-space: pre-line;">${ending}</div></div><div class="flex-row"><div class="back-btn" id="restartBtn">🔄 重新开始</div></div>`;
            if(isPerfectEnding) playTone('perfect');
            document.getElementById('restartBtn')?.addEventListener('click', () => location.reload());
            return;
        }
        let q = QUESTIONS[currentQ];
        if(!q) return;
        let desc = q.desc;
        if(waitNext && currentStory) {
            container.innerHTML = `<div class="scene-card"><div class="badge">🍏 秘密男友：${boy}</div>${q.title}<br>${desc}</div><div class="story-box"><div class="story-header"><span>📖 触发剧情</span><span style="color:#7eae7e;">暴露值 +${lastExp}</span></div><div class="story-text">${currentStory}</div></div><div class="flex-row"><div class="back-btn" id="backtrackBtn">↩️ 回溯 (${backtrackLeft}次)</div><div class="next-btn" id="nextBtn">➡️ 继续守护秘密</div></div>`;
            document.getElementById('nextBtn')?.addEventListener('click', () => {
                if(currentQ === 10) { step = 9; playTone('ending'); render(); }
                else { currentQ++; waitNext = false; playTone('next'); render(); }
            });
            document.getElementById('backtrackBtn')?.addEventListener('click', () => {
                if(backtrackLeft > 0) {
                    backtrackLeft--;
                    waitNext = false;
                    if(selectedAHistory.length > 0) selectedAHistory.pop();
                    exposure = Math.max(0, exposure - lastExp);
                    updateUI();
                    playTone('select');
                    render();
                } else alert('回溯次数已用完');
            });
            return;
        }
        let optsHtml = `<div class="scene-card"><div class="badge">🍏 秘密男友：${boy}</div>🎬 ${q.title}<br>${desc}</div><div class="question">❓ 你的选择</div><div class="options">`;
        for(let key in q.opts) {
            let opt = q.opts[key];
            optsHtml += `<div class="option select-opt" data-opt="${key}" data-isA="${opt.isA}">${opt.txt}</div>`;
        }
        optsHtml += `</div><div style="text-align:center; opacity:0.5; padding:10px;">🍏 点击选项查看剧情，一不小心会被粉丝拍到</div>`;
        container.innerHTML = optsHtml;
        document.querySelectorAll('.select-opt').forEach(el => {
            el.addEventListener('click', (e) => {
                let optKey = el.getAttribute('data-opt');
                let isA = el.getAttribute('data-isA') === 'true';
                let opt = q.opts[optKey];
                if(opt) {
                    selectedAHistory.push(isA);
                    addExp(opt.exp);
                    lastExp = opt.exp;
                    currentStory = opt.story;
                    waitNext = true;
                    playTone('select');
                    render();
                }
            });
        });
    }
    
    document.getElementById('startBtn').addEventListener('click', () => {
        initAudio();
        playTone('select');
        document.getElementById('cover').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
        step = 1; exposure = 0; boy = ""; currentQ = 2; waitNext = false; backtrackLeft = 3; selectedAHistory = [];
        updateUI();
        render();
    });
    document.getElementById('volumeBtn').addEventListener('click', () => {
        soundOn = !soundOn;
        document.getElementById('volumeBtn').innerText = soundOn ? '🔊' : '🔇';
    });
    document.getElementById('game').classList.add('hidden');
    updateUI();
</script>


</body></html>
